<style>
:root {
  --bg:        #F2F1ED;
  --bg-alt:    #E8E4DE;
  --dark:      #1a1917;
  --charcoal:  #302F2C;
  --muted:     #58554E;
  --sand:      #D8CFC4;
  --sand-dark: #8C7F6C;
  --white:     #FFFFFF;
  --border: rgba(58,58,58,0.14);
  --radius:    4px;
  /* cores dos 4 perfis DISC — mantidas, já são terrosas e combinam com a paleta */
  --d: #9B6B52;
  --i: #B08A3E;
  --s: #6B7A5E;
  --c: #5E6E7D;
  --ok-bg: #e8ece2;
  --ok: #4A7A42;
  --warn-bg: #FDF5E6;
  --warn: #7A5200;
  --warn-border: #E8C87A;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 17.5px; }
html, body { min-height: 100vh; background: var(--bg); color: var(--charcoal); font-family: 'DM Sans', sans-serif; font-weight: 300; line-height: 1.75; -webkit-font-smoothing: antialiased; }

/* LAYOUT / NAV */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.85rem 5vw;
  background: rgba(26,25,23,0.97);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #F2F1ED; }
.brand-mark { height: 64px; width: auto; max-width: 220px; object-fit: contain; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-l1 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 15px; }
.brand-l2 { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(242,241,237,0.55); }
.nav-right { display: flex; align-items: center; gap: 1.2rem; }
.nav-socials { display: flex; align-items: center; gap: 0.9rem; }
.nav-socials a { color: rgba(242,241,237,0.6); display: flex; transition: color 0.2s; }
.nav-socials a:hover { color: #F2F1ED; }
.nav-socials svg { width: 19px; height: 19px; }
.admin-btn {
  background: rgba(242,241,237,0.1); border: 1px solid rgba(242,241,237,0.2); color: #F2F1ED;
  font-family: 'DM Sans', sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500;
  padding: 8px 16px; border-radius: var(--radius); cursor: pointer; transition: all .15s;
}
.admin-btn:hover { background: rgba(242,241,237,0.18); border-color: rgba(242,241,237,0.4); }

#app { max-width: 780px; margin: 0 auto; padding: 150px 20px 80px; }

/* CARD */
.card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); padding: 40px; position: relative; overflow: hidden; }
.card-deco { position: absolute; top: -20px; right: -20px; width: 160px; height: 160px; opacity: 0.15; pointer-events: none; }

/* EYEBROW & TITLES */
.eyebrow { display: block; font-size: 0.68rem; font-weight: 500; letter-spacing: 0.25em; text-transform: uppercase; color: var(--sand-dark); margin-bottom: 1.2rem; }
.title { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; line-height: 1.15; margin-bottom: 14px; color: var(--charcoal); }
.title em { font-style: italic; color: var(--dark); }
.lede { font-size: 15px; line-height: 1.85; color: var(--muted); font-weight: 300; margin-bottom: 28px; max-width: 54ch; }

/* PROFILE LEGEND */
.profile-legend { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
.profile-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.profile-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* FORM */
.field-label { display: block; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sand-dark); font-weight: 600; margin-bottom: 8px; margin-top: 18px; }
.field-label:first-of-type { margin-top: 0; }
input[type=text], input[type=email], input[type=tel] {
  width: 100%; font-family: 'DM Sans', sans-serif; font-size: 14px;
  padding: 13px 16px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--charcoal); transition: border-color .15s;
}
input:focus { outline: none; border-color: var(--charcoal); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* BUTTONS */
.btn-primary { font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; background: var(--charcoal); color: #fff; border: none; padding: 14px 28px; border-radius: var(--radius); cursor: pointer; transition: background .15s, transform .15s; }
.btn-primary:hover { background: var(--dark); transform: translateY(-2px); }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { background: var(--sand-dark); cursor: not-allowed; transform: none; }
.btn-ghost { font-family: 'DM Sans', sans-serif; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; background: none; border: 1px solid var(--border); color: var(--charcoal); padding: 13px 22px; border-radius: var(--radius); cursor: pointer; transition: border-color .15s; }
.btn-ghost:hover { border-color: var(--sand-dark); }
.btn-ghost:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-row { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }

/* PROGRESS */
.progress-wrap { margin-bottom: 28px; }
.progress-track { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 10px; }
.progress-fill { height: 100%; background: var(--charcoal); border-radius: 99px; transition: width .3s ease; }
.progress-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

/* SORT / DRAG */
.sort-instruction { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 22px; background: var(--bg); padding: 14px 16px; border-radius: var(--radius); border-left: 3px solid var(--sand-dark); }
.sort-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
.sort-item {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px; background: var(--white);
  border: 1.5px solid var(--border); border-radius: var(--radius);
  cursor: grab; user-select: none;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.sort-item:hover { border-color: var(--sand-dark); background: var(--bg); }
.sort-item.dragging { opacity: 0.4; cursor: grabbing; }
.sort-item.drag-over { border-color: var(--charcoal); background: var(--bg); box-shadow: 0 0 0 3px rgba(58,58,58,0.08); }
.sort-rank {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
  transition: background .2s;
}
.sort-phrase { font-size: 15px; color: var(--charcoal); line-height: 1.45; flex: 1; font-weight: 300; }
.sort-phrase b { font-weight: 600; }
.sort-tag { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
.sort-handle { color: var(--sand-dark); font-size: 18px; flex-shrink: 0; margin-left: 4px; }
.sort-tip { font-size: 11px; color: var(--muted); text-align: center; margin-top: 6px; letter-spacing: 0.04em; }

/* RESULT */
.result-header { margin-bottom: 28px; }
.result-name { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.result-title { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 500; font-style: italic; margin-bottom: 6px; color: var(--charcoal); }
.result-sub { font-size: 14px; color: var(--muted); font-weight: 300; }
.profile-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 99px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; margin-right: 8px; margin-bottom: 8px; }

/* BARS */
.bars { display: flex; flex-direction: column; gap: 16px; margin: 24px 0; }
.bar-row { display: grid; grid-template-columns: 130px 1fr 46px; align-items: center; gap: 12px; }
.bar-label { font-size: 13px; color: var(--charcoal); display: flex; align-items: center; gap: 8px; }
.bar-track { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
.bar-fill { height: 100%; border-radius: 99px; transition: width .6s ease; }
.bar-pct { font-size: 12px; color: var(--muted); text-align: right; }

/* DESC BLOCKS */
.desc-section { margin: 24px 0; }
.desc-section h4 { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 500; margin-bottom: 10px; color: var(--charcoal); }
.desc-block { background: var(--bg); border-radius: var(--radius); padding: 18px 20px; font-size: 14.5px; line-height: 1.8; color: var(--charcoal); margin-bottom: 12px; font-weight: 300; }

/* TWO-COL */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 20px 0; }
.col-card { background: var(--bg); border-radius: var(--radius); padding: 18px; }
.col-card h5 { font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sand-dark); font-weight: 600; margin-bottom: 12px; }
.col-card ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.col-card li { font-size: 13.5px; color: var(--charcoal); font-weight: 300; line-height: 1.5; display: flex; align-items: flex-start; gap: 8px; }
.col-card li::before { content: '•'; color: var(--sand-dark); flex-shrink: 0; margin-top: 1px; }

/* COMPASS SVG AREA */
.compass-wrap { display: flex; justify-content: center; margin: 20px 0; }

/* SAVED NOTE */
.saved-note { font-size: 12px; color: var(--muted); margin: 12px 0; font-style: italic; }
.confirm-box { background: var(--ok-bg); border-radius: var(--radius); padding: 14px 18px; font-size: 13px; color: var(--ok); margin-bottom: 18px; }

/* ADMIN */
.admin-table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 11px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px; color: #fff; letter-spacing: 0.04em; }
.del-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; font-family: 'DM Sans', sans-serif; }
.del-btn:hover { color: var(--d); }
.empty-state { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 14px; }

/* WARNING */
.warning-box { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: var(--radius); padding: 12px 16px; font-size: 13px; color: var(--warn); margin-bottom: 22px; }

@media (max-width: 600px) {
  .card { padding: 24px 18px; }
  #app { padding: 128px 12px 60px; }
  .field-row { grid-template-columns: 1fr; }
  .bar-row { grid-template-columns: 100px 1fr 40px; }
  .two-col { grid-template-columns: 1fr; }
  .title { font-size: 28px; }
}

/* ── Cabeçalho no celular ─────────────────────────────────────
   Na tela estreita a logo, o texto da marca, os ícones de rede
   social e o botão do painel disputavam a mesma linha, e o botão
   saía cortado. O candidato não usa nenhum dos dois no celular,
   então eles somem e sobra espaço para a marca. */
@media (max-width: 760px) {
  .topbar { padding: 0.6rem 4vw; }
  .brand-mark { height: 42px; max-width: 120px; }
  .brand-l1 { font-size: 13px; }
  .brand-l2 { font-size: 8px; letter-spacing: 0.16em; }
  .nav-socials { display: none; }
  .admin-btn { display: none; }
  #app { padding-top: 96px; }
}

/* Botões de ação na tabela do painel: PDF e remover lado a lado */
.pdf-btn, .del-btn {
  background: none; border: 1px solid var(--border, #d8cfc4); border-radius: 6px;
  padding: 4px 10px; font-size: 11px; cursor: pointer; font-family: inherit;
  color: var(--ink-soft, #58554E); margin-left: 4px;
}
.pdf-btn:hover { border-color: #8C7F6C; color: #302F2C; }
.del-btn:hover { border-color: #c0392b; color: #c0392b; }
</style>

// Retorna a URL do formulário da vaga, ou null se a vaga não tiver um.
function formsUrlParaVaga(titulo) {
  const t = (titulo || '').trim();
  if (VAGAS_COM_FORMS_PROPRIO[t]) return VAGAS_COM_FORMS_PROPRIO[t];
  // Comparação tolerante a acento, caixa e espaço extra
  const norm = x => (x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                     .toLowerCase().replace(/\s+/g, ' ').trim();
  const alvo = norm(t);
  const achado = Object.keys(VAGAS_COM_FORMS_PROPRIO).find(k => norm(k) === alvo);
  if (achado) return VAGAS_COM_FORMS_PROPRIO[achado];
  // Comparação por aproximação (contém): cobre título cadastrado com sufixo/prefixo
  // extra no site das vagas (ex.: "Gerente de Marketing - Home Office"), evitando que
  // uma pequena diferença de cadastro derrube o candidato do fluxo silenciosamente.
  const parecido = Object.keys(VAGAS_COM_FORMS_PROPRIO).find(k => {
    const nk = norm(k);
    return nk.length > 3 && (alvo.includes(nk) || nk.includes(alvo));
  });
  return parecido ? VAGAS_COM_FORMS_PROPRIO[parecido] : null;
}

// Casa o título da vaga entre o site e o R&S tolerando diferenças cosméticas:
// sufixo entre parênteses (ex.: "Motorista Carreteiro (5 vagas)"), acento,
// caixa e espaço duplo. Tenta o título exato primeiro; só depois relaxa.
function _tituloBase(t){
  return (t || '').replace(/\s*\([^)]*\)\s*$/, '').replace(/\s+/g, ' ').trim();
}
function _normTitulo(t){
  return _tituloBase(t).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
async function _acharVagaNoRS(rsDb, titulo){
  try{
    const exato = await rsDb.from('vagas').select('id,titulo').ilike('titulo', titulo).limit(1).maybeSingle();
    if (exato?.data?.id) return exato.data;
    const base = _tituloBase(titulo);
    if (base && base !== titulo){
      const semSufixo = await rsDb.from('vagas').select('id,titulo').ilike('titulo', base).limit(1).maybeSingle();
      if (semSufixo?.data?.id) return semSufixo.data;
    }
    // Último recurso: compara normalizado contra a lista de vagas do R&S.
    const todas = await rsDb.from('vagas').select('id,titulo');
    const alvo = _normTitulo(titulo);
    const achou = (todas?.data || []).find(v => _normTitulo(v.titulo) === alvo);
    return achou || null;
  } catch(e){ return null; }
}

async function pushCandidatoSemFormsParaRS(r, vagaTitulo) {
  if (!rsDb || !db) return;
  try {
    const emailNorm = (r.email || '').trim().toLowerCase();
    // Busca o currículo deste candidato através de uma função do banco, em
    // vez de ler a tabela candidaturas direto. Motivo: o candidato não tem
    // login, e a leitura direta exigia deixar a tabela aberta para qualquer
    // visitante. A função devolve só o currículo e só deste e-mail.
    const { data: compl, error: erroCompl } = await db.rpc('lv_complementos_candidato', { p_email: emailNorm });
    if (erroCompl) console.error('Função lv_complementos_candidato falhou:', erroCompl.message);
    const c = Array.isArray(compl) ? (compl[0] || {}) : (compl || {});
    const cvUrl = c.cv_url || null;

    const norm = x => (x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                       .toLowerCase().replace(/\s+/g, ' ').trim();
    const vagaRes = { data: await _acharVagaNoRS(rsDb, vagaTitulo) };
    const vagaId = vagaRes?.data?.id || null;

    const DISC_NOMES = { D:'Dominância', I:'Influência', S:'Estabilidade', C:'Conformidade' };
    // ═ DOSSIÊ DE MATCH AUTOMÁTICO (Nível 1) — versão parcial ═══════════════
    // Chega aqui um candidato que só tem o DISC (o formulário técnico da vaga
    // ainda não existe ou não foi identificado). Sem o quiz/respostas da vaga
    // não dá pra calcular o nível geral — o dossiê fica marcado como
    // "parcial" pra deixar isso explícito pra quem for revisar no R&S.
    const perfilTxt = r.primary ? `${DISC_NOMES[r.primary] || r.primary}${r.secondary ? ' / ' + (DISC_NOMES[r.secondary] || r.secondary) : ''}` : 'não disponível';
    let obs = `🎯 DOSSIÊ DE MATCH (automático) — Nível geral: Parcial (só DISC)\n`
      + `• Perfil comportamental: ${perfilTxt}\n`
      + `• Componente técnico/comercial: ainda não disponível — formulário da vaga não identificado\n`
      + `Formulário técnico da vaga "${vagaTitulo}" não foi identificado automaticamente — verifique/cadastre o mapeamento e complete a etapa manualmente.\n\n`;
    obs += `Perfil DISC: ${perfilTxt}.`;

    // O R&S abre documentos por "path" (link temporário, bucket privado). Com o
    // campo gravado como "url", o clique no arquivo dava "não foi possível abrir".
    const documentos = cvUrl ? [{
      nome:'Currículo', path:cvUrl, origem:'vagas', bucket:'curriculos',
      tipo:'pdf', enviadoEm:new Date().toISOString(), enviadoPor:'Site (automático)'
    }] : [];
    // O candidato é entregue ao R&S por uma função do banco, não gravando na
    // tabela direto. A tabela "candidatos" exige usuário logado e ativo, e o
    // candidato não tem login, então toda gravação era recusada em silêncio.
    // A função descobre a empresa a partir da vaga, cuida de não duplicar e
    // não rebaixa a etapa de quem já avançou no processo.
    const { data: resp, error: erroRpc } = await rsDb.rpc('lv_receber_candidato_do_site', {
      p_nome: r.name,
      p_email: emailNorm,
      p_telefone: r.phone || null,
      p_vaga_titulo: vagaTitulo,
      p_obs: obs,
      p_documentos: documentos
    });
    if (erroRpc) throw new Error('Banco do R&S recusou a gravação: ' + erroRpc.message);
    const res = Array.isArray(resp) ? resp[0] : resp;
    if (!res || res.ok !== true) throw new Error((res && res.motivo) || 'O R&S não confirmou o cadastro.');
    console.info('Candidato enviado ao R&S:', emailNorm);
  } catch (e) { console.warn('Não foi possível enviar o candidato (sem forms) para o R&S:', e); }
}

async function saveResult(r) {
  if (!db) return;
  try {
    await db.from('candidatos_disc').insert({
      name: r.name, email: r.email || null, phone: r.phone || null,
      most: r.scores, least: null, pdf_url: null,
      primary_profile: r.primary, secondary_profile: r.secondary
    });
  } catch(e) { console.error(e); }
}

// Retorna null quando a leitura falha (por exemplo, sessão expirada e o banco
// recusando o acesso). Isso evita mostrar "nenhuma avaliação recebida" quando
// na verdade o problema é permissão, que foi o que confundiu no vagas.html.
async function loadResults() {
  if (!db) return null;
  try {
    const { data, error } = await db.from('candidatos_disc').select('*').order('created_at', { ascending: false });
    if (error) return null;
    return data || [];
  } catch(e) { return null; }
}

async function deleteResult(id) {
  if (!db) return;
  try { await db.from('candidatos_disc').delete().eq('id', id); } catch(e) {}
}

// RENDER: TEST (drag-and-drop)
// ═══════════════════════════════════════════════════════
function renderTest() {
  const roundData = rodadas()[state.round];
  const dims = ['D', 'I', 'S', 'C'];
  // Embaralhar ordem de exibição
  let order = [...dims].sort(() => Math.random() - 0.5);

  const RANK_COLORS = ['#2C2B28', '#6B7A5E', '#B08A3E', '#C4BFB4'];
  const RANK_LABELS = ['Mais parecido comigo', '', '', 'Menos parecido comigo'];

  function draw() {
    const pct = Math.round((state.round / totalRodadas()) * 100);
    app.innerHTML = `
      <div class="card">
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-info"><span>Situação ${state.round + 1} de ${totalRodadas()}</span><span>${state.name}</span></div>
        </div>
        <div class="sort-instruction">
          👆 <strong>Arraste</strong> as frases para ordenar da que <strong>mais</strong> combina com você (posição 1) até a que <strong>menos</strong> combina (posição 4).
        </div>
        <div class="sort-list" id="sortList">
          ${order.map((dim, rankIdx) => `
            <div class="sort-item" draggable="true" data-dim="${dim}" data-rank="${rankIdx}">
              <span class="sort-rank" style="background:${RANK_COLORS[rankIdx]}">${rankIdx + 1}</span>
              <span class="sort-phrase">${roundData[dim]}</span>
              <span class="sort-tag">${RANK_LABELS[rankIdx]}</span>
              <span class="sort-handle">⠿</span>
            </div>
          `).join('')}
        </div>
        <p class="sort-tip">No celular: segure e arraste para reordenar</p>
        <div class="btn-row">
          <button class="btn-ghost" id="backBtn" ${state.round === 0 ? 'disabled' : ''}>← Voltar</button>
          <button class="btn-primary" id="nextBtn">${state.round === ROUNDS_N - 1 ? 'Ver meu resultado →' : 'Próxima →'}</button>
        </div>
      </div>
    `;

    // Drag & drop
    const list = document.getElementById('sortList');
    let dragSrc = null;

    list.querySelectorAll('.sort-item').forEach(item => {
      item.addEventListener('dragstart', e => {
        dragSrc = item;
        setTimeout(() => item.classList.add('dragging'), 0);
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        list.querySelectorAll('.sort-item').forEach(i => i.classList.remove('drag-over'));
        order = [...list.querySelectorAll('.sort-item')].map(el => el.dataset.dim);
        draw();
      });
      item.addEventListener('dragover', e => { e.preventDefault(); item.classList.add('drag-over'); });
      item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
      item.addEventListener('drop', e => {
        e.preventDefault();
        if (dragSrc === item) return;
        const items = [...list.querySelectorAll('.sort-item')];
        if (items.indexOf(dragSrc) < items.indexOf(item)) item.after(dragSrc);
        else item.before(dragSrc);
        order = [...list.querySelectorAll('.sort-item')].map(el => el.dataset.dim);
        draw();
      });

      // Touch
      let ty0 = 0;
      item.addEventListener('touchstart', e => { ty0 = e.touches[0].clientY; item.classList.add('dragging'); }, { passive: true });
      item.addEventListener('touchmove', e => {
        e.preventDefault();
        const y = e.touches[0].clientY;
        const els = [...list.querySelectorAll('.sort-item')];
        els.forEach(el => {
          if (el === item) return;
          const r = el.getBoundingClientRect();
          if (y > r.top && y < r.bottom) {
            if (els.indexOf(item) < els.indexOf(el)) el.after(item);
            else el.before(item);
          }
        });
      }, { passive: false });
      item.addEventListener('touchend', () => {
        item.classList.remove('dragging');
        order = [...list.querySelectorAll('.sort-item')].map(el => el.dataset.dim);
        draw();
      });
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      if (state.round === 0) return;
      const prev = state.picks.pop();
      if (prev) {
        state.scores[prev.most] -= 3;
        state.scores[prev.second] -= 1;
        state.scores[prev.secondLast] -= -1;
        state.scores[prev.least] -= -3;
      }
      state.round--;
      render();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      // Pontuação: 1o = +3, 2o = +1, 3o = -1, 4o = -3
      const pts = [3, 1, -1, -3];
      order.forEach((dim, i) => { state.scores[dim] += pts[i]; });
      state.picks.push({ most: order[0], second: order[1], secondLast: order[2], least: order[3] });
      if (state.round === totalRodadas() - 1) finishTest();
      else { state.round++; render(); }
    });
  }

  draw();
}


// ═══════════════════════════════════════════════════════
// RENDER: TESTE SIMPLIFICADO (dois toques, sem arrastar)
// ═══════════════════════════════════════════════════════
function renderTestSimples() {
  const roundData = rodadas()[state.round];
  const dims = ['D','I','S','C'];
  const ordem = [...dims].sort(() => Math.random() - 0.5);

  function draw() {
    const total = totalRodadas();
    const pct = Math.round((state.round / total) * 100);
    const etapa = state.escolhaMais === null ? 'mais' : 'menos';

    const titulo = etapa === 'mais'
      ? 'Toque na frase que <strong>MAIS</strong> parece com você'
      : 'Agora toque na frase que <strong>MENOS</strong> parece com você';

    app.innerHTML = `
      <div class="card">
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-info"><span>Pergunta ${state.round + 1} de ${total}</span><span>${state.name}</span></div>
        </div>

        <div class="sort-instruction" style="font-size:17px;line-height:1.5">
          👆 ${titulo}
        </div>

        <div class="sort-list" id="listaSimples">
          ${ordem.map(dim => {
            const ehMais  = state.escolhaMais  === dim;
            const ehMenos = state.escolhaMenos === dim;
            const bloqueado = ehMais && etapa === 'menos';
            let borda = '#E2DBC9', fundo = '#FFFFFF', selo = '';
            if (ehMais)  { borda = '#6B7A5E'; fundo = '#F1F4EE'; selo = '<span style="background:#6B7A5E;color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;white-space:nowrap">MAIS</span>'; }
            if (ehMenos) { borda = '#B08A3E'; fundo = '#FAF5EA'; selo = '<span style="background:#B08A3E;color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;white-space:nowrap">MENOS</span>'; }
            return `
            <div class="opcao-simples" data-dim="${dim}"
                 style="display:flex;align-items:center;gap:12px;padding:18px 16px;margin-bottom:10px;
                        border:2px solid ${borda};background:${fundo};border-radius:12px;
                        font-size:17px;line-height:1.4;
                        cursor:${bloqueado ? 'default' : 'pointer'};opacity:${bloqueado ? '.55' : '1'}">
              <span style="flex:1">${roundData[dim]}</span>
              ${selo}
            </div>`;
          }).join('')}
        </div>

        <div class="test-nav">
          <button class="btn-ghost" id="backBtn" ${state.round === 0 && state.escolhaMais === null ? 'disabled' : ''}>Voltar</button>
          <button class="btn-primary" id="nextBtn" ${state.escolhaMenos === null ? 'disabled' : ''}>
            ${state.round === total - 1 ? 'Finalizar' : 'Próxima'}
          </button>
        </div>
      </div>`;

    document.querySelectorAll('.opcao-simples').forEach(el => {
      el.addEventListener('click', () => {
        const dim = el.dataset.dim;
        if (state.escolhaMais === null) { state.escolhaMais = dim; draw(); return; }
        if (dim === state.escolhaMais) return;          // não pode ser mais e menos
        state.escolhaMenos = dim; draw();
      });
    });

    // Voltar: primeiro desfaz a escolha da rodada atual; se não houver, volta uma rodada.
    document.getElementById('backBtn').addEventListener('click', () => {
      if (state.escolhaMenos !== null) { state.escolhaMenos = null; draw(); return; }
      if (state.escolhaMais  !== null) { state.escolhaMais  = null; draw(); return; }
      if (state.round === 0) return;
      const ant = state.picks.pop();
      if (ant) { state.scores[ant.most] -= 3; state.scores[ant.least] -= -3; }
      state.round--;
      state.escolhaMais = null; state.escolhaMenos = null;
      render();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (state.escolhaMenos === null) return;
      // Mesma escala da versão longa: mais = +3, menos = -3, as duas do meio = 0
      state.scores[state.escolhaMais]  += 3;
      state.scores[state.escolhaMenos] += -3;
      state.picks.push({ most: state.escolhaMais, second: null, secondLast: null, least: state.escolhaMenos });
      state.escolhaMais = null; state.escolhaMenos = null;
      if (state.round === totalRodadas() - 1) finishTest();
      else { state.round++; render(); }
    });
  }

  draw();
}

// ═══════════════════════════════════════════════════════
// FINISH
// ═══════════════════════════════════════════════════════
async function finishTest() {
  const scores = state.scores;
  const sorted = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
  const primary = sorted[0], secondary = sorted[1];

  const result = {
    name: state.name, email: state.email, phone: state.phone,
    scores, primary, secondary,
    timestamp: Date.now()
  };

  state.lastResult = result;
  state.view = 'result';
  render();
  await saveResult(result);
}

  const vagaParam = (incoming.vaga || '').trim();

  if (baseUrl) {

// ═══════════════════════════════════════════════════════
// PDF
// ═══════════════════════════════════════════════════════
// Converte o registro gravado no banco para o formato que buildPDF espera.
// São os mesmos dados com outros nomes: o banco guarda primary_profile,
// secondary_profile, most e created_at; o relatório foi escrito usando
// primary, secondary, scores e timestamp.
function _registroParaPDF(linha) {
  let pontuacoes = linha.most;
  if (typeof pontuacoes === 'string') {
    try { pontuacoes = JSON.parse(pontuacoes); } catch(e) { pontuacoes = null; }
  }
  return {
    name: linha.name || 'Candidato',
    email: linha.email || '',
    phone: linha.phone || '',
    primary: linha.primary_profile,
    secondary: linha.secondary_profile,
    scores: pontuacoes || { D:0, I:0, S:0, C:0 },
    timestamp: linha.created_at || new Date().toISOString()
  };
}

function buildPDF(r) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const W = doc.internal.pageSize.getWidth();
  const M = 52;
  let y = 70;

  const INK = [44, 43, 40];
  const SOFT = [122, 119, 110];
  const BORDER = [226, 219, 201];
  const BG = [245, 241, 234];

  const primary = r.primary, secondary = r.secondary;
  const profile = PROFILES[primary];
  const scores = r.scores;
  const minS = Math.min(...Object.values(scores));
  const maxS = Math.max(...Object.values(scores));
  const range = maxS - minS || 1;

  const DIM_RGB = { D:[155,107,82], I:[176,138,62], S:[107,122,94], C:[94,110,125] };

  // Header
  try { doc.addImage(LOGO_PDF_B64, 'PNG', M, y - 26, 28, 36); } catch(e) {}
  doc.setFont('times', 'italic');
  doc.setFontSize(20);
  doc.setTextColor(...INK);
  doc.text('La Vie Consultoria', M + 38, y);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8.5);
  doc.setTextColor(...SOFT);
  doc.text('AVALIAÇÃO COMPORTAMENTAL DISC', M + 38, y + 14);

  doc.setDrawColor(...BORDER);
  doc.line(M, y + 26, W - M, y + 26);
  y += 46;

  // Nome e data — ajusta o tamanho da fonte se o nome for muito comprido
  doc.setFont('times', 'italic');
  let nameSize = 26;
  doc.setFontSize(nameSize);
  const maxNameWidth = W - M * 2;
  while (nameSize > 14 && doc.getTextWidth(r.name || '') > maxNameWidth) {
    nameSize -= 1;
    doc.setFontSize(nameSize);
  }
  doc.setTextColor(...INK);
  doc.text(r.name || '', M, y);
  y += nameSize * 0.75;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.setTextColor(...SOFT);
  doc.text('Avaliação realizada em ' + new Date(r.timestamp).toLocaleDateString('pt-BR'), M, y);
  y += 30;

  // Perfis
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(12);
  doc.setTextColor(...INK);
  doc.text('Perfil predominante: ' + DIM[primary].name + ' (' + primary + ')', M, y);
  y += 16;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.setTextColor(...SOFT);
  doc.text('Perfil secundário: ' + DIM[secondary].name + ' (' + secondary + ')', M, y);
  y += 30;

  // Barras
  const barX = M + 120;
  const barW = W - M - barX - 40;
  Object.keys(scores).forEach(d => {
    const pct = (scores[d] - minS) / range;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.setTextColor(...INK);
    doc.text(DIM[d].name, M, y + 8);
    doc.setFillColor(238, 235, 226);
    doc.roundedRect(barX, y, barW, 9, 2, 2, 'F');
    doc.setFillColor(...DIM_RGB[d]);
    doc.roundedRect(barX, y, Math.max(barW * pct, 4), 9, 2, 2, 'F');
    doc.setFontSize(9);
    doc.setTextColor(...SOFT);
    doc.text((scores[d] > 0 ? '+' : '') + scores[d], barX + barW + 8, y + 8);
    y += 24;
  });

  y += 16;
  doc.setDrawColor(...BORDER);
  doc.line(M, y, W - M, y);
  y += 22;

  // Resumo
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.setTextColor(...INK);
  doc.text('Como você age no trabalho', M, y);
  y += 15;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  let lines = doc.splitTextToSize(profile.full, W - M * 2);
  doc.text(lines, M, y);
  y += lines.length * 13 + 20;

  // Dois boxes
  if (y > 580) { doc.addPage(); y = 60; }

  const bW = (W - M * 2 - 14) / 2;
  // Pontos fortes
  doc.setFillColor(...BG);
  doc.roundedRect(M, y, bW, 130, 3, 3, 'F');
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(9.5);
  doc.setTextColor(...INK);
  doc.text('PONTOS FORTES', M + 12, y + 17);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(...SOFT);
  profile.strengths.slice(0, 4).forEach((s, i) => {
    doc.text('• ' + s, M + 12, y + 33 + i * 22);
  });
  // Pontos de atenção
  const b2X = M + bW + 14;
  doc.setFillColor(...BG);
  doc.roundedRect(b2X, y, bW, 130, 3, 3, 'F');
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(9.5);
  doc.setTextColor(...INK);
  doc.text('PONTOS DE ATENÇÃO', b2X + 12, y + 17);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.setTextColor(...SOFT);
  profile.challenges.forEach((s, i) => {
    doc.text('• ' + s, b2X + 12, y + 33 + i * 22);
  });
  y += 144;

  // Motivação e funções ideais
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10);
  doc.setTextColor(...INK);
  doc.text('O que te motiva:', M, y);
  y += 14;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.setTextColor(...SOFT);
  lines = doc.splitTextToSize(profile.motivation, W - M * 2);
  doc.text(lines, M, y);
  y += lines.length * 13 + 14;

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10);
  doc.setTextColor(...INK);
  doc.text('Funções ideais:', M, y);
  y += 14;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.setTextColor(...SOFT);
  lines = doc.splitTextToSize(profile.ideal_roles, W - M * 2);
  doc.text(lines, M, y);

  // Rodapé
  doc.setFontSize(8);
  doc.setTextColor(180, 175, 168);
  doc.text('La Vie Consultoria · lavieconsultoria.com · Este resultado é um instrumento de autoconhecimento profissional, não um diagnóstico definitivo.', M, 822);

  doc.save('disc-lavie-' + r.name.toLowerCase().replace(/\s+/g, '-') + '.pdf');
}

// ═══════════════════════════════════════════════════════
// RENDER: ADMIN
// ═══════════════════════════════════════════════════════
async function renderAdmin() {
  app.innerHTML = `
    <div class="card">
      <span class="eyebrow">Painel do recrutador</span>
      <h2 class="title" style="font-size:24px;margin-bottom:6px;">Resultados dos candidatos</h2>
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:24px;">Avaliações recebidas pela plataforma DISC La Vie</p>
      <p style="margin-bottom:20px;"><button id="logoutBtn" style="background:none;border:1px solid var(--border,#d8cfc4);border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;color:var(--ink-soft);">Sair da conta</button></p>
      <div id="adminBody" class="empty-state">Carregando...</div>
    </div>
  `;

  document.getElementById('logoutBtn').addEventListener('click', fazerLogoutPainel);

  const results = await loadResults();
  const body = document.getElementById('adminBody');

  if (results === null) {
    body.innerHTML = 'Não foi possível carregar os resultados. Sua sessão pode ter expirado, ou esta conta não tem permissão de leitura. Saia e entre de novo.';
    return;
  }

  if (!results.length) {
    body.innerHTML = 'Nenhuma avaliação recebida ainda.';
    return;
  }

  // Ordena por nome (ordem alfabética, ignorando acento/caixa) — facilita achar
  // um candidato numa lista grande sem depender só da busca.
  const ordenados = [...results].sort((a, b) =>
    (a.name || '').localeCompare(b.name || '', 'pt-BR', { sensitivity: 'base' })
  );

  function _norm(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function renderTabela(lista) {
    const tabela = document.getElementById('adminTabelaWrap');
    if (!lista.length) {
      tabela.innerHTML = `<p style="font-size:13px;color:var(--ink-soft);padding:16px 0;">Nenhum candidato encontrado com esse termo de busca.</p>`;
      document.getElementById('adminCount').textContent = `0 de ${ordenados.length} avaliação(ões)`;
      return;
    }
    tabela.innerHTML = `
      <div class="admin-table-wrap">
        <table>
          <tr>
            <th>Data</th><th>Nome</th><th>E-mail</th><th>WhatsApp</th>
            <th>Perfil primário</th><th>Perfil secundário</th><th>D</th><th>I</th><th>S</th><th>C</th><th></th>
          </tr>
          ${lista.map(r => {
            const primary = r.primary_profile || (r.most ? Object.keys(r.most).sort((a,b) => r.most[b]-r.most[a])[0] : '?');
            const secondary = r.secondary_profile || '?';
            return `<tr>
              <td>${new Date(r.created_at).toLocaleDateString('pt-BR')}</td>
              <td>${r.name}</td>
              <td>${r.email || '-'}</td>
              <td>${r.phone || '-'}</td>
              <td><span class="pill" style="background:${DIM[primary]?.color || '#999'}">${DIM[primary]?.name || primary}</span></td>
              <td><span class="pill" style="background:${DIM[secondary]?.color || '#ccc'};opacity:0.85">${DIM[secondary]?.name || secondary}</span></td>
              <td>${r.most?.D ?? '-'}</td><td>${r.most?.I ?? '-'}</td><td>${r.most?.S ?? '-'}</td><td>${r.most?.C ?? '-'}</td>
              <td style="white-space:nowrap;">
                <button class="pdf-btn" data-id="${r.id}">baixar PDF</button>
                <button class="del-btn" data-id="${r.id}">remover</button>
              </td>
            </tr>`;
          }).join('')}
        </table>
      </div>
    `;
    document.getElementById('adminCount').textContent =
      lista.length === ordenados.length
        ? `${ordenados.length} avaliação(ões) no total`
        : `${lista.length} de ${ordenados.length} avaliação(ões)`;

    // Emite o mesmo relatório que o candidato recebe ao terminar o teste.
    // A ligação precisa vir DEPOIS da tabela ser montada: antes disso os botões
    // ainda não existem na tela e o clique não faria nada.
    tabela.querySelectorAll('.pdf-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const linha = ordenados.find(x => String(x.id) === String(btn.dataset.id));
        if (!linha) { alert('Não encontrei os dados dessa avaliação.'); return; }
        try {
          buildPDF(_registroParaPDF(linha));
        } catch (e) {
          console.error('Falha ao gerar o PDF:', e);
          alert('Não foi possível gerar o PDF desta avaliação: ' + (e && e.message ? e.message : e));
        }
      });
    });

    tabela.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Remover este candidato?')) return;
        await deleteResult(btn.dataset.id);
        renderAdmin();
      });
    });
  }

  body.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
      <input id="adminSearch" placeholder="🔍 Buscar por nome, e-mail ou telefone..." style="flex:1;min-width:220px;background:var(--bg,#fff);border:1px solid var(--border,#d8cfc4);border-radius:8px;padding:8px 12px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink,#2c2620);outline:none;">
      <span id="adminCount" style="font-size:12px;color:var(--ink-soft);white-space:nowrap;"></span>
    </div>
    <div id="adminTabelaWrap"></div>
  `;

  renderTabela(ordenados);

  document.getElementById('adminSearch').addEventListener('input', (e) => {
    const termo = _norm(e.target.value.trim());
    if (!termo) { renderTabela(ordenados); return; }
    const filtrados = ordenados.filter(r =>
      _norm(r.name).includes(termo) ||
      _norm(r.email).includes(termo) ||
      _norm(r.phone).includes(termo)
    );
    renderTabela(filtrados);
  });
}

// ═══════════════════════════════════════════════════════
// ROUTER
// ═══════════════════════════════════════════════════════
function render() {
  if (state.view === 'welcome') renderWelcome();
  else if (state.view === 'test') { state.simples ? renderTestSimples() : renderTest(); }
  else if (state.view === 'result') renderResult();
  else if (state.view === 'admin') renderAdmin();
}

// ═══════════════════════════════════════════════════════
// LOGIN DO PAINEL (Supabase Auth)
// ═══════════════════════════════════════════════════════
// Antes: prompt() comparando com uma senha escrita no código, ou seja, a
// "proteção" só existia no navegador e o banco liberava a leitura pra
// qualquer um. Agora: e-mail e senha reais, e é o próprio banco que decide
// se essa conta pode ler os resultados do DISC.
//
// O painel do DISC lê apenas a tabela candidatos_disc, que fica no banco
// principal (db). O login no banco do R&S (rsDb) é tentado junto, para a
// sessão ficar igual à do vagas.html, mas não é obrigatório aqui.
function openLoginModal() {
  const wrap = document.createElement('div');
  wrap.id = 'loginOverlay';
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;';
  wrap.innerHTML = `
    <div style="background:#fff;border-radius:14px;padding:28px 24px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.25);position:relative;">
      <button id="loginClose" style="position:absolute;top:10px;right:14px;background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:#999;">&times;</button>
      <h3 style="margin:0 0 6px;font-size:18px;">Entrar no painel</h3>
      <p style="margin:0 0 16px;font-size:13px;color:#777;">Use o mesmo e-mail e senha da sua conta.</p>
      <input type="email" id="loginEmail" placeholder="seu-email@exemplo.com" autocomplete="username"
        style="width:100%;padding:10px 12px;margin-bottom:8px;border:1px solid #d8cfc4;border-radius:8px;font-size:14px;box-sizing:border-box;">
      <input type="password" id="loginSenha" placeholder="Senha" autocomplete="current-password"
        style="width:100%;padding:10px 12px;margin-bottom:8px;border:1px solid #d8cfc4;border-radius:8px;font-size:14px;box-sizing:border-box;">
      <p id="loginErro" style="color:#a33;font-size:12px;display:none;margin:0 0 8px;"></p>
      <button id="loginSubmit" style="width:100%;padding:11px;border:none;border-radius:8px;background:var(--ink,#2b2b2b);color:#fff;font-size:14px;cursor:pointer;">Entrar</button>
    </div>
  `;
  document.body.appendChild(wrap);
  const fechar = () => wrap.remove();
  wrap.addEventListener('click', e => { if (e.target === wrap) fechar(); });
  document.getElementById('loginClose').addEventListener('click', fechar);
  document.getElementById('loginSubmit').addEventListener('click', fazerLoginPainel);
  document.getElementById('loginSenha').addEventListener('keydown', e => { if (e.key === 'Enter') fazerLoginPainel(); });
  document.getElementById('loginEmail').focus();
}

async function fazerLoginPainel() {
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const erroEl = document.getElementById('loginErro');
  const btn = document.getElementById('loginSubmit');
  erroEl.style.display = 'none';
  if (!email || !senha) { erroEl.textContent = 'Preencha e-mail e senha.'; erroEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    if (!db) throw new Error('Conexão com o banco indisponível.');
    const { error } = await db.auth.signInWithPassword({ email, password: senha });
    if (error) throw new Error('E-mail ou senha incorretos.');
    // Melhor esforço: entra também no banco do R&S, se a conta existir lá.
    try { if (rsDb) await rsDb.auth.signInWithPassword({ email, password: senha }); } catch(e) {}
    document.getElementById('loginOverlay')?.remove();
    state.view = 'admin'; render();
  } catch (e) {
    erroEl.textContent = e.message; erroEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

async function fazerLogoutPainel() {
  try { await db?.auth.signOut(); } catch(e) {}
  try { await rsDb?.auth.signOut(); } catch(e) {}
  state.view = 'welcome'; render();
}

async function sessaoValida() {
  if (!db) return false;
  try { const { data } = await db.auth.getSession(); return !!data?.session; } catch(e) { return false; }
}

// Admin button
document.getElementById('adminBtn').addEventListener('click', async () => {
  if (state.view === 'admin') { state.view = 'welcome'; render(); return; }
  if (await sessaoValida()) { state.view = 'admin'; render(); return; }
  openLoginModal();
});

render();

})();
</script>
