<style>
:root {
  --bg:        #F2F1ED;
  --bg-alt:    #E8E4DE;
  --dark:      #1a1917;
  --charcoal:  #302F2C;
  --muted:     #58554E;
  --sand:      #D8CFC4;
  --sand-dark: #8C7F6C;
  --white:     #FFFFFF;
  --border: rgba(58,58,58,0.14);
  --radius:    4px;
  /* cores dos 4 perfis DISC — mantidas, já são terrosas e combinam com a paleta */
  --d: #9B6B52;
  --i: #B08A3E;
  --s: #6B7A5E;
  --c: #5E6E7D;
  --ok-bg: #e8ece2;
  --ok: #4A7A42;
  --warn-bg: #FDF5E6;
  --warn: #7A5200;
  --warn-border: #E8C87A;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 17.5px; }
html, body { min-height: 100vh; background: var(--bg); color: var(--charcoal); font-family: 'DM Sans', sans-serif; font-weight: 300; line-height: 1.75; -webkit-font-smoothing: antialiased; }

/* LAYOUT / NAV */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0.85rem 5vw;
  background: rgba(26,25,23,0.97);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #F2F1ED; }
.brand-mark { height: 64px; width: auto; max-width: 220px; object-fit: contain; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-l1 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 15px; }
.brand-l2 { font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(242,241,237,0.55); }
.nav-right { display: flex; align-items: center; gap: 1.2rem; }
.nav-socials { display: flex; align-items: center; gap: 0.9rem; }
.nav-socials a { color: rgba(242,241,237,0.6); display: flex; transition: color 0.2s; }
.nav-socials a:hover { color: #F2F1ED; }
.nav-socials svg { width: 19px; height: 19px; }
.admin-btn {
  background: rgba(242,241,237,0.1); border: 1px solid rgba(242,241,237,0.2); color: #F2F1ED;
  font-family: 'DM Sans', sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500;
  padding: 8px 16px; border-radius: var(--radius); cursor: pointer; transition: all .15s;
}
.admin-btn:hover { background: rgba(242,241,237,0.18); border-color: rgba(242,241,237,0.4); }

#app { max-width: 780px; margin: 0 auto; padding: 150px 20px 80px; }

/* CARD */
.card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); padding: 40px; position: relative; overflow: hidden; }
.card-deco { position: absolute; top: -20px; right: -20px; width: 160px; height: 160px; opacity: 0.15; pointer-events: none; }

/* EYEBROW & TITLES */
.eyebrow { display: block; font-size: 0.68rem; font-weight: 500; letter-spacing: 0.25em; text-transform: uppercase; color: var(--sand-dark); margin-bottom: 1.2rem; }
.title { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; line-height: 1.15; margin-bottom: 14px; color: var(--charcoal); }
.title em { font-style: italic; color: var(--dark); }
.lede { font-size: 15px; line-height: 1.85; color: var(--muted); font-weight: 300; margin-bottom: 28px; max-width: 54ch; }

/* PROFILE LEGEND */
.profile-legend { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
.profile-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.profile-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* FORM */
.field-label { display: block; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sand-dark); font-weight: 600; margin-bottom: 8px; margin-top: 18px; }
.field-label:first-of-type { margin-top: 0; }
input[type=text], input[type=email], input[type=tel] {
  width: 100%; font-family: 'DM Sans', sans-serif; font-size: 14px;
  padding: 13px 16px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--charcoal); transition: border-color .15s;
}
input:focus { outline: none; border-color: var(--charcoal); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* BUTTONS */
.btn-primary { font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; background: var(--charcoal); color: #fff; border: none; padding: 14px 28px; border-radius: var(--radius); cursor: pointer; transition: background .15s, transform .15s; }
.btn-primary:hover { background: var(--dark); transform: translateY(-2px); }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { background: var(--sand-dark); cursor: not-allowed; transform: none; }
.btn-ghost { font-family: 'DM Sans', sans-serif; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; background: none; border: 1px solid var(--border); color: var(--charcoal); padding: 13px 22px; border-radius: var(--radius); cursor: pointer; transition: border-color .15s; }
.btn-ghost:hover { border-color: var(--sand-dark); }
.btn-ghost:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-row { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }

/* PROGRESS */
.progress-wrap { margin-bottom: 28px; }
.progress-track { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 10px; }
.progress-fill { height: 100%; background: var(--charcoal); border-radius: 99px; transition: width .3s ease; }
.progress-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

/* SORT / DRAG */
.sort-instruction { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 22px; background: var(--bg); padding: 14px 16px; border-radius: var(--radius); border-left: 3px solid var(--sand-dark); }
.sort-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
.sort-item {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px; background: var(--white);
  border: 1.5px solid var(--border); border-radius: var(--radius);
  cursor: grab; user-select: none;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.sort-item:hover { border-color: var(--sand-dark); background: var(--bg); }
.sort-item.dragging { opacity: 0.4; cursor: grabbing; }
.sort-item.drag-over { border-color: var(--charcoal); background: var(--bg); box-shadow: 0 0 0 3px rgba(58,58,58,0.08); }
.sort-rank {
  width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
  transition: background .2s;
}
.sort-phrase { font-size: 15px; color: var(--charcoal); line-height: 1.45; flex: 1; font-weight: 300; }
.sort-phrase b { font-weight: 600; }
.sort-tag { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
.sort-handle { color: var(--sand-dark); font-size: 18px; flex-shrink: 0; margin-left: 4px; }
.sort-tip { font-size: 11px; color: var(--muted); text-align: center; margin-top: 6px; letter-spacing: 0.04em; }

/* RESULT */
.result-header { margin-bottom: 28px; }
.result-name { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.result-title { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 500; font-style: italic; margin-bottom: 6px; color: var(--charcoal); }
.result-sub { font-size: 14px; color: var(--muted); font-weight: 300; }
.profile-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 99px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; margin-right: 8px; margin-bottom: 8px; }

/* BARS */
.bars { display: flex; flex-direction: column; gap: 16px; margin: 24px 0; }
.bar-row { display: grid; grid-template-columns: 130px 1fr 46px; align-items: center; gap: 12px; }
.bar-label { font-size: 13px; color: var(--charcoal); display: flex; align-items: center; gap: 8px; }
.bar-track { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
.bar-fill { height: 100%; border-radius: 99px; transition: width .6s ease; }
.bar-pct { font-size: 12px; color: var(--muted); text-align: right; }

/* DESC BLOCKS */
.desc-section { margin: 24px 0; }
.desc-section h4 { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 500; margin-bottom: 10px; color: var(--charcoal); }
.desc-block { background: var(--bg); border-radius: var(--radius); padding: 18px 20px; font-size: 14.5px; line-height: 1.8; color: var(--charcoal); margin-bottom: 12px; font-weight: 300; }

/* TWO-COL */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 20px 0; }
.col-card { background: var(--bg); border-radius: var(--radius); padding: 18px; }
.col-card h5 { font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sand-dark); font-weight: 600; margin-bottom: 12px; }
.col-card ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.col-card li { font-size: 13.5px; color: var(--charcoal); font-weight: 300; line-height: 1.5; display: flex; align-items: flex-start; gap: 8px; }
.col-card li::before { content: '•'; color: var(--sand-dark); flex-shrink: 0; margin-top: 1px; }

/* COMPASS SVG AREA */
.compass-wrap { display: flex; justify-content: center; margin: 20px 0; }

/* SAVED NOTE */
.saved-note { font-size: 12px; color: var(--muted); margin: 12px 0; font-style: italic; }
.confirm-box { background: var(--ok-bg); border-radius: var(--radius); padding: 14px 18px; font-size: 13px; color: var(--ok); margin-bottom: 18px; }

/* ADMIN */
.admin-table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 11px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px; color: #fff; letter-spacing: 0.04em; }
.del-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; font-family: 'DM Sans', sans-serif; }
.del-btn:hover { color: var(--d); }
.empty-state { text-align: center; padding: 50px 20px; color: var(--muted); font-size: 14px; }

/* WARNING */
.warning-box { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: var(--radius); padding: 12px 16px; font-size: 13px; color: var(--warn); margin-bottom: 22px; }

@media (max-width: 600px) {
  .card { padding: 24px 18px; }
  #app { padding: 128px 12px 60px; }
  .field-row { grid-template-columns: 1fr; }
  .bar-row { grid-template-columns: 100px 1fr 40px; }
  .two-col { grid-template-columns: 1fr; }
  .title { font-size: 28px; }
}

/* ── Cabeçalho no celular ─────────────────────────────────────
   Na tela estreita a logo, o texto da marca, os ícones de rede
   social e o botão do painel disputavam a mesma linha, e o botão
   saía cortado. O candidato não usa nenhum dos dois no celular,
   então eles somem e sobra espaço para a marca. */
@media (max-width: 760px) {
  .topbar { padding: 0.6rem 4vw; }
  .brand-mark { height: 42px; max-width: 120px; }
  .brand-l1 { font-size: 13px; }
  .brand-l2 { font-size: 8px; letter-spacing: 0.16em; }
  .nav-socials { display: none; }
  .admin-btn { display: none; }
  #app { padding-top: 96px; }
}

/* Botões de ação na tabela do painel: PDF e remover lado a lado */
.pdf-btn, .del-btn {
  background: none; border: 1px solid var(--border, #d8cfc4); border-radius: 6px;
  padding: 4px 10px; font-size: 11px; cursor: pointer; font-family: inherit;
  color: var(--ink-soft, #58554E); margin-left: 4px;
}
.pdf-btn:hover { border-color: #8C7F6C; color: #302F2C; }
.del-btn:hover { border-color: #c0392b; color: #c0392b; }
</style>

    const list = document.getElementById('sortList');

        const items = [...list.querySelectorAll('.sort-item')];
        if (items.indexOf(dragSrc) < items.indexOf(item)) item.after(dragSrc);
        else item.before(dragSrc);
        state.m1_order = [...list.querySelectorAll('.sort-item')].map(el => el.dataset.id);
        draw();
      });

      let ty0 = 0;
      item.addEventListener('touchstart', e => { ty0 = e.touches[0].clientY; item.classList.add('dragging'); }, { passive: true });
      item.addEventListener('touchmove', e => {
        e.preventDefault();
        const y = e.touches[0].clientY;
        const els = [...list.querySelectorAll('.sort-item')];
        els.forEach(el => {
          if (el === item) return;
          const r = el.getBoundingClientRect();
          if (y > r.top && y < r.bottom) {
            if (els.indexOf(item) < els.indexOf(el)) el.after(item);
            else el.before(item);
          }
        });
      }, { passive: false });
      item.addEventListener('touchend', () => {
        item.classList.remove('dragging');
        state.m1_order = [...list.querySelectorAll('.sort-item')].map(el => el.dataset.id);
        draw();
      });
    });

    document.getElementById('backBtn').addEventListener('click', () => { state.view = 'welcome'; render(); });
    document.getElementById('nextBtn').addEventListener('click', () => { state.view = 'm2'; render(); });
  }
  draw();
}

// ═══════════════════════════════════════════════════════
// RENDER: MÓDULO 2 — JULGAMENTO SITUACIONAL (toque mais/menos)
// ═══════════════════════════════════════════════════════
function renderM2() {
  const cenario = CENARIOS[state.m2_round];
  const tags = ['A','D','N','P'];
  const ordem = [...tags].sort(() => Math.random() - 0.5);

  function draw() {
    const total = CENARIOS.length;
    const pct = 10 + Math.round((state.m2_round / total) * 45);
    const etapa = state.m2_mais === null ? 'mais' : 'menos';
    const titulo = etapa === 'mais'
      ? 'Toque na reação que você <strong>PRIMEIRO</strong> teria'
      : 'Agora toque na reação que você <strong>MENOS</strong> teria';

    app.innerHTML = `
      <div class="card">
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-info"><span>Etapa 2 de 3 · Situação ${state.m2_round + 1} de ${total}</span><span>${state.name}</span></div>
        </div>
        <div class="desc-block" style="margin-bottom:18px;"><b>${cenario.texto}</b></div>
        <div class="sort-instruction" style="font-size:16px;">👆 ${titulo}</div>
        <div class="sort-list" id="listaSimples">
          ${ordem.map(tag => {
            const ehMais = state.m2_mais === tag;
            const ehMenos = state.m2_menos === tag;
            const bloqueado = ehMais && etapa === 'menos';
            let borda = '#E2DBC9', fundo = '#FFFFFF', selo = '';
            if (ehMais)  { borda = '#4B6350'; fundo = '#F1F4EE'; selo = '<span style="background:#4B6350;color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;white-space:nowrap">ESCOLHIDA</span>'; }
            if (ehMenos) { borda = '#8B3A2B'; fundo = '#FAF0EC'; selo = '<span style="background:#8B3A2B;color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;white-space:nowrap">MENOS PROVÁVEL</span>'; }
            return `
            <div class="opcao-simples" data-tag="${tag}"
                 style="display:flex;align-items:center;gap:12px;padding:16px;margin-bottom:10px;
                        border:2px solid ${borda};background:${fundo};border-radius:12px;
                        font-size:15px;line-height:1.4;
                        cursor:${bloqueado ? 'default' : 'pointer'};opacity:${bloqueado ? '.5' : '1'}">
              <span style="flex:1">${cenario[tag]}</span>
              ${selo}
            </div>`;
          }).join('')}
        </div>
        <div class="btn-row">
          <button class="btn-ghost" id="backBtn">${state.m2_round === 0 && state.m2_mais === null ? '← Voltar' : 'Voltar'}</button>
          <button class="btn-primary" id="nextBtn" ${state.m2_menos === null ? 'disabled' : ''}>
            ${state.m2_round === total - 1 ? 'Próxima etapa →' : 'Próxima →'}
          </button>
        </div>
      </div>`;

    document.querySelectorAll('.opcao-simples').forEach(el => {
      el.addEventListener('click', () => {
        const tag = el.dataset.tag;
        if (state.m2_mais === null) { state.m2_mais = tag; draw(); return; }
        if (tag === state.m2_mais) return;
        state.m2_menos = tag; draw();
      });
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      if (state.m2_menos !== null) { state.m2_menos = null; draw(); return; }
      if (state.m2_mais !== null) { state.m2_mais = null; draw(); return; }
      if (state.m2_round === 0) { state.view = 'm1'; render(); return; }
      const prev = state.m2_picks.pop();
      if (prev) { state.m2_scores[prev.mais] -= 3; state.m2_scores[prev.menos] -= -3; }
      state.m2_round--;
      state.m2_mais = null; state.m2_menos = null;
      render();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (state.m2_menos === null) return;
      state.m2_scores[state.m2_mais] += 3;
      state.m2_scores[state.m2_menos] += -3;
      state.m2_picks.push({ mais: state.m2_mais, menos: state.m2_menos });
      state.m2_mais = null; state.m2_menos = null;
      if (state.m2_round === total - 1) { state.view = 'm3'; render(); }
      else { state.m2_round++; render(); }
    });
  }
  draw();
}

// ═══════════════════════════════════════════════════════
// RENDER: MÓDULO 3 — RACIOCÍNIO LÓGICO
// ═══════════════════════════════════════════════════════
function renderM3() {
  const q = RACIOCINIO[state.m3_round];

  function draw() {
    const total = RACIOCINIO.length;
    const pct = 55 + Math.round((state.m3_round / total) * 45);
    app.innerHTML = `
      <div class="card">
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-info"><span>Etapa 3 de 3 · Pergunta ${state.m3_round + 1} de ${total}</span><span>${state.name}</span></div>
        </div>
        <div class="desc-block" style="font-size:18px;text-align:center;margin-bottom:18px;"><b>${q.p}</b></div>
        <div class="sort-list" id="opcoes">
          ${q.opts.map((op, i) => `
            <div class="opcao-simples" data-i="${i}"
                 style="text-align:center;padding:16px;margin-bottom:10px;border:2px solid #E2DBC9;background:#fff;border-radius:12px;font-size:17px;cursor:pointer;">
              ${op}
            </div>`).join('')}
        </div>
        <p style="font-size:12px;color:var(--ink-soft);text-align:center;">Sem tempo limite. Responda com o que vier primeiro à cabeça.</p>
      </div>`;

    document.querySelectorAll('#opcoes .opcao-simples').forEach(el => {
      el.addEventListener('click', () => {
        const i = Number(el.dataset.i);
        state.m3_respostas.push(i);
        if (i === q.r) state.m3_acertos++;
        if (state.m3_round === total - 1) finishTest();
        else { state.m3_round++; render(); }
      });
    });
  }
  draw();
}

// ═══════════════════════════════════════════════════════
// FINISH
// ═══════════════════════════════════════════════════════
async function finishTest() {
  const total = RACIOCINIO.length;
  const pct = Math.round((state.m3_acertos / total) * 100);
  const sitSorted = Object.keys(state.m2_scores).sort((a,b) => state.m2_scores[b]-state.m2_scores[a]);

  const result = {
    name: state.name, email: state.email, phone: state.phone, tipo: state.tipo,
    motivadores: state.m1_order,
    situacional: state.m2_scores,
    sitPrimario: sitSorted[0], sitSecundario: sitSorted[1],
    raciocinioAcertos: state.m3_acertos, raciocinioTotal: total, raciocinioPct: pct,
    timestamp: Date.now()
  };
  state.lastResult = result;
  state.view = 'result';
  render();
  await saveResult(result);
}

// ═══════════════════════════════════════════════════════
// PDF
// ═══════════════════════════════════════════════════════
function buildPDF(r) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const W = doc.internal.pageSize.getWidth();
  const M = 52;
  let y = 70;
  const INK = [44,43,40], SOFT = [122,119,110], BORDER = [226,219,201], BG = [245,241,234];

  doc.setFont('times','italic'); doc.setFontSize(20); doc.setTextColor(...INK);
  doc.text('La Vie Consultoria', M, y);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...SOFT);
  doc.text('BÚSSOLA DE CARREIRA', M, y+14);
  doc.setDrawColor(...BORDER); doc.line(M, y+26, W-M, y+26);
  y += 46;

  doc.setFont('times','italic'); doc.setFontSize(24); doc.setTextColor(...INK);
  doc.text(r.name || '', M, y);
  y += 20;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...SOFT);
  doc.text('Avaliação realizada em ' + new Date(r.timestamp).toLocaleDateString('pt-BR'), M, y);
  y += 30;

  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...INK);
  doc.text('1. O que mais move ' + r.name.split(' ')[0], M, y); y += 18;
  r.motivadores.slice(0,3).forEach((id, i) => {
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...INK);
    doc.text((i+1) + 'º ' + MOTIVADORES[id].nome, M, y); y += 13;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...SOFT);
    const lines = doc.splitTextToSize(MOTIVADORES[id].texto, W - M*2);
    doc.text(lines, M, y); y += lines.length * 12 + 8;
  });

  y += 10;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...INK);
  doc.text('2. Tendência sob pressão: ' + TENDENCIA[r.sitPrimario].nome, M, y); y += 16;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...SOFT);
  let lines = doc.splitTextToSize(TENDENCIA[r.sitPrimario].texto, W - M*2);
  doc.text(lines, M, y); y += lines.length * 12 + 16;

  const maxSit = Math.max(...Object.values(r.situacional));
  const minSit = Math.min(...Object.values(r.situacional));
  const rangeSit = maxSit - minSit || 1;
  const barX = M + 100, barW = W - M - barX - 40;
  Object.keys(r.situacional).forEach(tag => {
    const pct = (r.situacional[tag] - minSit) / rangeSit;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...INK);
    doc.text(TENDENCIA[tag].nome, M, y+7);
    doc.setFillColor(238,235,226); doc.roundedRect(barX, y, barW, 8, 2, 2, 'F');
    const [rr,gg,bb] = hexToRgb(TENDENCIA[tag].color);
    doc.setFillColor(rr,gg,bb); doc.roundedRect(barX, y, Math.max(barW*pct,4), 8, 2, 2, 'F');
    y += 20;
  });

  y += 16;
  if (y > 650) { doc.addPage(); y = 60; }
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...INK);
  doc.text('3. Raciocínio lógico', M, y); y += 16;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...SOFT);
  const banda = bandaRaciocinio(r.raciocinioPct);
  doc.text(r.raciocinioAcertos + ' de ' + r.raciocinioTotal + ' corretas (' + r.raciocinioPct + '%) · Faixa: ' + banda.nome, M, y);
  y += 14;
  lines = doc.splitTextToSize(banda.texto, W - M*2);
  doc.text(lines, M, y);

  doc.setFontSize(8); doc.setTextColor(180,175,168);
  doc.text('La Vie Consultoria · lavieconsultoria.com · Instrumento de autoconhecimento profissional, não um diagnóstico definitivo.', M, 822);

  doc.save('bussola-lavie-' + (r.name||'candidato').toLowerCase().replace(/\s+/g,'-') + '.pdf');
}

function hexToRgb(hex){
  const n = parseInt(hex.replace('#',''), 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}

// ═══════════════════════════════════════════════════════
// RENDER: ADMIN
// ═══════════════════════════════════════════════════════
async function renderAdmin() {
  app.innerHTML = `
    <div class="card">
      <span class="eyebrow">Painel La Vie</span>
      <h2 class="title" style="font-size:24px;margin-bottom:6px;">Resultados da Bússola de Carreira</h2>
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:24px;">Avaliações recebidas pela plataforma</p>
      <p style="margin-bottom:20px;"><button id="logoutBtn" style="background:none;border:1px solid var(--border,#d8cfc4);border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;color:var(--ink-soft);">Sair da conta</button></p>
      <div id="adminBody" class="empty-state">Carregando...</div>
    </div>
  `;
  document.getElementById('logoutBtn').addEventListener('click', fazerLogoutPainel);

  const results = await loadResults();
  const body = document.getElementById('adminBody');

  if (results === null) {
    body.innerHTML = 'Não foi possível carregar os resultados. Sua sessão pode ter expirado, ou a tabela "' + TABLE + '" ainda não existe no banco.';
    return;
  }
  if (!results.length) { body.innerHTML = 'Nenhuma avaliação recebida ainda.'; return; }

  const ordenados = [...results].sort((a,b) => (a.name||'').localeCompare(b.name||'', 'pt-BR', {sensitivity:'base'}));
  function _norm(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

  function renderTabela(lista) {
    const tabela = document.getElementById('adminTabelaWrap');
    if (!lista.length) {
      tabela.innerHTML = `<p style="font-size:13px;color:var(--ink-soft);padding:16px 0;">Nenhum resultado encontrado com esse termo.</p>`;
      document.getElementById('adminCount').textContent = `0 de ${ordenados.length} resultado(s)`;
      return;
    }
    tabela.innerHTML = `
      <div class="admin-table-wrap">
        <table>
          <tr><th>Data</th><th>Nome</th><th>Tipo</th><th>E-mail</th><th>Motivador principal</th><th>Tendência</th><th>Raciocínio</th><th></th></tr>
          ${lista.map(r => {
            const mot = Array.isArray(r.motivadores) ? r.motivadores[0] : null;
            const sit = r.situacional ? Object.keys(r.situacional).sort((a,b)=>r.situacional[b]-r.situacional[a])[0] : null;
            return `<tr>
              <td>${new Date(r.created_at).toLocaleDateString('pt-BR')}</td>
              <td>${r.name}</td>
              <td>${r.tipo === 'mentorado' ? 'Mentoria' : 'Seletivo'}</td>
              <td>${r.email || '-'}</td>
              <td>${mot ? `<span class="pill" style="background:${MOTIVADORES[mot]?.color||'#999'}">${MOTIVADORES[mot]?.nome||mot}</span>` : '-'}</td>
              <td>${sit ? `<span class="pill" style="background:${TENDENCIA[sit]?.color||'#999'}">${TENDENCIA[sit]?.nome||sit}</span>` : '-'}</td>
              <td>${r.raciocinio_pct != null ? r.raciocinio_pct + '%' : '-'}</td>
              <td style="white-space:nowrap;">
                <button class="pdf-btn" data-id="${r.id}">baixar PDF</button>
                <button class="del-btn" data-id="${r.id}">remover</button>
              </td>
            </tr>`;
          }).join('')}
        </table>
      </div>`;
    document.getElementById('adminCount').textContent = lista.length === ordenados.length
      ? `${ordenados.length} resultado(s) no total` : `${lista.length} de ${ordenados.length} resultado(s)`;

    tabela.querySelectorAll('.pdf-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const linha = ordenados.find(x => String(x.id) === String(btn.dataset.id));
        if (!linha) { alert('Não encontrei os dados desse resultado.'); return; }
        try {
          buildPDF({
            name: linha.name, timestamp: linha.created_at,
            motivadores: linha.motivadores,
            situacional: linha.situacional,
            sitPrimario: Object.keys(linha.situacional).sort((a,b)=>linha.situacional[b]-linha.situacional[a])[0],
            raciocinioAcertos: linha.raciocinio_acertos, raciocinioTotal: linha.raciocinio_total, raciocinioPct: linha.raciocinio_pct
          });
        } catch(e) { alert('Não foi possível gerar o PDF: ' + (e && e.message ? e.message : e)); }
      });
    });
    tabela.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Remover este resultado?')) return;
        await deleteResult(btn.dataset.id);
        renderAdmin();
      });
    });
  }

  body.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
      <input id="adminSearch" placeholder="🔍 Buscar por nome ou e-mail..." style="flex:1;min-width:220px;background:var(--bg,#fff);border:1px solid var(--border,#d8cfc4);border-radius:8px;padding:8px 12px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink,#2c2620);outline:none;">
      <span id="adminCount" style="font-size:12px;color:var(--ink-soft);white-space:nowrap;"></span>
    </div>
    <div id="adminTabelaWrap"></div>
  `;
  renderTabela(ordenados);
  document.getElementById('adminSearch').addEventListener('input', (e) => {
    const termo = _norm(e.target.value.trim());
    if (!termo) { renderTabela(ordenados); return; }
    renderTabela(ordenados.filter(r => _norm(r.name).includes(termo) || _norm(r.email).includes(termo)));
  });
}

// ═══════════════════════════════════════════════════════
// ROUTER
// ═══════════════════════════════════════════════════════
function render() {
  if (state.view === 'welcome') renderWelcome();
  else if (state.view === 'm1') renderM1();
  else if (state.view === 'm2') renderM2();
  else if (state.view === 'm3') renderM3();
  else if (state.view === 'result') renderResult();
  else if (state.view === 'admin') renderAdmin();
}

    <div style="background:#fff;border-radius:14px;padding:28px 24px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.25);position:relative;">
      <button id="loginClose" style="position:absolute;top:10px;right:14px;background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:#999;">&times;</button>
      <h3 style="margin:0 0 6px;font-size:18px;">Entrar no painel</h3>
      <p style="margin:0 0 16px;font-size:13px;color:#777;">Use o mesmo e-mail e senha da sua conta La Vie.</p>
      <input type="email" id="loginEmail" placeholder="seu-email@exemplo.com" autocomplete="username"
        style="width:100%;padding:10px 12px;margin-bottom:8px;border:1px solid #d8cfc4;border-radius:8px;font-size:14px;box-sizing:border-box;">
      <input type="password" id="loginSenha" placeholder="Senha" autocomplete="current-password"
        style="width:100%;padding:10px 12px;margin-bottom:8px;border:1px solid #d8cfc4;border-radius:8px;font-size:14px;box-sizing:border-box;">
      <p id="loginErro" style="color:#a33;font-size:12px;display:none;margin:0 0 8px;"></p>
      <button id="loginSubmit" style="width:100%;padding:11px;border:none;border-radius:8px;background:var(--ink,#2b2b2b);color:#fff;font-size:14px;cursor:pointer;">Entrar</button>
    </div>
  `;
  document.body.appendChild(wrap);
  const fechar = () => wrap.remove();
  wrap.addEventListener('click', e => { if (e.target === wrap) fechar(); });
  document.getElementById('loginClose').addEventListener('click', fechar);
  document.getElementById('loginSubmit').addEventListener('click', fazerLoginPainel);
  document.getElementById('loginSenha').addEventListener('keydown', e => { if (e.key === 'Enter') fazerLoginPainel(); });
  document.getElementById('loginEmail').focus();
}

async function fazerLoginPainel() {
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const erroEl = document.getElementById('loginErro');
  const btn = document.getElementById('loginSubmit');
  erroEl.style.display = 'none';
  if (!email || !senha) { erroEl.textContent = 'Preencha e-mail e senha.'; erroEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    if (!db) throw new Error('Conexão com o banco indisponível.');
    const { error } = await db.auth.signInWithPassword({ email, password: senha });
    if (error) throw new Error('E-mail ou senha incorretos.');
    document.getElementById('loginOverlay')?.remove();
    state.view = 'admin'; render();
  } catch (e) {
    erroEl.textContent = e.message; erroEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

async function fazerLogoutPainel() {
  try { await db?.auth.signOut(); } catch(e) {}
  state.view = 'welcome'; render();
}

async function sessaoValida() {
  if (!db) return false;
  try { const { data } = await db.auth.getSession(); return !!data?.session; } catch(e) { return false; }
}

document.getElementById('adminBtn').addEventListener('click', async () => {
  if (state.view === 'admin') { state.view = 'welcome'; render(); return; }
  if (await sessaoValida()) { state.view = 'admin'; render(); return; }
  openLoginModal();
});

render();

})();
</script>
</body>
</html>
