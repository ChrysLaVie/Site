<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Página não encontrada · La Vie Consultoria</title>
<link rel="icon" type="image/png" href="/logo.png">
<style>
  :root{ --bg:#F7F6F2; --charcoal:#302F2C; --muted:#7A7870; --sand:#C9BFA9; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--charcoal);
        min-height:100vh; display:flex; align-items:center; justify-content:center; padding:0 16px; text-align:center; }
  .box img{ height:54px; margin-bottom:2rem; }
  h1{ font-weight:500; font-size:1.6rem; margin-bottom:0.8rem; }
  p{ color:var(--muted); font-size:0.95rem; line-height:1.7; margin-bottom:2rem; }
  a.btn{ display:inline-block; padding:13px 26px; background:var(--charcoal); color:#fff; text-decoration:none;
         border-radius:8px; font-size:0.9rem; margin:0 6px 10px; }
  a.btn.sec{ background:transparent; color:var(--charcoal); border:1px solid var(--sand); }
</style>
</head>
<body>
  <div class="box">
    <img src="/logo.png" alt="La Vie Consultoria">
    <h1>Essa página não existe mais (ou mudou de lugar)</h1>
    <p>Se você veio por um link de vaga, o processo pode ter sido encerrado.<br>Veja as vagas abertas ou volte para o início.</p>
    <a class="btn" href="/vagas/">Ver vagas abertas</a>
    <a class="btn sec" href="/">Página inicial</a>
  </div>
</body>
</html>
