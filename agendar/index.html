<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agende sua entrevista · La Vie Consultoria</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* Página do link de agendamento (22/11/2026): o candidato escolhe o horário da Entrevista La Vie. */
  :root{
    --bg:#F2F1ED; --bg-alt:#E8E4DE; --dark:#1a1917; --charcoal:#3A3A3A; --muted:#6F6B64;
    --sand:#D8CFC4; --sand-dark:#B8AFA4; --accent:#8C8377; --white:#FFFFFF;
    --border:rgba(58,58,58,0.12);
    --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    --sans:'DM Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{font-size:112.5%}
  body{font-family:var(--sans);background:var(--bg);color:var(--charcoal);line-height:1.6;font-weight:300;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:640px;margin:0 auto;padding:0 20px}
  .topbar{border-bottom:1px solid var(--border)}
  .topbar .wrap{padding-block:12px}
  .logo{height:56px;width:auto;display:block}
  main{padding:2.4rem 0 3rem}
  .eyebrow{display:block;font-size:0.66rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:0.8rem}
  h1{font-family:var(--serif);font-weight:300;font-size:clamp(2rem,6vw,2.7rem);line-height:1.08;color:var(--dark);margin-bottom:0.9rem}
  .lead{font-size:0.95rem;font-weight:400;max-width:52ch}
  .dia{margin-top:1.8rem}
  .dia h2{font-family:var(--serif);font-weight:500;font-size:1.35rem;color:var(--dark);margin-bottom:0.6rem}
  .horas{display:flex;flex-wrap:wrap;gap:8px}
  .hora{font:inherit;font-size:0.9rem;font-weight:500;color:var(--dark);background:var(--white);border:1px solid var(--sand-dark);border-radius:999px;padding:0.5rem 1.05rem;cursor:pointer;min-width:84px}
  .hora:hover,.hora:focus-visible{border-color:var(--dark);outline:none}
  .caixa{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:1.4rem;margin-top:1.6rem}
  .caixa p+p{margin-top:0.7rem}
  .grande{font-family:var(--serif);font-size:1.6rem;color:var(--dark);line-height:1.2;text-transform:none}
  .botoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:1.2rem}
  .btn{font:inherit;font-size:0.8rem;letter-spacing:0.12em;text-transform:uppercase;font-weight:500;border-radius:999px;padding:0.75rem 1.4rem;cursor:pointer;border:1px solid var(--dark);text-decoration:none;display:inline-block}
  .btn-escuro{background:var(--dark);color:var(--white)}
  .btn-claro{background:transparent;color:var(--dark)}
  .btn[disabled]{opacity:.5;cursor:wait}
  .aviso{background:#fbeae7;color:#8a2d20;border-radius:8px;padding:0.8rem 1rem;margin-top:1.2rem;font-size:0.9rem;font-weight:400}
  .link-sala{word-break:break-all;color:var(--dark);font-weight:500}
  .rodape{border-top:1px solid var(--border);padding:1.4rem 0;font-size:0.75rem;color:var(--muted)}
  .oculto{display:none}
</style>
</head>
<body>
<header class="topbar"><div class="wrap"><a href="/"><img class="logo" src="/logo.png" alt="La Vie Consultoria"></a></div></header>
<main><div class="wrap" id="app">
  <span class="eyebrow">Entrevista La Vie</span>
  <h1>Carregando os horários…</h1>
</div></main>
<footer class="rodape"><div class="wrap">La Vie Consultoria · Goiânia/GO</div></footer>
<script>
(function(){
  const SB_URL='https://pdtwypuqfnglfaadubvz.supabase.co';
  const SB_KEY='sb_publishable_ZSbHiK2ZkFT3q0OJt--4qw_Q2Oc3MMK';
  const app=document.getElementById('app');
  const token=new URLSearchParams(location.search).get('t')||'';
  let dados=null;

  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const dt=iso=>new Date(iso+'T12:00:00');
  const diaSemana=iso=>dt(iso).toLocaleDateString('pt-BR',{weekday:'long'});
  const diaMes=iso=>dt(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  const quando=(iso,h)=>`${diaSemana(iso)}, ${diaMes(iso)}, às ${esc(h)}`;

  async function rpc(nome, corpo){
    const r=await fetch(`${SB_URL}/rest/v1/rpc/${nome}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json'},body:JSON.stringify(corpo)});
    if(!r.ok) throw new Error('falha '+r.status);
    return r.json();
  }
  function tela(html){ app.innerHTML=`<span class="eyebrow">Entrevista La Vie</span>`+html; window.scrollTo(0,0); }
  function falarComChrys(){ return `<p>Se precisar, responda a mensagem em que você recebeu este link que a Chrys te ajuda.</p>`; }

  function telaMarcada(d){
    const sala=d.link?`<p>Link da sala:<br><a class="link-sala" href="${esc(d.link)}" target="_blank" rel="noopener">${esc(d.link)}</a></p>`:'';
    tela(`<h1>Entrevista marcada, ${esc(d.nome||'')}!</h1>
      <div class="caixa">
        <p class="grande">${quando(d.data,d.hora)}</p>
        <p>Online${d.vaga?' · vaga de '+esc(d.vaga):''}</p>
        ${sala}
        <p>Entre alguns minutos antes, com boa conexão. Vale tirar um print desta tela.</p>
      </div>
      <div class="caixa"><p>Precisa mudar o horário? Responda a mensagem em que você recebeu este link.</p></div>`);
  }
  function telaLista(aviso){
    const d=dados; const hs=d.horarios||[];
    if(!hs.length){
      tela(`<h1>Olá, ${esc(d.nome)}!</h1><div class="caixa"><p>No momento não há horários livres para a entrevista.</p>${falarComChrys()}</div>`);
      return;
    }
    const porDia={}; hs.forEach(h=>{ (porDia[h.data]=porDia[h.data]||[]).push(h.hora); });
    const dias=Object.keys(porDia).sort().map(dia=>`<section class="dia"><h2>${esc(diaSemana(dia).replace(/^./,c=>c.toUpperCase()))}, ${esc(diaMes(dia))}</h2><div class="horas">${
      porDia[dia].map(h=>`<button class="hora" data-d="${esc(dia)}" data-h="${esc(h)}">${esc(h)}</button>`).join('')}</div></section>`).join('');
    tela(`<h1>Olá, ${esc(d.nome)}! Escolha o melhor horário.</h1>
      <p class="lead">Entrevista online${d.vaga?' para a vaga de <strong>'+esc(d.vaga)+'</strong>':''}, de uns ${esc(d.duracao||30)} minutos, com a Chrys, da La Vie Consultoria.</p>
      ${aviso?`<div class="aviso">${esc(aviso)}</div>`:''}
      ${dias}`);
    app.querySelectorAll('.hora').forEach(b=>b.addEventListener('click',()=>telaConfirmar(b.dataset.d,b.dataset.h)));
  }
  function telaConfirmar(dia,hora){
    tela(`<h1>Confirmar o horário?</h1>
      <div class="caixa"><p class="grande">${quando(dia,hora)}</p><p>Entrevista online${dados.vaga?' · vaga de '+esc(dados.vaga):''}</p>
      <div class="botoes"><button class="btn btn-escuro" id="ok">Confirmar</button><button class="btn btn-claro" id="voltar">Escolher outro</button></div></div>`);
    document.getElementById('voltar').onclick=()=>telaLista();
    const ok=document.getElementById('ok');
    ok.onclick=async()=>{
      ok.disabled=true; ok.textContent='Marcando…';
      try{
        const r=await rpc('lv_agendamento_marcar',{p_token:token,p_data:dia,p_hora:hora});
        if(r.status==='ok'){ telaMarcada({nome:dados.nome,vaga:dados.vaga,data:r.data,hora:r.hora,link:r.link}); return; }
        if(r.erro==='ocupado'){ await carregar('Esse horário acabou de ser escolhido por outra pessoa. Escolha outro, por favor.'); return; }
        if(r.erro==='ja_tem'){ tela(`<h1>Você já tem entrevista marcada</h1><div class="caixa"><p class="grande">${quando(r.data,r.hora)}</p>${falarComChrys()}</div>`); return; }
        await carregar();
      }catch(e){ ok.disabled=false; ok.textContent='Confirmar'; alert('Não consegui marcar agora. Confira sua internet e tente de novo.'); }
    };
  }
  async function carregar(aviso){
    if(token.length<40){ tela(`<h1>Link incompleto</h1><div class="caixa"><p>Abra o link exatamente como ele chegou na mensagem.</p>${falarComChrys()}</div>`); return; }
    try{
      const d=await rpc('lv_agendamento_horarios',{p_token:token});
      if(d.erro==='expirado'){ tela(`<h1>Este link expirou</h1><div class="caixa"><p>Os links de agendamento valem por alguns dias.</p>${falarComChrys()}</div>`); return; }
      if(d.erro){ tela(`<h1>Link não encontrado</h1><div class="caixa"><p>Confira se o link chegou completo.</p>${falarComChrys()}</div>`); return; }
      dados=d;
      if(d.status==='agendado'){
        if(d.cancelada){ tela(`<h1>Olá, ${esc(d.nome)}!</h1><div class="caixa"><p>A entrevista que estava marcada por este link foi cancelada ou remarcada.</p>${falarComChrys()}</div>`); return; }
        telaMarcada(d); return;
      }
      telaLista(aviso);
    }catch(e){
      tela(`<h1>Não consegui carregar</h1><div class="caixa"><p>Confira sua internet e atualize a página.</p></div>`);
    }
  }
  carregar();
})();
</script>
</body>
</html>
