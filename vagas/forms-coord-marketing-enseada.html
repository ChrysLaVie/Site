<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário da Vaga · Coordenador(a) de Marketing e Comercial · Enseada dos Bacuris · La Vie Consultoria</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 17.5px; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg); color: var(--charcoal);
  font-weight: 300; line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}

:root {
  --bg:        #F2F1ED;
  --bg-alt:    #E8E4DE;
  --dark:      #1a1917;
  --charcoal:  #302F2C;
  --muted:     #58554E;
  --sand:      #D8CFC4;
  --sand-dark: #8C7F6C;
  --white:     #FFFFFF;
  --border: rgba(58,58,58,0.14);
  --radius:    4px;
  --ok: #4A7A42;
  --ok-bg: #e8ece2;
  --err: #c0392b;
  --err-bg: #fbeae7;
}

.eyebrow { display: block; font-size: 0.68rem; font-weight: 500; letter-spacing: 0.25em; text-transform: uppercase; color: var(--sand-dark); margin-bottom: 1rem; }
.section-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.7rem,3.4vw,2.6rem); font-weight: 300; line-height: 1.15; margin-bottom: 1rem; color: var(--charcoal); }
.section-title em { font-style: italic; color: var(--dark); }

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.85rem 5vw;
  background: rgba(26,25,23,0.97);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.nav-logo { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
.nav-logo img { height: 46px; width: 46px; border-radius: 50%; object-fit: cover; }
.nav-logo-text { font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; color: #F2F1ED; line-height: 1.2; }
.nav-logo-text em { font-style: italic; }
.nav-tag { font-family: 'DM Sans', sans-serif; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(242,241,237,0.55); }
.nav-admin-btn {
  background: rgba(242,241,237,0.1); border: 1px solid rgba(242,241,237,0.2); color: #F2F1ED;
  font-family: 'DM Sans', sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500;
  padding: 8px 16px; border-radius: var(--radius); cursor: pointer; transition: all .15s;
}
.nav-admin-btn:hover { background: rgba(242,241,237,0.18); border-color: rgba(242,241,237,0.4); }

.admin-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.4rem; flex-wrap: wrap; gap: 1rem; }
.back-link { font-size: 0.78rem; color: var(--muted); background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; margin-bottom: 1.4rem; font-family: inherit; }
.back-link:hover { color: var(--charcoal); }
.admin-row {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 1.2rem;
  padding: 1.3rem 1.6rem; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--white); margin-bottom: 0.7rem; transition: border-color 0.2s;
}
.admin-row:hover { border-color: var(--sand-dark); }
.admin-row-info h4 { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; font-weight: 500; color: var(--charcoal); margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.admin-row-info p { font-size: 0.78rem; color: var(--muted); }
.score-pill { font-family: 'DM Sans', sans-serif; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.05em; padding: 0.2rem 0.6rem; border-radius: 99px; background: var(--bg-alt); color: var(--charcoal); }
.score-pill.high { background: var(--ok-bg); color: var(--ok); }
.score-pill.low { background: var(--err-bg); color: var(--err); }
.admin-row-actions { display: flex; gap: 0.4rem; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.admin-row-actions button { font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.45rem 0.8rem; border-radius: var(--radius); border: none; background: none; cursor: pointer; color: var(--sand-dark); font-family: inherit; transition: color 0.15s; white-space: nowrap; }
.admin-row-actions button:hover { color: var(--charcoal); }
.admin-row-actions button.danger:hover { color: var(--err); }

#app { max-width: 720px; margin: 0 auto; padding: 150px 20px 90px; }

.hero { margin-bottom: 2.4rem; }
.hero p.lead { color: var(--muted); font-size: 0.95rem; line-height: 1.85; font-weight: 300; }

.card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 2.2rem; margin-bottom: 1.4rem; }
.card h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.35rem; font-weight: 500; color: var(--charcoal); margin-bottom: 1rem; }
.card p.body-text { font-size: 0.92rem; line-height: 1.85; color: var(--charcoal); font-weight: 300; }

.benefit-list { list-style: none; display: flex; flex-direction: column; gap: 0.9rem; }
.benefit-list li { font-size: 0.88rem; color: var(--charcoal); line-height: 1.65; font-weight: 300; padding: 0.9rem 1.1rem; background: var(--bg); border-radius: var(--radius); }
.benefit-list li strong { font-weight: 500; }

.check-block { display: flex; gap: 0.7rem; align-items: flex-start; padding: 1rem 0; border-bottom: 1px solid var(--border); }
.check-block:last-child { border-bottom: none; }
.check-block input[type=checkbox] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--charcoal); cursor: pointer; flex-shrink: 0; }
.check-block label { font-size: 0.88rem; color: var(--charcoal); line-height: 1.6; font-weight: 300; cursor: pointer; }
.check-block label strong { font-weight: 500; }

.quiz-q { padding: 1.1rem 0; border-bottom: 1px solid var(--border); }
.quiz-q:last-child { border-bottom: none; }
.quiz-q-title { font-size: 0.9rem; color: var(--charcoal); font-weight: 500; margin-bottom: 0.7rem; line-height: 1.5; }
.quiz-opt { display: flex; gap: 0.6rem; align-items: flex-start; padding: 0.4rem 0; cursor: pointer; }
.quiz-opt input[type=radio] { width: 17px; height: 17px; margin-top: 2px; accent-color: var(--charcoal); cursor: pointer; flex-shrink: 0; }
.quiz-opt label { font-size: 0.85rem; color: var(--charcoal); font-weight: 300; line-height: 1.5; cursor: pointer; }
.quiz-num { display: inline-block; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1rem; color: var(--sand-dark); margin-right: 0.4rem; }

.field-label { display: block; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sand-dark); font-weight: 600; margin-bottom: 0.5rem; margin-top: 1.1rem; }
.field-label:first-of-type { margin-top: 0; }
.field-hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.4rem; font-weight: 300; }
input[type=text], input[type=email], input[type=tel] {
  width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 0.85rem 1rem; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; color: var(--charcoal);
  outline: none; transition: border-color 0.2s;
}
input:focus { border-color: var(--charcoal); }
textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.85rem 1rem; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; color: var(--charcoal); outline: none; resize: vertical; }
textarea:focus { border-color: var(--charcoal); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

.btn-primary {
  display: inline-block; background: var(--charcoal); color: var(--white);
  padding: 0.95rem 2.2rem; border: none; border-radius: var(--radius);
  font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 500;
  cursor: pointer; transition: background 0.2s, transform 0.15s; width: 100%; font-family: inherit;
}
.btn-primary:hover { background: var(--dark); transform: translateY(-2px); }
.btn-primary:disabled { background: var(--sand-dark); cursor: not-allowed; transform: none; }
.loading-spin { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

.error-box { background: var(--err-bg); border-radius: var(--radius); padding: 0.8rem 1rem; font-size: 0.8rem; color: var(--err); margin-top: 1rem; }
.success-card { text-align: center; padding: 3rem 2rem; }
.success-card h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--ok); margin-bottom: 0.8rem; }
.success-card p { color: var(--muted); font-size: 0.92rem; line-height: 1.7; max-width: 46ch; margin: 0 auto; }

@media (max-width: 600px) {
  .field-row { grid-template-columns: 1fr; }
  .card { padding: 1.6rem; }
}

@media (max-width: 760px) {
  nav { padding: 0.6rem 4vw; gap: 0.6rem; }
  .nav-logo img { height: 36px; width: 36px; }
  .nav-logo-text { display: none; }
  .nav-admin-btn { display: none; }
  .nav-tag { font-size: 0.6rem; letter-spacing: 0.08em; line-height: 1.35;
             text-align: right; max-width: 60vw; }
  #app { padding-top: 110px; }
}
@media (max-width: 400px) {
  .nav-tag { font-size: 0.55rem; }
}
</style>
</head>

// candidatura inicial (vagas/index.html): tenta 3 vezes antes de desistir, e se
// mesmo assim falhar, grava numa tabela pra aparecer no painel do recrutador
// com botão de reenvio, em vez de sumir sem deixar rastro.
async function _lvReceberComRetentativa(payload, tentativas = 3) {
  let ultimoErro = 'motivo não identificado';
  for (let i = 0; i < tentativas; i++) {
    try {
      const { data: resp, error } = await rsDb.rpc('lv_receber_candidato_do_site', payload);
      if (error) throw new Error('Banco do R&S recusou a gravação: ' + error.message);
      const r = Array.isArray(resp) ? resp[0] : resp;
      if (!r || r.ok !== true) throw new Error((r && r.motivo) || 'O R&S não confirmou o cadastro.');
      return { ok: true };
    } catch (e) {
      ultimoErro = (e && e.message) ? e.message : String(e);
      if (i < tentativas - 1) await new Promise(res => setTimeout(res, 1200 * (i + 1)));
    }
  }
  return { ok: false, err: ultimoErro };
}
async function _registrarPendenciaRS(payload, erro) {
  if (!db) return;
  try {
    await db.from('rs_sync_pendentes').insert({
      nome: payload.p_nome || null,
      email: payload.p_email || null,
      whatsapp: payload.p_telefone || null,
      vaga_titulo: payload.p_vaga_titulo || null,
      cv_url: (payload.p_documentos && payload.p_documentos[0] && payload.p_documentos[0].path) || null,
      erro: String(erro || '').slice(0, 500)
    });
  } catch (e) { console.warn('Não foi possível registrar a pendência do R&S:', e); }
}

const DISC_NOMES = { D:'Dominância', I:'Influência', S:'Estabilidade', C:'Conformidade' };

// Perfil buscado pra Coordenação de Marketing e Comercial da Enseada dos Bacuris:
// comunicação e relacionamento com hóspedes (I) e foco em resultado / fechamento (D).
const DISC_IDEAL = ['D', 'I'];
function montarDossieMatch(discPrimary, discSecondary, technicalScore) {
  let pontos = 0;
  const linhas = [];
  if (technicalScore !== null && technicalScore !== undefined) {
    const nivelTec = technicalScore >= 4 ? 'Alto' : (technicalScore >= 2 ? 'Médio' : 'Baixo');
    pontos += technicalScore >= 4 ? 2 : (technicalScore >= 2 ? 1 : 0);
    linhas.push(`• Técnico: ${technicalScore}/5 no questionário (${nivelTec})`);
  }
  if (discPrimary) {
    const idxPrim = DISC_IDEAL.indexOf(discPrimary);
    const idxSec = discSecondary ? DISC_IDEAL.indexOf(discSecondary) : -1;
    let nivelDisc, pontosDisc;
    if (idxPrim === 0) { nivelDisc = 'Alto'; pontosDisc = 2; }
    else if (idxPrim > 0 || idxSec === 0) { nivelDisc = 'Médio'; pontosDisc = 1; }
    else { nivelDisc = 'Baixo'; pontosDisc = 0; }
    pontos += pontosDisc;
    const perfilTxt = discSecondary ? `${DISC_NOMES[discPrimary]} / ${DISC_NOMES[discSecondary]}` : DISC_NOMES[discPrimary];
    linhas.push(`• Perfil comportamental: ${perfilTxt} — perfil buscado pra vaga é ${DISC_IDEAL.map(d=>DISC_NOMES[d]).join('/')} (${nivelDisc})`);
  }
  if (!linhas.length) return '';
  const nivelGeral = pontos >= 3 ? 'Alto' : (pontos >= 1 ? 'Médio' : 'Baixo');
  return `🎯 DOSSIÊ DE MATCH (automático) — Nível geral: ${nivelGeral}\n${linhas.join('\n')}\nGerado a partir do DISC e do questionário técnico. Pré-filtro — revisão humana antes da entrevista.`;
}

async function pushCandidatoParaRS(formPayload) {
  if (!rsDb || !db) return;
  try {
    const emailNorm = (formPayload.email || '').trim().toLowerCase();
    const { data: compl, error: erroCompl } = await db.rpc('lv_complementos_candidato', { p_email: emailNorm });
    if (erroCompl) console.error('Função lv_complementos_candidato falhou:', erroCompl.message);
    const c = Array.isArray(compl) ? (compl[0] || {}) : (compl || {});

    const cvUrl = c.cv_url || null;
    const discPrimary = c.primary_profile || null;
    const discSecondary = c.secondary_profile || null;

    const dossie = montarDossieMatch(discPrimary, discSecondary, formPayload.technical_score);
    let obs = dossie ? dossie + '\n\n' : '';
    if (discPrimary) {
      obs += `Perfil DISC: ${DISC_NOMES[discPrimary] || discPrimary}${discSecondary ? ' / ' + (DISC_NOMES[discSecondary] || discSecondary) : ''}.`;
    }
    if (formPayload.observacoes) obs += ` Observações do candidato: ${formPayload.observacoes}`;

    const documentos = cvUrl ? [{
      nome: 'Currículo (enviado no site)',
      path: cvUrl,
      origem: 'vagas'
    }] : [];

    const payloadRS = {
      p_nome: formPayload.nome,
      p_email: emailNorm,
      p_telefone: formPayload.whatsapp,
      p_vaga_titulo: formPayload.vaga_titulo,
      p_obs: obs,
      p_documentos: documentos
    };
    const envio = await _lvReceberComRetentativa(payloadRS);
    if (!envio.ok) { await _registrarPendenciaRS(payloadRS, envio.err); throw new Error(envio.err); }
    console.info('Candidato enviado ao R&S:', emailNorm);
  } catch (e) {
    console.error('FALHA ao enviar candidato para o R&S:', e && e.message ? e.message : e);
    try {
      await db.from('sync_rs_falhas').insert({
        email: (formPayload.email || '').trim().toLowerCase(),
        nome: formPayload.nome || null,
        vaga_titulo: formPayload.vaga_titulo || null,
        erro: String(e && e.message ? e.message : e).slice(0, 500)
      });
    } catch (e2) { /* se nem isso gravar, resta o console */ }
  }
}

const params = new URLSearchParams(window.location.search);
const prefill = {
  nome: params.get('nome') || '',
  email: params.get('email') || '',
  telefone: params.get('telefone') || '',
  vaga: params.get('vaga') || VAGA_TITULO_PADRAO
};

const app = document.getElementById('app');
let state = { view: 'form' };

async function saveForm(payload) {
  if (!db) return { ok:false, err:'Banco não configurado' };
  try {
    const { error } = await db.from('forms_enseada_bacuris').insert(payload);
    if (error) return { ok:false, err:error.message };
    return { ok:true };
  } catch(e) { return { ok:false, err:e.message }; }
}

async function loadSubmissions() {
  if (!db) return null;
  try {
    const { data, error } = await db.from('forms_enseada_bacuris').select('*').order('created_at', { ascending:false });
    if (error) return null;
    return data || [];
  } catch(e) { return null; }
}

async function deleteSubmission(id) {
  if (!db) return;
  try { await db.from('forms_enseada_bacuris').delete().eq('id', id); } catch(e) {}
}

function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

        email: email.value.trim(),
        whatsapp: whatsapp.value.trim(),

        technical_score: technicalScore

          <p>Obrigado, ${esc(nome.value.trim())}. Suas respostas para a vaga de <strong>${esc(prefill.vaga)}</strong> foram recebidas. A equipe de recrutamento vai analisar seu perfil e entrará em contato pelos dados informados.</p>
        </div>

    } else {
      const errBox = document.getElementById('formError');
      errBox.innerHTML = `<div class="error-box">Erro ao enviar: ${esc(result.err)}. Tente novamente.</div>`;
      errBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Enviar formulário';
      check();
    }
  });
}

    <button class="back-link" id="backBtn">← Voltar ao formulário</button>

        <span class="eyebrow">Painel do recrutador</span>
        <h1 class="section-title" style="margin-bottom:0;">Respostas do <em>formulário</em></h1>
      </div>

    <p style="color:var(--muted);font-size:0.85rem;margin-bottom:1.4rem;">${subs.length} candidato(s) · Coordenador(a) de Marketing e Comercial - Enseada dos Bacuris</p>
    <div id="subsList"></div>
  `;

  document.getElementById('backBtn').addEventListener('click', () => { state.view = 'form'; render(); });
  document.getElementById('logoutBtn').addEventListener('click', fazerLogoutPainel);

  document.getElementById('subsList').innerHTML = subs.map(s => {
    const score = s.technical_score ?? null;
    const scoreClass = score === null ? '' : (score >= 4 ? 'high' : (score <= 2 ? 'low' : ''));
    return `
      <div class="admin-row" data-id="${s.id}">
        <div class="admin-row-info">
          <h4>${esc(s.nome)} ${score !== null ? `<span class="score-pill ${scoreClass}">${score}/5 no técnico</span>` : ''}</h4>
          <p>${esc(s.email)} · ${esc(s.whatsapp) || '-'} · ${new Date(s.created_at).toLocaleDateString('pt-BR')}</p>
        </div>
        <div class="admin-row-actions">
          <button class="pdf-btn" data-id="${s.id}">Baixar PDF</button>
          <button class="danger del-btn" data-id="${s.id}">Remover</button>
        </div>
      </div>
    `;
  }).join('');

  document.querySelectorAll('.pdf-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const sub = subs.find(x => x.id === btn.dataset.id);
      buildSubmissionPDF(sub);
    });
  });

    btn.addEventListener('click', async () => {
      if (!confirm('Remover esta resposta permanentemente?')) return;
      await deleteSubmission(btn.dataset.id);
      renderAdmin();
    });
  });
}

function pdfSafe(t) {
  return (t || '').replace(/→/g, '-').replace(/✓/g, '').replace(/✗/g, '');
}

function buildSubmissionPDF(s) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const W = doc.internal.pageSize.getWidth();
  const M = 52;
  let y = 60;

  const INK = [58, 58, 58];
  const SOFT = [122, 119, 110];
  const BORDER = [216, 207, 196];
  const OK = [74, 122, 66];
  const ERR = [192, 57, 43];

  function checkPageBreak(next) {
    if (y + next > 800) { doc.addPage(); y = 60; }
  }

  doc.setFont('times', 'italic');
  doc.setFontSize(18);
  doc.setTextColor(...INK);
  doc.text('Enseada dos Bacuris', M, y);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8.5);
  doc.setTextColor(...SOFT);
  doc.text('FORMULÁRIO DA VAGA · RESUMO PARA O RECRUTADOR', M, y + 13);
  doc.setDrawColor(...BORDER);
  doc.line(M, y + 24, W - M, y + 24);
  y += 46;

  doc.setFont('times', 'italic');
  doc.setTextColor(...INK);
  let fNameSize = 22;
  doc.setFontSize(fNameSize);
  const fMaxNameWidth = W - M * 2;
  while (fNameSize > 13 && doc.getTextWidth(pdfSafe(s.nome)) > fMaxNameWidth) {
    fNameSize -= 1;
    doc.setFontSize(fNameSize);
  }
  doc.text(pdfSafe(s.nome), M, y);
  y += fNameSize * 0.75;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9.5);
  doc.setTextColor(...SOFT);
  doc.text(pdfSafe(`${s.email || ''} · ${s.whatsapp || ''} · Enviado em ${new Date(s.created_at).toLocaleDateString('pt-BR')}`), M, y);
  y += 12;
  doc.text(pdfSafe(`Vaga: ${s.vaga_titulo || ''}`), M, y);
  y += 26;

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10.5);
  doc.setTextColor(...INK);
  doc.text('Condições da vaga', M, y);
  y += 16;
  const conds = [
    ['Contratação PJ', s.ciente_pj],
    ['Remuneração R$ 3.000,00 (PJ)', s.ciente_remuneracao],
    ['Modelo híbrido, com deslocamentos pontuais ao Lago das Brisas/GO', s.ciente_presencial],
    ['Atendimento a hóspedes fora do horário comercial, incluindo fins de semana', s.ciente_horario]
  ];
  conds.forEach(([label, val]) => {
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9.5);
    doc.setTextColor(...(val ? OK : ERR));
    doc.text(val ? 'SIM' : 'NAO', M, y);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(...INK);
    doc.text(label, M + 32, y);
    y += 15;
  });
  if (s.pretensao_salarial && s.pretensao_salarial.trim().length > 1) {
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9.5);
    doc.setTextColor(...SOFT);
    doc.text(pdfSafe(`Pretensão salarial informada: ${s.pretensao_salarial}`), M, y);
    y += 15;
  }
  if (s.observacoes) {
    checkPageBreak(30);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9.5);
    doc.setTextColor(...SOFT);
    const obsLines = doc.splitTextToSize(pdfSafe(`Observações: ${s.observacoes}`), W - M * 2);
    doc.text(obsLines, M, y);
    y += obsLines.length * 12 + 4;
  }
  y += 14;

  checkPageBreak(40);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10.5);
  doc.setTextColor(...INK);
  doc.text(`Questionário técnico: nota ${s.technical_score ?? '-'} / 5`, M, y);
  y += 18;

  (Array.isArray(s.technical_answers) ? s.technical_answers : []).forEach((a, i) => {
    checkPageBreak(50);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.setTextColor(...INK);
    const qLines = doc.splitTextToSize(pdfSafe(`${i + 1}. ${a.pergunta}`), W - M * 2);
    doc.text(qLines, M, y);
    y += qLines.length * 11 + 3;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(...(a.correta ? OK : ERR));
    const respLines = doc.splitTextToSize(pdfSafe(`Resposta: ${a.escolhida || '(não respondida)'} ${a.correta ? '(correta)' : '(incorreta)'}`), W - M * 2 - 10);
    doc.text(respLines, M + 10, y);
    y += respLines.length * 11 + 10;
  });

  doc.setFontSize(8);
  doc.setTextColor(180, 175, 168);
  doc.text('Enseada dos Bacuris · Processo seletivo conduzido pela La Vie Consultoria · Documento de uso interno.', M, 822);

  doc.save('formulario-' + (s.nome || 'candidato').toLowerCase().replace(/\s+/g, '-') + '.pdf');
}

function render() {
  if (state.view === 'form') { document.getElementById('navTag').textContent = 'Formulário da vaga'; renderForm(); }
  else if (state.view === 'admin') renderAdmin();
}

function openLoginModal() {
  const wrap = document.createElement('div');
  wrap.id = 'loginOverlay';
  wrap.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;';
  wrap.innerHTML = `
    <div style="background:#fff;border-radius:14px;padding:28px 24px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.25);position:relative;">
      <button id="loginClose" style="position:absolute;top:10px;right:14px;background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:#999;">&times;</button>
      <h3 style="margin:0 0 6px;font-size:18px;">Entrar no painel</h3>
      <p style="margin:0 0 16px;font-size:13px;color:#777;">Use o mesmo e-mail e senha da sua conta.</p>
      <input type="email" id="loginEmail" placeholder="seu-email@exemplo.com" autocomplete="username"
        style="width:100%;padding:10px 12px;margin-bottom:8px;border:1px solid #d8cfc4;border-radius:8px;font-size:14px;box-sizing:border-box;">
      <input type="password" id="loginSenha" placeholder="Senha" autocomplete="current-password"
        style="width:100%;padding:10px 12px;margin-bottom:8px;border:1px solid #d8cfc4;border-radius:8px;font-size:14px;box-sizing:border-box;">
      <p id="loginErro" style="color:#a33;font-size:12px;display:none;margin:0 0 8px;"></p>
      <button id="loginSubmit" style="width:100%;padding:11px;border:none;border-radius:8px;background:#2b2b2b;color:#fff;font-size:14px;cursor:pointer;">Entrar</button>
    </div>
  `;
  document.body.appendChild(wrap);
  const fechar = () => wrap.remove();
  wrap.addEventListener('click', e => { if (e.target === wrap) fechar(); });
  document.getElementById('loginClose').addEventListener('click', fechar);
  document.getElementById('loginSubmit').addEventListener('click', fazerLoginPainel);
  document.getElementById('loginSenha').addEventListener('keydown', e => { if (e.key === 'Enter') fazerLoginPainel(); });
  document.getElementById('loginEmail').focus();
}

async function fazerLoginPainel() {
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const erroEl = document.getElementById('loginErro');
  const btn = document.getElementById('loginSubmit');
  erroEl.style.display = 'none';
  if (!email || !senha) { erroEl.textContent = 'Preencha e-mail e senha.'; erroEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    if (!db) throw new Error('Conexão com o banco indisponível.');
    const { error } = await db.auth.signInWithPassword({ email, password: senha });
    if (error) throw new Error('E-mail ou senha incorretos.');
    try { if (rsDb) await rsDb.auth.signInWithPassword({ email, password: senha }); } catch(e) {}
    document.getElementById('loginOverlay')?.remove();
    state.view = 'admin'; render();
  } catch (e) {
    erroEl.textContent = e.message; erroEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

async function fazerLogoutPainel() {
  try { await db?.auth.signOut(); } catch(e) {}
  try { await rsDb?.auth.signOut(); } catch(e) {}
  state.view = 'form'; render();
}

async function sessaoValida() {
  if (!db) return false;
  try { const { data } = await db.auth.getSession(); return !!data?.session; } catch(e) { return false; }
}

document.getElementById('adminBtn').addEventListener('click', async () => {
  if (state.view === 'admin') { state.view = 'form'; render(); return; }
  if (await sessaoValida()) { state.view = 'admin'; render(); return; }
  openLoginModal();
});

render();
})();
</script>
</body>
</html>
