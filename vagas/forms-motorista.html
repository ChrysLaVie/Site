<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 17.5px; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg); color: var(--charcoal);
  font-weight: 300; line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}

:root {
  --bg:        #F2F1ED;
  --bg-alt:    #E8E4DE;
  --dark:      #1a1917;
  --charcoal:  #302F2C;
  --muted:     #58554E;
  --sand:      #D8CFC4;
  --sand-dark: #8C7F6C;
  --white:     #FFFFFF;
  --border: rgba(58,58,58,0.14);
  --radius:    4px;
  --ok: #4A7A42;
  --ok-bg: #e8ece2;
  --err: #c0392b;
  --err-bg: #fbeae7;
}

.eyebrow { display: block; font-size: 0.68rem; font-weight: 500; letter-spacing: 0.25em; text-transform: uppercase; color: var(--sand-dark); margin-bottom: 1rem; }
.section-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.7rem,3.4vw,2.6rem); font-weight: 300; line-height: 1.15; margin-bottom: 1rem; color: var(--charcoal); }
.section-title em { font-style: italic; color: var(--dark); }

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.85rem 5vw;
  background: rgba(26,25,23,0.97);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.nav-logo { display: flex; align-items: center; text-decoration: none; }
.nav-logo img { height: 62px; width: auto; max-width: 210px; object-fit: contain; }
.nav-tag { font-family: 'DM Sans', sans-serif; font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(242,241,237,0.55); }
.nav-socials { display: flex; align-items: center; gap: 0.9rem; }
.nav-socials a { color: rgba(242,241,237,0.6); display: flex; transition: color 0.2s; }
.nav-socials a:hover { color: #F2F1ED; }
.nav-socials svg { width: 18px; height: 18px; }
.nav-admin-btn {
  background: rgba(242,241,237,0.1); border: 1px solid rgba(242,241,237,0.2); color: #F2F1ED;
  font-family: 'DM Sans', sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500;
  padding: 8px 16px; border-radius: var(--radius); cursor: pointer; transition: all .15s;
}
.nav-admin-btn:hover { background: rgba(242,241,237,0.18); border-color: rgba(242,241,237,0.4); }

.admin-top { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.4rem; flex-wrap: wrap; gap: 1rem; }
.back-link { font-size: 0.78rem; color: var(--muted); background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; margin-bottom: 1.4rem; font-family: inherit; }
.back-link:hover { color: var(--charcoal); }
.admin-row {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 1.2rem;
  padding: 1.3rem 1.6rem; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--white); margin-bottom: 0.7rem; transition: border-color 0.2s;
}
.admin-row:hover { border-color: var(--sand-dark); }
.admin-row-info h4 { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; font-weight: 500; color: var(--charcoal); margin-bottom: 0.3rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.admin-row-info p { font-size: 0.78rem; color: var(--muted); }
.score-pill { font-family: 'DM Sans', sans-serif; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.05em; padding: 0.2rem 0.6rem; border-radius: 99px; background: var(--bg-alt); color: var(--charcoal); }
.score-pill.high { background: var(--ok-bg); color: var(--ok); }
.score-pill.low { background: var(--err-bg); color: var(--err); }
.admin-row-actions { display: flex; gap: 0.4rem; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.admin-row-actions button { font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.45rem 0.8rem; border-radius: var(--radius); border: none; background: none; cursor: pointer; color: var(--sand-dark); font-family: inherit; transition: color 0.15s; white-space: nowrap; }
.admin-row-actions button:hover { color: var(--charcoal); }
.admin-row-actions button.danger:hover { color: var(--err); }

#app { max-width: 720px; margin: 0 auto; padding: 150px 20px 90px; }

.hero { margin-bottom: 2.4rem; }
.hero p.lead { color: var(--muted); font-size: 0.95rem; line-height: 1.85; font-weight: 300; }

.card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 2.2rem; margin-bottom: 1.4rem; }
.card h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.35rem; font-weight: 500; color: var(--charcoal); margin-bottom: 1rem; }
.card p.body-text { font-size: 0.92rem; line-height: 1.85; color: var(--charcoal); font-weight: 300; }

.item-list { list-style: none; display: flex; flex-direction: column; gap: 0.65rem; }
.item-list li { font-size: 0.88rem; color: var(--charcoal); line-height: 1.6; font-weight: 300; display: flex; gap: 0.6rem; }
.item-list li { padding-left: 0; }

.benefit-list { list-style: none; display: flex; flex-direction: column; gap: 0.9rem; }
.benefit-list li { font-size: 0.88rem; color: var(--charcoal); line-height: 1.65; font-weight: 300; padding: 0.9rem 1.1rem; background: var(--bg); border-radius: var(--radius); }
.benefit-list li strong { font-weight: 500; }

.check-block { display: flex; gap: 0.7rem; align-items: flex-start; padding: 1rem 0; border-bottom: 1px solid var(--border); }
.check-block:last-child { border-bottom: none; }
.check-block input[type=checkbox] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--charcoal); cursor: pointer; flex-shrink: 0; }
.check-block label { font-size: 0.88rem; color: var(--charcoal); line-height: 1.6; font-weight: 300; cursor: pointer; }
.check-block label strong { font-weight: 500; }

.quiz-q { padding: 1.1rem 0; border-bottom: 1px solid var(--border); }
.quiz-q:last-child { border-bottom: none; }
.quiz-q-title { font-size: 0.9rem; color: var(--charcoal); font-weight: 500; margin-bottom: 0.7rem; line-height: 1.5; }
.quiz-opt { display: flex; gap: 0.6rem; align-items: flex-start; padding: 0.4rem 0; cursor: pointer; }
.quiz-opt input[type=radio] { width: 17px; height: 17px; margin-top: 2px; accent-color: var(--charcoal); cursor: pointer; flex-shrink: 0; }
.quiz-opt label { font-size: 0.85rem; color: var(--charcoal); font-weight: 300; line-height: 1.5; cursor: pointer; }
.quiz-num { display: inline-block; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1rem; color: var(--sand-dark); margin-right: 0.4rem; }

.field-label { display: block; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sand-dark); font-weight: 600; margin-bottom: 0.5rem; margin-top: 1.1rem; }
.field-label:first-of-type { margin-top: 0; }
.field-hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.4rem; font-weight: 300; }
input[type=text], input[type=email], input[type=tel] {
  width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 0.85rem 1rem; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; color: var(--charcoal);
  outline: none; transition: border-color 0.2s;
}
input:focus { border-color: var(--charcoal); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

.btn-primary {
  display: inline-block; background: var(--charcoal); color: var(--white);
  padding: 0.95rem 2.2rem; border: none; border-radius: var(--radius);
  font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 500;
  cursor: pointer; transition: background 0.2s, transform 0.15s; width: 100%; font-family: inherit;
}
.btn-primary:hover { background: var(--dark); transform: translateY(-2px); }
.btn-primary:disabled { background: var(--sand-dark); cursor: not-allowed; transform: none; }
.loading-spin { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }

.error-box { background: var(--err-bg); border-radius: var(--radius); padding: 0.8rem 1rem; font-size: 0.8rem; color: var(--err); margin-top: 1rem; }
.success-card { text-align: center; padding: 3rem 2rem; }
.success-card h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--ok); margin-bottom: 0.8rem; }
.success-card p { color: var(--muted); font-size: 0.92rem; line-height: 1.7; max-width: 46ch; margin: 0 auto; }

@media (max-width: 600px) {
  .field-row { grid-template-columns: 1fr; }
  .card { padding: 1.6rem; }
}

/* ── Avaliação do motorista ────────────────────────────────── */
.quiz-sec { margin: 1.6rem 0 0.4rem; padding-top: 1.2rem; border-top: 2px solid var(--border); }
.quiz-sec:first-child { margin-top: 0; padding-top: 0; border-top: none; }
.quiz-sec h4 { font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; font-weight: 600;
               color: var(--charcoal); margin: 0 0 0.25rem; }
.quiz-sec p { font-size: 0.82rem; color: var(--muted); margin: 0 0 0.4rem; }
.quiz-img { margin: 0.6rem 0 0.9rem; }
.quiz-img img { max-width: 150px; max-height: 130px; display: block;
                border: 1px solid var(--border); border-radius: 8px;
                background: #fff; padding: 8px; }
.quiz-rank-row { display: flex; align-items: center; justify-content: space-between;
                 gap: 12px; padding: 0.55rem 0; border-bottom: 1px dashed var(--border); }
.quiz-rank-row:last-of-type { border-bottom: none; }
.quiz-rank-row span { font-size: 0.88rem; color: var(--charcoal); }
.quiz-rank-sel { background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
                 padding: 0.45rem 0.6rem; font-family: 'DM Sans', sans-serif;
                 font-size: 0.9rem; color: var(--charcoal); min-width: 62px; }
.quiz-linha { display: flex; align-items: center; gap: 10px; margin-bottom: 0.5rem; }
.quiz-linha-num { width: 22px; height: 22px; flex: none; border-radius: 50%;
                  background: var(--border); color: var(--charcoal); font-size: 0.72rem;
                  font-weight: 700; display: flex; align-items: center; justify-content: center; }
.quiz-linha input { flex: 1; background: var(--bg); border: 1px solid var(--border);
                    border-radius: 8px; padding: 0.6rem 0.8rem;
                    font-family: 'DM Sans', sans-serif; font-size: 0.88rem;
                    color: var(--charcoal); outline: none; }
.quiz-num-wrap { display: flex; align-items: center; gap: 10px; }
.quiz-num-wrap input { width: 160px; background: var(--bg); border: 1px solid var(--border);
                       border-radius: 8px; padding: 0.6rem 0.8rem;
                       font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
                       color: var(--charcoal); outline: none; }
.quiz-unid { font-size: 0.85rem; color: var(--muted); }
@media (max-width: 520px) {
  .quiz-rank-row { flex-direction: column; align-items: flex-start; gap: 6px; }
  .quiz-rank-sel { width: 100%; }
}

.nota-box { display: flex; gap: 12px; flex-wrap: wrap; margin: 1.4rem 0 1rem; }
.nota-item { flex: 1 1 180px; background: var(--bg); border: 1px solid var(--border);
             border-radius: 12px; padding: 1rem 1.1rem; display: flex; flex-direction: column; }
.nota-rot { font-size: 0.72rem; letter-spacing: .06em; text-transform: uppercase;
            color: var(--muted); margin-bottom: 0.45rem; }
.nota-val { font-family: 'Cormorant Garamond', serif; font-size: 2.1rem; font-weight: 600;
            line-height: 1; color: var(--charcoal); }
.nota-val em { font-style: normal; font-size: 1.05rem; color: var(--muted); }
.nota-sub { font-size: 0.76rem; color: var(--muted); margin-top: 0.35rem; }
.nota-nota { font-size: 0.8rem; color: var(--muted); line-height: 1.55; }
</style>

// Envia o candidato para o funil do sistema de R&S assim que ele termina
// o formulário — busca o currículo e o DISC no banco das vagas, casa a vaga pelo
// título no banco do R&S e cria (ou atualiza) o registro em "candidatos".
// Roda em segundo plano: se algo falhar aqui, não afeta a confirmação do candidato.
async function pushCandidatoParaRS(formPayload) {
  if (!rsDb || !db) return;
  try {
    const emailNorm = (formPayload.email || '').trim().toLowerCase();

    const [candidaturaRes, discRes] = await Promise.all([
      db.from('candidaturas').select('cv_url').ilike('email', emailNorm).order('created_at', { ascending:false }).limit(1).maybeSingle(),
      db.from('candidatos_disc').select('primary_profile,secondary_profile').ilike('email', emailNorm).order('created_at', { ascending:false }).limit(1).maybeSingle()
    ]);

    const cvUrl = candidaturaRes?.data?.cv_url || null;
    const discPrimary = discRes?.data?.primary_profile || null;
    const discSecondary = discRes?.data?.secondary_profile || null;
    const DISC_NOMES = { D:'Dominância', I:'Influência', S:'Estabilidade', C:'Conformidade' };

    let obs = formPayload.resumo_prova || `Nota no questionário técnico: ${formPayload.technical_score ?? '-'}.`;
    if (discPrimary) {
      obs += ' ';
      obs += `Perfil DISC: ${DISC_NOMES[discPrimary] || discPrimary}${discSecondary ? ' / ' + (DISC_NOMES[discSecondary] || discSecondary) : ''}.`;
    }
    if (formPayload.observacoes) obs += ` Observações do candidato: ${formPayload.observacoes}`;

    // Casa a vaga pelo título (sem diferenciar maiúsculas/acentos exatos) — se não achar,
    // o candidato ainda entra no funil, só que sem vaga vinculada, com o título anotado.
    const vagaRes = await rsDb.from('vagas').select('id,titulo').ilike('titulo', formPayload.vaga_titulo).limit(1).maybeSingle();
    const vagaId = vagaRes?.data?.id || null;
    if (!vagaId) obs = `[Vaga do site: "${formPayload.vaga_titulo}" — não encontrada no R&S, cadastre-a para vincular automaticamente] ` + obs;

    const documentos = cvUrl ? [{ nome: 'Currículo', url: cvUrl, tipo: 'pdf', enviadoEm: new Date().toISOString(), enviadoPor: 'Site (automático)' }] : [];
    const agora = new Date().toISOString();

    const candidato = {
      id: 'site-' + Date.now().toString(),
      nome: formPayload.nome,
      cpf: null,
      telefone: formPayload.whatsapp,
      email: formPayload.email,
      vaga_id: vagaId,
      etapa: 'triagem', // entra no funil do R&S já na Triagem
      data_entrada: agora.slice(0, 10),
      fonte: 'Site La Vie (vaga + DISC + formulário)',
      obs,
      documentos,
      historico: [{ etapa: 'triagem', data: agora, obs: 'Candidatura completa recebida automaticamente pelo site.', usuario: 'Site (automático)' }],
      criado_por: 'Site (automático)'
    };

    // Evita duplicar se o candidato já existe no R&S (mesmo e-mail + mesma vaga)
    // Quando a vaga não é encontrada no R&S, vaga_id fica NULL. No PostgREST,
    // eq('vaga_id', null) NÃO casa com linhas NULL — sem o is(), o mesmo candidato
    // entraria duplicado a cada envio. Por isso a condição é montada conforme o caso.
    let buscaExistente = rsDb.from('candidatos').select('id').ilike('email', emailNorm);
    buscaExistente = vagaId
      ? buscaExistente.eq('vaga_id', vagaId)
      : buscaExistente.is('vaga_id', null);
    const existente = await buscaExistente.limit(1).maybeSingle();
    if (existente?.data?.id) {
      candidato.id = existente.data.id;
    }
    await rsDb.from('candidatos').upsert(candidato);
  } catch (e) {
    console.warn('Não foi possível enviar o candidato para o R&S:', e);
  }
}

      <textarea id="f-observacoes" rows="3" placeholder="Algo que queira nos contar antes de enviar o formulário..." style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:0.85rem 1rem;font-family:'DM Sans',sans-serif;font-size:0.88rem;color:var(--charcoal);outline:none;resize:vertical;"></textarea>

      <label class="field-label">Pretensão salarial (opcional)</label>
      <input type="text" id="f-pretensao" placeholder="Ex: R$ 6.000,00">
      <div class="field-hint">Deixe em branco se o valor informado durante o processo seletivo atende sua expectativa.</div>
    </div>

    <div class="card">
      <h3>Avaliação de conhecimentos</h3>
      <p class="body-text" style="margin-bottom:1.2rem;">São duas partes: conhecimentos gerais em trânsito e avaliação teórica. Responda com calma, do jeito que você faria no dia a dia.</p>
      <div id="quizBox"></div>
    </div>

    <div class="card">
      <h3>Seus dados</h3>
      <label class="field-label">Nome completo *</label>
      <input type="text" id="f-nome" placeholder="Seu nome completo" value="${esc(prefill.nome)}">
      <div class="field-row">
        <div>
          <label class="field-label">E-mail *</label>
          <input type="email" id="f-email" placeholder="seu@email.com" value="${esc(prefill.email)}">
        </div>
        <div>
          <label class="field-label">WhatsApp *</label>
          <input type="tel" id="f-whatsapp" placeholder="(62) 9 0000-0000" value="${esc(prefill.telefone)}">
        </div>
      </div>
      <div id="formError" style="display:none"></div>
      <div style="margin-top:1.6rem;">
        <button class="btn-primary" id="submitBtn" disabled>Enviar formulário</button>
      </div>
    </div>
  `;

  const nome = document.getElementById('f-nome');
  const email = document.getElementById('f-email');
  const whatsapp = document.getElementById('f-whatsapp');
  const cPj = document.getElementById('c-pj');
  const cRem = document.getElementById('c-remuneracao');
  const cPres = document.getElementById('c-presencial');
  const cHor = document.getElementById('c-horario');
  const submitBtn = document.getElementById('submitBtn');

  // Render do questionário técnico (mesmo padrão visual dos outros formulários)
  const quizBox = document.getElementById('quizBox');
  if (quizBox) {
    let blocoAtual = '';
    quizBox.innerHTML = QUIZ.map((item, qi) => {
      let cabecalho = '';
      if (item.bloco !== blocoAtual) {
        blocoAtual = item.bloco;
        cabecalho = item.bloco === 'conhecimentos'
          ? `<div class="quiz-sec"><h4>Parte 1 — Conhecimentos gerais em trânsito</h4>
               <p>20 questões de múltipla escolha. Observe a imagem e marque a alternativa correta.</p></div>`
          : `<div class="quiz-sec"><h4>Parte 2 — Avaliação teórica</h4>
               <p>5 questões sobre condução, mecânica e cálculo de autonomia.</p></div>`;
      }

      const img = item.img
        ? `<div class="quiz-img"><img src="${item.img}" alt="Imagem da questão ${qi + 1}"></div>` : '';

      let corpo = '';
      if (item.tipo === 'mc') {
        corpo = item.options.map((opt, oi) => `
          <div class="quiz-opt">
            <input type="radio" name="quiz-${qi}" id="quiz-${qi}-${oi}" value="${oi}">
            <label for="quiz-${qi}-${oi}">${esc(opt)}</label>
          </div>`).join('');
      } else if (item.tipo === 'rank') {
        corpo = item.options.map((opt, oi) => `
          <div class="quiz-rank-row">
            <span>${esc(opt)}</span>
            <select name="quiz-${qi}-${oi}" class="quiz-rank-sel">
              <option value="">—</option>
              <option value="1">1</option><option value="2">2</option>
              <option value="3">3</option><option value="4">4</option>
            </select>
          </div>`).join('') +
          `<div class="field-hint">Use cada número uma única vez.</div>`;
      } else if (item.tipo === 'num') {
        corpo = `
          <div class="quiz-num-wrap">
            <input type="number" step="any" name="quiz-${qi}" placeholder="0">
            <span class="quiz-unid">${esc(item.unidade || '')}</span>
          </div>
          ${item.dica ? `<div class="field-hint">Dica: ${esc(item.dica)}</div>` : ''}`;
      }

      return `${cabecalho}
        <div class="quiz-q" data-qi="${qi}">
          <div class="quiz-q-title"><span class="quiz-num">${qi + 1}.</span>${esc(item.q)}</div>
          ${img}
          ${corpo}
        </div>`;
    }).join('');

    // Numeração reinicia em cada parte, como nas provas impressas
    let nc = 0, nt = 0;
    quizBox.querySelectorAll('.quiz-q').forEach((el, i) => {
      const n = QUIZ[i].bloco === 'conhecimentos' ? ++nc : ++nt;
      el.querySelector('.quiz-num').textContent = n + '.';
    });
  }

  function check() {
    submitBtn.disabled = !(
      nome.value.trim() &&
      email.value.includes('@') &&
      whatsapp.value.trim() &&
      cPj.checked && cRem.checked && cPres.checked && cHor.checked
    );
  }
  [nome, email, whatsapp, cPj, cRem, cPres, cHor].forEach(el => el.addEventListener('input', check));

  submitBtn.addEventListener('click', async () => {
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="loading-spin"></span>Enviando...';
    document.getElementById('formError').style.display = 'none';

    // Apura o questionário técnico
    // Normaliza texto para comparar palavra-chave sem acento nem caixa
    function _n(t){ return (t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

    const technicalAnswers = QUIZ.map((item, qi) => {
      const base = { bloco: item.bloco, tipo: item.tipo, pergunta: item.q };

      if (item.tipo === 'mc') {
        const sel = document.querySelector(`input[name="quiz-${qi}"]:checked`);
        const c = sel ? parseInt(sel.value, 10) : null;
        return { ...base, escolhida: c !== null ? item.options[c] : null,
                 correta: c === item.correct, pontos: c === item.correct ? 1 : 0, valor: 1 };
      }

      if (item.tipo === 'rank') {
        const dadas = item.options.map((_, oi) => {
          const v = document.querySelector(`select[name="quiz-${qi}-${oi}"]`).value;
          return v ? parseInt(v, 10) : null;
        });
        const acertos = dadas.filter((v, oi) => v === item.gabarito[oi]).length;
        return { ...base, escolhida: item.options.map((o, oi) => `${o}: ${dadas[oi] ?? '—'}`).join(' | '),
                 correta: acertos === 4, pontos: acertos, valor: 4 };
      }

      if (item.tipo === 'num') {
        const bruto = document.querySelector(`input[name="quiz-${qi}"]`).value;
        const v = bruto === '' ? null : parseFloat(bruto);
        const ok = v !== null && Math.abs(v - item.resposta) <= item.tolerancia;
        return { ...base, escolhida: v !== null ? `${v} ${item.unidade}` : null,
                 correta: ok, pontos: ok ? 1 : 0, valor: 1 };
      }
      return base;
    });

    // Nota da Parte 1 na régua da TCL: 10 pontos, com as três faixas de aptidão
    const conh = technicalAnswers.filter(a => a.bloco === 'conhecimentos');
    const acertosConh = conh.filter(a => a.correta).length;
    const notaConh = Math.round((acertosConh / conh.length) * 10 * 10) / 10;
    const aptidao = notaConh < 6 ? 'INAPTO'
                  : notaConh <= 7 ? 'APTO COM ACOMPANHAMENTO'
                  : 'APTO';

    // Parte 2 é somatória: múltipla escolha 1, ordenação 4, conta-giros 5, cálculos 1 cada
    const teo = technicalAnswers.filter(a => a.bloco === 'teorica');
    const pontosTeo = teo.reduce((t, a) => t + (a.pontos || 0), 0);
    const totalTeo  = teo.reduce((t, a) => t + (a.valor  || 0), 0);

    const technicalScore = acertosConh;   // mantém compatível com o painel

    const result = await saveForm({
      nome: nome.value.trim(),
      email: email.value.trim(),
      whatsapp: whatsapp.value.trim(),
      vaga_titulo: prefill.vaga,
      pretensao_salarial: document.getElementById('f-pretensao').value.trim() || null,
      observacoes: document.getElementById('f-observacoes').value.trim() || null,
      ciente_pj: cPj.checked,
      ciente_remuneracao: cRem.checked,
      ciente_presencial: cPres.checked,
      ciente_horario: cHor.checked,
      technical_score: technicalScore,
      technical_answers: technicalAnswers,
      nota_conhecimentos: notaConh,
      aptidao: aptidao,
      pontos_teorica: pontosTeo,
      total_teorica: totalTeo
    });

    if (result.ok) {
      pushCandidatoParaRS({
        nome: nome.value.trim(),
        email: email.value.trim(),
        whatsapp: whatsapp.value.trim(),
        vaga_titulo: prefill.vaga,
        technical_score: technicalScore,
        resumo_prova: `Conhecimentos em trânsito: ${notaConh}/10 (${aptidao}). Avaliação teórica: ${pontosTeo}/${totalTeo}.`,
        observacoes: document.getElementById('f-observacoes').value.trim() || null
      });
      app.innerHTML = `
        <div class="card success-card">
          <h2>Avaliação recebida ✓</h2>
          <p>Obrigado, ${esc(nome.value.trim())}. Suas respostas para a vaga de <strong>${esc(prefill.vaga)}</strong> foram recebidas. A equipe da La Vie Consultoria vai analisar seu perfil e entrará em contato pelos dados informados.</p>

          <div class="nota-box">
            <div class="nota-item">
              <span class="nota-rot">Conhecimentos gerais em trânsito</span>
              <span class="nota-val">${notaConh.toFixed(1).replace('.', ',')}<em>/10</em></span>
              <span class="nota-sub">${acertosConh} de ${conh.length} questões corretas</span>
            </div>
            <div class="nota-item">
              <span class="nota-rot">Avaliação teórica</span>
              <span class="nota-val">${pontosTeo}<em>/${totalTeo}</em></span>
              <span class="nota-sub">pontos obtidos</span>
            </div>
          </div>

          <p class="nota-nota">A nota é apenas uma parte da análise. O resultado do processo considera também sua experiência, a entrevista e o perfil comportamental.</p>
        </div>
      `;
    } else {
      const errBox = document.getElementById('formError');
      errBox.innerHTML = `<div class="error-box">Erro ao enviar: ${esc(result.err)}. Tente novamente.</div>`;
      errBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Enviar formulário';
      check();
    }
  });
}

async function renderAdmin() {
  document.getElementById('navTag').textContent = 'Painel do recrutador';
  app.innerHTML = `<p style="color:var(--muted);">Carregando candidatos...</p>`;

  const subs = await loadSubmissions();
  if (state.view !== 'admin') return;

  if (subs.length === 0) {
    app.innerHTML = `
      <button class="back-link" id="backBtn">← Voltar ao formulário</button>
      <span class="eyebrow">Painel do recrutador</span>
      <h1 class="section-title">Respostas do <em>formulário</em></h1>
      <p style="color:var(--muted);font-size:0.9rem;">Nenhuma resposta recebida ainda.</p>
    `;
    document.getElementById('backBtn').addEventListener('click', () => { state.view = 'form'; render(); });
    return;
  }

  app.innerHTML = `
    <button class="back-link" id="backBtn">← Voltar ao formulário</button>
    <div class="admin-top">
      <div>
        <span class="eyebrow">Painel do recrutador</span>
        <h1 class="section-title" style="margin-bottom:0;">Respostas do <em>formulário</em></h1>
      </div>
    </div>
    <p style="color:var(--muted);font-size:0.85rem;margin-bottom:1.4rem;">${subs.length} candidato(s) · Motorista Carreteiro</p>
    <div id="subsList"></div>
  `;

  document.getElementById('backBtn').addEventListener('click', () => { state.view = 'form'; render(); });

  document.getElementById('subsList').innerHTML = subs.map(s => {
    const score = s.technical_score ?? null;
    const scoreClass = score === null ? '' : (score >= 4 ? 'high' : (score <= 2 ? 'low' : ''));
    return `
      <div class="admin-row" data-id="${s.id}">
        <div class="admin-row-info">
          <h4>${esc(s.nome)} ${score !== null ? `<span class="score-pill ${scoreClass}">${score}/5 no técnico</span>` : ''}</h4>
          <p>${esc(s.email)} · ${esc(s.whatsapp) || '-'} · ${new Date(s.created_at).toLocaleDateString('pt-BR')}</p>
        </div>
        <div class="admin-row-actions">
          <button class="pdf-btn" data-id="${s.id}">Baixar PDF</button>
          <button class="danger del-btn" data-id="${s.id}">Remover</button>
        </div>
      </div>
    `;
  }).join('');

  document.querySelectorAll('.pdf-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const sub = subs.find(x => x.id === btn.dataset.id);
      buildSubmissionPDF(sub);
    });
  });
  document.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Remover esta resposta permanentemente?')) return;
      await deleteSubmission(btn.dataset.id);
      renderAdmin();
    });
  });
}

function buildSubmissionPDF(s) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const W = doc.internal.pageSize.getWidth();
  const M = 52;
  let y = 60;

  const INK = [58, 58, 58];
  const SOFT = [122, 119, 110];
  const BORDER = [216, 207, 196];
  const OK = [74, 122, 66];
  const ERR = [192, 57, 43];

  function checkPageBreak(next) {
    if (y + next > 800) { doc.addPage(); y = 60; }
  }

  try { doc.addImage(LOGO_PDF_B64, 'PNG', M, y - 28, 28, 36); } catch(e) {}
  doc.setFont('times', 'italic');
  doc.setFontSize(18);
  doc.setTextColor(...INK);
  doc.text('La Vie Consultoria', M + 38, y);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8.5);
  doc.setTextColor(...SOFT);
  doc.text('FORMULÁRIO DA VAGA · RESUMO PARA O RECRUTADOR', M + 38, y + 13);
  doc.setDrawColor(...BORDER);
  doc.line(M, y + 24, W - M, y + 24);
  y += 46;

  doc.setFont('times', 'italic');
  doc.setTextColor(...INK);
  let fNameSize = 22;
  doc.setFontSize(fNameSize);
  const fMaxNameWidth = W - M * 2;
  while (fNameSize > 13 && doc.getTextWidth(pdfSafe(s.nome)) > fMaxNameWidth) {
    fNameSize -= 1;
    doc.setFontSize(fNameSize);
  }
  doc.text(pdfSafe(s.nome), M, y);
  y += fNameSize * 0.75;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9.5);
  doc.setTextColor(...SOFT);
  doc.text(pdfSafe(`${s.email || ''} · ${s.whatsapp || ''} · Enviado em ${new Date(s.created_at).toLocaleDateString('pt-BR')}`), M, y);
  y += 12;
  doc.text(pdfSafe(`Vaga: ${s.vaga_titulo || ''}`), M, y);
  y += 26;

  // Ciência das condições
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10.5);
  doc.setTextColor(...INK);
  doc.text('Condições da vaga', M, y);
  y += 16;
  const conds = [
    ['Contratação PJ', s.ciente_pj],
    ['Remuneração R$ 2.018,00 + variáveis', s.ciente_remuneracao],
    ['Presencial em Goiânia/GO', s.ciente_presencial],
    ['Horário de funcionamento do departamento', s.ciente_horario]
  ];
  conds.forEach(([label, val]) => {
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9.5);
    doc.setTextColor(...(val ? OK : ERR));
    doc.text(val ? 'SIM' : 'NAO', M, y);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(...INK);
    doc.text(label, M + 32, y);
    y += 15;
  });
  if (s.pretensao_salarial && s.pretensao_salarial.trim().length > 1) {
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9.5);
    doc.setTextColor(...SOFT);
    doc.text(pdfSafe(`Pretensão salarial informada: ${s.pretensao_salarial}`), M, y);
    y += 15;
  }
  if (s.observacoes) {
    checkPageBreak(30);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9.5);
    doc.setTextColor(...SOFT);
    const obsLines = doc.splitTextToSize(pdfSafe(`Observações: ${s.observacoes}`), W - M * 2);
    doc.text(obsLines, M, y);
    y += obsLines.length * 12 + 4;
  }
  y += 14;

  // Questionário técnico
  checkPageBreak(40);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10.5);
  doc.setTextColor(...INK);
  doc.text(`Questionário técnico: nota ${s.technical_score ?? '-'} / 5`, M, y);
  y += 18;

  (Array.isArray(s.technical_answers) ? s.technical_answers : []).forEach((a, i) => {
    checkPageBreak(50);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.setTextColor(...INK);
    const qLines = doc.splitTextToSize(pdfSafe(`${i + 1}. ${a.pergunta}`), W - M * 2);
    doc.text(qLines, M, y);
    y += qLines.length * 11 + 3;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(...(a.correta ? OK : ERR));
    const respLines = doc.splitTextToSize(pdfSafe(`Resposta: ${a.escolhida || '(não respondida)'} ${a.correta ? '(correta)' : '(incorreta)'}`), W - M * 2 - 10);
    doc.text(respLines, M + 10, y);
    y += respLines.length * 11 + 10;
  });

  doc.setFontSize(8);
  doc.setTextColor(180, 175, 168);
  doc.text('La Vie Consultoria · lavieconsultoria.com · Documento de uso interno do processo seletivo.', M, 822);

  doc.save('formulario-' + (s.nome || 'candidato').toLowerCase().replace(/\s+/g, '-') + '.pdf');
}

// ═══════════════════════════════════════════════════════
// ROUTER
// ═══════════════════════════════════════════════════════
function render() {
  if (state.view === 'form') { document.getElementById('navTag').textContent = 'Etapa 3 de 3 · Formulário da vaga'; renderForm(); }
  else if (state.view === 'admin') renderAdmin();
}

document.getElementById('adminBtn').addEventListener('click', () => {
  if (state.view === 'admin') { state.view = 'form'; render(); return; }
  const pw = prompt('Senha:');
  if (pw === ADMIN_PASS) { state.view = 'admin'; render(); }
  else if (pw !== null) alert('Senha incorreta.');
});

render();
})();
</script>
