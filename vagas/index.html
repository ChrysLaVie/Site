<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; font-size:17.5px; }
body {
  font-family:'DM Sans',sans-serif;
  background:var(--bg); color:var(--charcoal);
  font-weight:300; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}

:root {
  --bg:        #F2F1ED;
  --bg-alt:    #E8E4DE;
  --dark:      #1a1917;
  --charcoal:  #302F2C;
  --muted:     #58554E;
  --sand:      #D8CFC4;
  --sand-dark: #8C7F6C;
  --white:     #FFFFFF;
  --border: rgba(58,58,58,0.14);
  --radius:    4px;
  --ok: #5f6b4c;
  --ok-bg: #e8ece2;
  --err: #c0392b;
  --err-bg: #fbeae7;
}

.serif { font-family:'Cormorant Garamond',serif; }
.eyebrow {
  display:block; font-size:0.68rem; font-weight:500;
  letter-spacing:0.25em; text-transform:uppercase;
  color:var(--sand-dark); margin-bottom:1.2rem;
}
.section-title {
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(2rem,4vw,3.4rem);
  font-weight:300; line-height:1.1; margin-bottom:1.8rem;
  color:var(--charcoal);
}
.section-title em { font-style:italic; color:var(--dark); }

/* Nav */
nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:0.85rem 5vw;
  background:rgba(26,25,23,0.97);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,0.07);
}
.nav-logo { display:flex; align-items:center; text-decoration:none; flex-shrink:0; }
.nav-logo img { height:64px; width:auto; max-width:220px; object-fit:contain; display:block; }
.nav-cta {
  background:rgba(242,241,237,0.1); border:1px solid rgba(242,241,237,0.2); color:#F2F1ED;
  padding:0.6rem 1.4rem; border-radius:var(--radius); text-decoration:none;
  font-size:0.7rem; letter-spacing:0.14em; text-transform:uppercase; font-weight:500;
  cursor:pointer; transition:all 0.2s; font-family:inherit;
}
.nav-cta:hover { background:rgba(242,241,237,0.18); border-color:rgba(242,241,237,0.4); }
.nav-right { display:flex; align-items:center; gap:1.2rem; }
.nav-socials { display:flex; align-items:center; gap:0.9rem; }
.nav-socials a { color:rgba(242,241,237,0.6); display:flex; transition:color 0.2s; }
.nav-socials a:hover { color:#F2F1ED; }
.nav-socials svg { width:19px; height:19px; }

#app { padding-top:150px; }

/* Hero */
.vagas-hero { padding:2.5rem max(2rem,8vw) 3rem; background:var(--bg); }
.vagas-hero p.lead { color:var(--muted); font-size:0.95rem; line-height:1.85; max-width:560px; font-weight:300; }

/* Lista de vagas */
.vagas-list-wrap { padding:0 max(2rem,8vw) 6rem; background:var(--bg); }
.vagas-list { display:flex; flex-direction:column; gap:1.4rem; max-width:820px; }
.vaga-card {
  border:1px solid var(--border); border-radius:var(--radius); background:var(--white);
  transition:border-color 0.3s; overflow:hidden; cursor:pointer;
}
.vaga-card:hover { border-color:var(--charcoal); }
.vaga-card-top { padding:1.8rem 2rem; display:flex; justify-content:space-between; align-items:flex-start; gap:1.2rem; }
.vaga-setor { font-size:0.63rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--sand-dark); font-weight:600; display:block; margin-bottom:0.5rem; }
.vaga-card h3 { font-family:'Cormorant Garamond',serif; font-size:1.35rem; font-weight:500; color:var(--charcoal); margin-bottom:0.7rem; }
.vaga-meta { display:flex; gap:0.9rem; flex-wrap:wrap; }
.vaga-meta span { font-size:0.78rem; color:var(--muted); }
.vaga-remun { color:var(--charcoal); font-weight:500; }
.vaga-arrow { font-family:'Cormorant Garamond',serif; font-size:1.4rem; color:var(--sand-dark); flex-shrink:0; transition:transform 0.2s; }
.vaga-card.open .vaga-arrow { transform:rotate(90deg); }
.vaga-detail { display:none; padding:0 2rem 2rem; border-top:1px solid var(--border); }
.vaga-card.open .vaga-detail { display:block; padding-top:1.8rem; }
.vaga-detail p.desc { font-size:0.9rem; color:var(--charcoal); line-height:1.8; font-weight:300; margin-bottom:1.8rem; white-space:pre-line; }
.vaga-detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:2rem; }
.vaga-detail h4 { font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--sand-dark); font-weight:600; margin-bottom:0.8rem; }
.vaga-detail ul { list-style:none; display:flex; flex-direction:column; gap:0.5rem; }
.vaga-detail li { font-size:0.83rem; color:var(--charcoal); line-height:1.6; font-weight:300; display:flex; gap:0.5rem; }
.vaga-detail li::before { content:'•'; color:var(--sand-dark); flex-shrink:0; }
.btn-primary {
  display:inline-block; background:var(--charcoal); color:var(--white);
  padding:0.9rem 2rem; text-decoration:none; border-radius:var(--radius);
  font-size:0.75rem; letter-spacing:0.15em; text-transform:uppercase;
  font-weight:500; transition:background 0.2s, transform 0.15s;
  border:none; cursor:pointer; font-family:inherit;
}
.btn-primary:hover { background:var(--dark); transform:translateY(-2px); }
.btn-primary:disabled { background:var(--sand-dark); cursor:not-allowed; transform:none; }
.empty-note { color:var(--muted); font-size:0.9rem; font-weight:300; }

/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(26,25,23,0.55); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto; }
.modal-box { background:var(--white); border-radius:var(--radius); padding:2.4rem; max-width:520px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:0 12px 50px rgba(0,0,0,0.25); position:relative; margin:auto; }
.modal-box.wide { max-width:680px; }
.modal-close { position:absolute; top:1.1rem; right:1.3rem; background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--muted); line-height:1; }
.modal-close:hover { color:var(--charcoal); }
.modal-box h3 { font-family:'Cormorant Garamond',serif; font-size:1.5rem; font-weight:500; color:var(--charcoal); margin-bottom:0.3rem; padding-right:1.5rem; }
.modal-box .modal-sub { font-size:0.8rem; color:var(--muted); margin-bottom:1.6rem; }

.form-group { margin-bottom:1rem; }
.form-group label.fl { display:block; font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--sand-dark); font-weight:600; margin-bottom:0.5rem; }
.form-group input,
.form-group select,
.form-group textarea {
  width:100%; background:var(--bg);
  border:1px solid var(--border); border-radius:var(--radius);
  padding:0.85rem 1rem; font-family:inherit;
  font-size:0.88rem; color:var(--charcoal);
  outline:none; transition:border-color 0.2s; resize:none;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--charcoal); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
.form-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:1rem; }
textarea.ta { min-height:76px; }

.file-drop {
  border:1px dashed var(--border); border-radius:var(--radius); padding:1.2rem;
  text-align:center; cursor:pointer; transition:border-color 0.2s; background:var(--bg);
}
.file-drop:hover { border-color:var(--sand-dark); }
.file-drop.has-file { border-color:var(--charcoal); border-style:solid; }
.file-drop input[type=file] { display:none; }
.file-drop-label { font-size:0.83rem; color:var(--muted); cursor:pointer; }
.file-drop-label strong { color:var(--charcoal); }
.file-name { font-size:0.78rem; color:var(--charcoal); font-weight:500; margin-top:0.4rem; }

.check-row { display:flex; align-items:center; gap:0.6rem; margin-top:1.2rem; }
.check-row input { width:16px; height:16px; accent-color:var(--charcoal); cursor:pointer; }
.check-row label { font-size:0.8rem; color:var(--charcoal); cursor:pointer; }

.success-box { background:var(--ok-bg); border-radius:var(--radius); padding:1.6rem; text-align:center; }
.success-box h3 { font-family:'Cormorant Garamond',serif; font-size:1.3rem; color:var(--ok); margin-bottom:0.5rem; }
.success-box p { font-size:0.85rem; color:#4A5240; line-height:1.6; font-weight:300; }
.error-box { background:var(--err-bg); border-radius:var(--radius); padding:0.8rem 1rem; font-size:0.8rem; color:var(--err); margin-top:0.8rem; }
.loading-spin { display:inline-block; width:13px; height:13px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:8px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Admin */
.admin-wrap { padding:2.5rem max(2rem,8vw) 6rem; background:var(--bg); max-width:1000px; }
.admin-top { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:1rem; flex-wrap:wrap; gap:1rem; }
.back-link { font-size:0.78rem; color:var(--muted); background:none; border:none; cursor:pointer; display:flex; align-items:center; gap:0.4rem; margin-bottom:1.6rem; font-family:inherit; }
.back-link:hover { color:var(--charcoal); }

.admin-tabs { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:2.2rem; }
.tab-btn2 {
  background:none; border:none; cursor:pointer; font-family:inherit;
  font-size:0.78rem; font-weight:400; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--muted); padding:0.8rem 1.5rem 0.8rem 0; margin-right:1.5rem;
  border-bottom:2px solid transparent; transition:color 0.2s;
}
.tab-btn2.active { color:var(--charcoal); border-bottom-color:var(--sand-dark); font-weight:500; }

.stat-row { display:flex; gap:2.4rem; margin-bottom:2rem; flex-wrap:wrap; }
.stat-num { font-family:'Cormorant Garamond',serif; font-size:2.1rem; font-weight:500; color:var(--charcoal); line-height:1; }
.stat-num.ok { color:var(--ok); }
.stat-label { font-size:0.68rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-top:0.3rem; }

.filter-row2 { display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:1.6rem; }
.filter-chip2 { font-size:0.72rem; letter-spacing:0.03em; padding:0.5rem 1rem; border-radius:20px; border:1px solid var(--border); background:none; cursor:pointer; color:var(--muted); transition:all 0.15s; font-family:inherit; }
.filter-chip2.active { background:var(--charcoal); color:var(--white); border-color:var(--charcoal); }

.entry-row {
  display:flex; justify-content:space-between; align-items:flex-start; gap:1.2rem;
  padding:1.4rem 1.6rem; border:1px solid var(--border); border-radius:var(--radius);
  background:var(--white); margin-bottom:0.7rem; transition:border-color 0.2s;
}
.entry-row:hover { border-color:var(--sand-dark); }
.entry-info h4 { font-family:'Cormorant Garamond',serif; font-size:1.05rem; font-weight:500; color:var(--charcoal); margin-bottom:0.3rem; display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap; }
.entry-info p { font-size:0.78rem; color:var(--muted); }
.status-dot2 { width:6px; height:6px; border-radius:50%; display:inline-block; }
.status-dot2.on { background:var(--ok); }
.status-dot2.off { background:var(--sand-dark); }
.entry-actions { display:flex; gap:0.3rem; flex-wrap:wrap; justify-content:flex-end; flex-shrink:0; }
.entry-actions button, .entry-actions a {
  font-size:0.7rem; letter-spacing:0.06em; text-transform:uppercase; padding:0.4rem 0.7rem;
  border-radius:var(--radius); border:none; background:none; cursor:pointer;
  color:var(--sand-dark); text-decoration:none; transition:color 0.15s; font-family:inherit; white-space:nowrap;
}
.entry-actions button:hover, .entry-actions a:hover { color:var(--charcoal); }

.cand-row { border:1px solid var(--border); border-radius:var(--radius); background:var(--white); padding:1.3rem 1.6rem; margin-bottom:0.8rem; transition:border-color 0.2s; }
.cand-row:hover { border-color:var(--sand-dark); }
.cand-top { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; margin-bottom:0.8rem; }
.cand-top h4 { font-family:'Cormorant Garamond',serif; font-size:1.1rem; font-weight:500; color:var(--charcoal); }
.cand-top p { font-size:0.78rem; color:var(--muted); margin-top:0.2rem; }
.cand-stages { display:flex; flex-wrap:wrap; gap:0.6rem; }
.stage-chip { display:flex; align-items:center; gap:0.5rem; padding:0.5rem 0.8rem; border-radius:var(--radius); background:var(--bg); font-size:0.75rem; color:var(--muted); }
.stage-chip.done { background:var(--ok-bg); color:var(--ok); }
.stage-chip.pending { color:var(--sand-dark); }
.stage-chip button, .stage-chip a { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.04em; background:none; border:none; color:inherit; text-decoration:underline; cursor:pointer; font-family:inherit; padding:0; }
.dossie-btn { font-size:0.72rem; letter-spacing:0.06em; text-transform:uppercase; padding:0.5rem 1rem; border-radius:var(--radius); border:1px solid var(--border); background:none; color:var(--charcoal); cursor:pointer; font-family:inherit; white-space:nowrap; transition:all 0.15s; flex-shrink:0; }
.dossie-btn:hover { background:var(--charcoal); color:#fff; border-color:var(--charcoal); }
.action-btn { font-size:0.72rem; letter-spacing:0.06em; text-transform:uppercase; padding:0.5rem 1rem; border-radius:var(--radius); border:1px solid var(--border); background:none; color:var(--charcoal); cursor:pointer; font-family:inherit; white-space:nowrap; transition:all 0.15s; flex-shrink:0; }
.action-btn:hover { background:var(--charcoal); color:#fff; border-color:var(--charcoal); }
.action-btn.danger-outline { border-color:var(--err); color:var(--err); }
.action-btn.danger-outline:hover { background:var(--err); color:#fff; border-color:var(--err); }
.dossie-section { margin-bottom:1.6rem; padding-bottom:1.6rem; border-bottom:1px solid var(--border); }
.dossie-section:last-of-type { border-bottom:none; margin-bottom:0; padding-bottom:0; }
.dossie-section h4 { font-family:'Cormorant Garamond',serif; font-size:1.15rem; font-weight:500; color:var(--charcoal); margin-bottom:0.7rem; }
.dossie-row { display:flex; justify-content:space-between; align-items:center; font-size:0.85rem; color:var(--charcoal); padding:0.3rem 0; }
.dossie-row span.lbl { color:var(--muted); }
.dossie-empty { font-size:0.85rem; color:var(--muted); font-style:italic; }
.entry-actions button.danger:hover { color:var(--err); }
.new-dot { width:6px; height:6px; border-radius:50%; background:var(--err); display:inline-block; }

.empty-admin { text-align:center; padding:3.5rem 1rem; color:var(--muted); font-size:0.9rem; border-top:1px solid var(--border); }
.empty-admin .btn-primary { margin-top:1.2rem; }

/* Footer */
footer {
  background:var(--dark); padding:2.5rem 8vw;
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem;
}
.footer-logo img { height:56px; width:auto; opacity:0.9; }
footer p { font-size:0.75rem; color:rgba(242,241,237,0.35); }
footer p a { color:inherit; text-decoration:none; }
.footer-links { display:flex; gap:1.4rem; align-items:center; }
.footer-links a { color:rgba(242,241,237,0.35); font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; text-decoration:none; transition:color 0.2s; }
.footer-links a:hover { color:var(--sand-dark); }

@media (max-width:760px) {
  .vaga-detail-grid, .form-row, .form-row-3 { grid-template-columns:1fr; gap:1.2rem; }
  .entry-row { flex-direction:column; }
  .entry-actions { justify-content:flex-start; }
  footer { flex-direction:column; text-align:center; }
}

async function saveCandidatura(data) {
  if (!db) return { ok:false, err:'Banco não configurado' };
  try {
    let cv_url = null;
    const files = data.files || (data.file ? [data.file] : []);
    // Mesma barreira do lado do sistema de R&S: tamanho máximo e tipos
    // permitidos. Aqui é ainda mais importante avisar com uma mensagem clara,
    // já que quem está enviando é o próprio candidato, não a equipe.
    const TAMANHO_MAX = 10*1024*1024; // 10 MB
    const TIPOS_PERMITIDOS = ['application/pdf','application/msword',
      'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
      'image/png','image/jpeg'];
    const EXT_PERMITIDAS = ['pdf','doc','docx','png','jpg','jpeg'];
    for (const f of files) {
      const ext = (f.name.split('.').pop()||'').toLowerCase();
      if (f.size > TAMANHO_MAX) {
        return { ok:false, err:`O arquivo "${f.name}" passa de 10 MB. Envie um arquivo menor.` };
      }
      if (!TIPOS_PERMITIDOS.includes(f.type) && !EXT_PERMITIDAS.includes(ext)) {
        return { ok:false, err:`O arquivo "${f.name}" não é um formato aceito. Envie PDF, Word, PNG ou JPG.` };
      }
    }
    if (files.length) {
      const paths = [];
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        const ext = f.name.split('.').pop();
        const nomeArquivo = (data.nome || 'candidato')
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '')   // remove acentos
          .replace(/[^a-zA-Z0-9\s-]/g, '')                     // remove outros caracteres inválidos
          .trim().replace(/\s+/g, '-').toLowerCase();
        const path = `${Date.now()}-${i}-${nomeArquivo || 'candidato'}.${ext}`;
        const { error: upErr } = await db.storage.from('curriculos').upload(path, f);
        // Guarda só o caminho do arquivo, não uma URL pública — o bucket é
        // privado, então o link pra abrir é sempre gerado na hora (ver
        // abrirCurriculo), nunca fica fixo/permanente.
        if (!upErr) { paths.push(path); }
        else { console.warn('Falha ao enviar currículo:', f.name, upErr.message); }
      }
      if (paths.length) cv_url = paths.join('\n');
    }
    // Se o candidato anexou arquivo(s) mas NENHUM foi salvo, avisa em vez de
    // prosseguir silenciosamente sem currículo (o que já causou candidaturas
    // "completas" no painel sem nenhum arquivo anexado).
    if (files.length && !cv_url) {
      return { ok:false, err:'Não foi possível enviar seu(s) arquivo(s). Tente novamente ou use outro formato/nome de arquivo.' };
    }

    if (error) return { ok:false, err:error.message };
    return { ok:true, cv_url };
  } catch(e) { return { ok:false, err:e.message }; }
}

// Extrai o caminho do arquivo tanto de uma URL pública antiga (de antes do
// bucket virar privado) quanto de um path novo já salvo puro — pra não

function _pathDoCurriculo(v) {
  v = (v || '').trim();
  const marcador = '/curriculos/';
  const i = v.indexOf(marcador);
  if (v.startsWith('http') && i >= 0) return decodeURIComponent(v.slice(i + marcador.length));
  return v;
}
// Gera um link temporário pro currículo (60s, só pra abrir na hora). Usado

async function abrirCurriculo(valor) {
  const path = _pathDoCurriculo(valor);
  if (!db) { alert('Conexão indisponível.'); return; }
  try {
    const { data, error } = await db.storage.from('curriculos').createSignedUrl(path, 60);

      const { data: { user } } = await db.auth.getUser();
      await db.from('curriculo_access_log').insert({ path, acessado_por: user?.id || null, acessado_por_email: user?.email || null });

    window.open(data.signedUrl, '_blank', 'noopener');
  } catch(e) { alert('Não foi possível abrir o currículo agora.'); }
}

  if (!db) return valor;

    const { data, error } = await db.storage.from('curriculos').createSignedUrl(path, 7*24*3600);
    if (error || !data) return valor;
    return data.signedUrl;
  } catch(e) { return valor; }
}
window.__abrirCurriculo = abrirCurriculo;

// ── SUPABASE: DISC e FORMULÁRIO (para a aba "Candidatos") ──
async function loadCandidatosDisc() {
  if (!db) return [];
  try { const { data } = await db.from('candidatos_disc').select('*').order('created_at', { ascending:false }); return data || []; }
  catch(e) { return []; }
}
// Lista de tabelas de formulário técnico — uma por vaga com forms próprio,
// mais a genérica (vagas sem forms específico). Sempre que uma vaga nova ganhar
// seu próprio formulário/tabela, adicionar o nome da tabela aqui.
const FORMS_TABLES = ['forms_gerente_captacao', 'forms_coord_instituto', 'forms_gerente_marketing', 'forms_coord_relacionamento', 'forms_motorista', 'forms_consultor_protecao_veicular', 'forms_generico'];
async function loadFormsRespostas() {
  if (!db) return [];
  const all = [];
  for (const t of FORMS_TABLES) {
    try {
      const { data, error } = await db.from(t).select('*').order('created_at', { ascending:false });
      // Marca cada linha com a tabela de origem (_tabela) — necessário porque
      // o formulário técnico está espalhado em várias tabelas (uma por vaga),
      // e pra arquivar/excluir precisamos saber em qual tabela mexer.
      if (!error && data) all.push(...data.map(row => ({ ...row, _tabela: t })));
    } catch(e) { /* tabela pode não existir ainda — ignora e segue */ }
  }
  return all.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
}
// ── Arquivar/excluir DISC e Formulário isoladamente ──
// Usado quando o candidato ainda não tem candidatura (não se aplicou a
// nenhuma vaga), só fez o DISC e/ou respondeu o formulário — nesse caso não
// existe linha em "candidaturas" pra arquivar/excluir, então mexemos direto
// nas tabelas candidatos_disc / forms_*.
async function arquivarDisc(id, valor) { if (!db) return; try { await db.from('candidatos_disc').update({ arquivada: valor }).eq('id', id); } catch(e) {} }
async function deleteDisc(id) { if (!db) return; try { await db.from('candidatos_disc').delete().eq('id', id); } catch(e) {} }
async function arquivarForms(tabela, id, valor) { if (!db || !tabela) return; try { await db.from(tabela).update({ arquivada: valor }).eq('id', id); } catch(e) {} }
async function deleteForms(tabela, id) { if (!db || !tabela) return; try { await db.from(tabela).delete().eq('id', id); } catch(e) {} }

// ── HELPERS ──
function linesToArray(text) { return (text || '').split('\n').map(s => s.trim()).filter(Boolean); }
function arrayToLines(arr) { return (arr || []).join('\n'); }
function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cvUrls(cv) { return (cv || '').split('\n').map(s => s.trim()).filter(Boolean); }
function cvLinksHTML(cv) {
  const urls = cvUrls(cv);
  if (!urls.length) return '';
  const attr = u => u.replace(/'/g, "&#39;");
  if (urls.length === 1) return `<a href="#" class="cv-link" data-cv='${attr(urls[0])}'>Ver currículo</a>`;
  return urls.map((u, i) => `<a href="#" class="cv-link" data-cv='${attr(u)}'>Ver currículo ${i+1}</a>`).join(' · ');
}
// Delegação única pro clique em qualquer link de currículo, não importa em
// qual tela/render ele apareceu — evita ter que religar isso em cada função
// de render separadamente.
document.addEventListener('click', (e) => {
  const a = e.target.closest('.cv-link');
  if (!a) return;
  e.preventDefault();
  window.__abrirCurriculo(a.dataset.cv);
});

function openApplyModal(vaga) {
  let selectedFiles = [];
  // Vaga de motorista exige documentos além do currículo. O MOPP não é

  // texto pede os documentos sem travar o envio de quem tem tudo numa folha só.
  const ehMotorista = /motorista|carreteir|caminhon|entregador/i.test(vaga.title || '');
  const textoDocs = ehMotorista
    ? 'Currículo, CNH (categoria E) e MOPP · se o MOPP já estiver averbado na CNH, basta enviar a CNH'
    : 'Currículo, portfólio, carta...';
  modalRoot.innerHTML = `

      <div class="modal-box">
        <button class="modal-close" id="closeModal">×</button>

          <div class="form-group"><label class="fl">Nome completo *</label><input type="text" id="m-nome" placeholder="Seu nome completo" autocomplete="name"></div>
          <div class="form-row">

            <div class="form-group"><label class="fl">WhatsApp *</label><input type="tel" id="m-whatsapp" placeholder="(62) 9 0000-0000"></div>
          </div>

            <div class="file-drop" id="fileArea">
              <input type="file" id="m-file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" multiple>
              <label class="file-drop-label" for="m-file"><strong>Clique para selecionar</strong> ou arraste seus arquivos aqui<br><span style="font-size:0.72rem;">${textoDocs} · PDF, Word ou foto · máx. 10MB cada</span></label>
              <div class="file-name" id="fileName" style="display:none"></div>
            </div>
          </div>
          <div id="formError" style="display:none"></div>
          <button class="btn-primary" id="submitBtn" style="width:100%;" disabled>Enviar candidatura</button>
        </div>
      </div>
    </div>
  `;

  const nome = document.getElementById('m-nome'), email = document.getElementById('m-email'), whatsapp = document.getElementById('m-whatsapp');
  const fileInput = document.getElementById('m-file'), fileArea = document.getElementById('fileArea'), fileName = document.getElementById('fileName');
  const submitBtn = document.getElementById('submitBtn');

  function check() { submitBtn.disabled = !nome.value.trim() || !email.value.includes('@') || !whatsapp.value.trim() || !selectedFiles.length; }
  nome.addEventListener('input', check); email.addEventListener('input', check); whatsapp.addEventListener('input', check);

  function handleFiles(fileList) {
    const incoming = Array.from(fileList || []);
    if (!incoming.length) return;
    for (const f of incoming) {
      if (f.size > 5*1024*1024) { alert(`"${f.name}" é maior que 5MB e não foi adicionado.`); continue; }
      if (selectedFiles.length >= 5) { alert('Máximo de 5 arquivos.'); break; }
      if (!selectedFiles.some(x => x.name === f.name && x.size === f.size)) selectedFiles.push(f);
    }
    if (selectedFiles.length) {
      fileName.innerHTML = selectedFiles.map((f, i) => `<div>${esc(f.name)} <span data-rm="${i}" style="color:var(--err);cursor:pointer;">×</span></div>`).join('');
      fileName.style.display = 'block'; fileArea.classList.add('has-file');
      fileName.querySelectorAll('[data-rm]').forEach(x => x.addEventListener('click', ev => { ev.preventDefault(); ev.stopPropagation(); selectedFiles.splice(+x.dataset.rm, 1); handleFiles([]); if (!selectedFiles.length) { fileName.style.display='none'; fileArea.classList.remove('has-file'); } check(); }));
    }
    check();
  }
  fileInput.addEventListener('change', () => handleFiles(fileInput.files));
  fileArea.addEventListener('dragover', e => e.preventDefault());
  fileArea.addEventListener('drop', e => { e.preventDefault(); handleFiles(e.dataTransfer.files); });

  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

  submitBtn.addEventListener('click', async () => {
    submitBtn.disabled = true; submitBtn.innerHTML = '<span class="loading-spin"></span>Enviando...';
    document.getElementById('formError').style.display = 'none';
    const result = await saveCandidatura({ nome:nome.value.trim(), email:email.value.trim(), whatsapp:whatsapp.value.trim(), vaga_id:vaga.id, vaga_titulo:vaga.title, files:selectedFiles });
    if (result.ok) {
      const discParams = new URLSearchParams({ nome: nome.value.trim(), email: email.value.trim(), telefone: whatsapp.value.trim(), vaga: vaga.title });
      const discUrl = `https://lavieconsultoria.com/disc/?${discParams.toString()}`;
      document.getElementById('modalContent').innerHTML = `
        <div class="success-box"><h3>Candidatura recebida</h3><p>Sua candidatura para a vaga de <strong>${esc(vaga.title)}</strong> foi recebida.<br>Próximo passo: o Teste DISC, parte do nosso processo seletivo.</p></div>

      document.getElementById('formError').innerHTML = `<div class="error-box">Erro ao enviar: ${esc(result.err)}. Tente novamente.</div>`;
      document.getElementById('formError').style.display = 'block';
      submitBtn.disabled = false; submitBtn.innerHTML = 'Enviar candidatura';
    }
  });
}

async function buildDossiePDF(c) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const W = doc.internal.pageSize.getWidth();
  const M = 52;
  const INK = [58,58,58], SOFT = [122,119,110], BORDER = [216,207,196], OK = [74,122,66], PEND = [180,175,168];
  let y = 66;

  doc.setFont('times', 'italic'); doc.setFontSize(20); doc.setTextColor(...INK);
  doc.text('La Vie Consultoria', M, y);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...SOFT);
  doc.text('DOSSIÊ DO CANDIDATO · USO INTERNO', M, y + 13);
  doc.setDrawColor(...BORDER); doc.line(M, y + 24, W - M, y + 24);
  y += 46;

  doc.setFont('times', 'italic'); doc.setTextColor(...INK);
  const dossieNameSize = fitNameFontSize(doc, c.nome || '', W - M * 2, 26, 14);
  doc.setFontSize(dossieNameSize);
  doc.text(c.nome || '', M, y); y += dossieNameSize * 0.8;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...SOFT);
  doc.text(pdfSafe(`${c.email || ''} · ${c.whatsapp || ''}${c.vaga_titulo ? ' · ' + c.vaga_titulo : ''}`), M, y);
  y += 14;
  doc.setFontSize(8.5);
  doc.text('Dossiê gerado em ' + new Date().toLocaleDateString('pt-BR'), M, y);
  y += 36;

  doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...INK);
  doc.text('Etapas do processo seletivo', M, y);
  y += 20;

  function stageRow(label, done, detail) {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5);
    doc.setTextColor(...(done ? OK : PEND));
    doc.text(done ? 'CONCLUÍDO' : 'PENDENTE', M, y);
    doc.setFont('helvetica', 'normal'); doc.setTextColor(...INK);
    doc.text(label, M + 78, y);
    if (detail) {
      doc.setTextColor(...SOFT);
      doc.text(pdfSafe(detail), M + 78, y + 13);
      y += 13;
    }
    y += 24;
  }

  stageRow('Candidatura na vaga', !!c.candidatura, c.candidatura ? (c.candidatura.cv_url ? 'Currículo anexado — link disponível abaixo' : 'Sem currículo anexado') : null);
  stageRow('Teste comportamental DISC', !!c.disc, c.disc ? `Perfil predominante: ${DIM[c.disc.primary_profile]?.name || c.disc.primary_profile || '-'}` : null);
  stageRow('Formulário da vaga', !!c.forms, c.forms ? `Nota no questionário técnico: ${c.forms.technical_score ?? '-'} / 5` : null);

  if (c.candidatura?.cv_url) {
    y += 8;
    doc.setDrawColor(...BORDER); doc.line(M, y, W - M, y);
    y += 20;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...INK);
    const _urls = await Promise.all(cvUrls(c.candidatura.cv_url).map(_urlAssinadaParaPdf));
    doc.text(_urls.length > 1 ? 'Links dos currículos e anexos:' : 'Link do currículo:', M, y);
    y += 14;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(40, 80, 160);
    _urls.forEach(u => {
      const cvLines = doc.splitTextToSize(u, W - M * 2);
      doc.text(cvLines, M, y);
      doc.link(M, y - 8, doc.getTextWidth(cvLines[0] || ''), 12, { url: u });
      y += cvLines.length * 11 + 6;
    });
  }

  doc.setFontSize(8); doc.setTextColor(180,175,168);
  doc.text('La Vie Consultoria · lavieconsultoria.com · Documento de uso interno do processo seletivo.', M, 822);

  if (c.disc) {
    doc.addPage();
    _drawDiscBody(doc, c.disc);
  }
  if (c.forms) {
    doc.addPage();
    _drawFormsBody(doc, c.forms);
  }

  doc.save('dossie-' + (c.nome || 'candidato').toLowerCase().replace(/\s+/g,'-') + '.pdf');
}

// ── Utilidades de PDF: texto seguro (jsPDF não suporta check/cross/seta em unicode) e logo ──
function pdfSafe(s) {
  return (s || '')
    .replace(/→/g, '-')
    .replace(/✓/g, '')
    .replace(/✗/g, '');
}
function fitNameFontSize(doc, text, maxWidth, startSize, minSize) {
  let size = startSize;
  doc.setFont('times', 'italic');
  doc.setFontSize(size);
  while (size > minSize && doc.getTextWidth(text || '') > maxWidth) {
    size -= 1;
    doc.setFontSize(size);
  }
  return size;
}

function drawPdfHeader(doc, subtitle) {
  const W = doc.internal.pageSize.getWidth();
  const M = 52;
  const INK = [58,58,58], SOFT = [122,119,110], BORDER = [216,207,196];
  let y = 50;
  try { doc.addImage(LOGO_PDF_B64, 'PNG', M, y - 24, 30, 23.4); } catch(e) {}
  doc.setFont('times', 'italic'); doc.setFontSize(18); doc.setTextColor(...INK);
  doc.text('La Vie Consultoria', M + 40, y);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...SOFT);
  doc.text(pdfSafe(subtitle), M + 40, y + 13);
  doc.setDrawColor(...BORDER); doc.line(M, y + 24, W - M, y + 24);
  return y + 46;
}

// -- PDF: resultado do DISC (regenerado a partir dos dados salvos) --
function _drawDiscBody(doc, row) {
  const W = doc.internal.pageSize.getWidth();
  const M = 52;
  const INK = [58,58,58], SOFT = [122,119,110];
  let y = drawPdfHeader(doc, 'AVALIAÇÃO COMPORTAMENTAL DISC · RESUMO PARA O RECRUTADOR');

  const scores = row.most || {};
  const primary = row.primary_profile, secondary = row.secondary_profile;
  const vals = Object.values(scores);
  const minS = vals.length ? Math.min(...vals) : 0;
  const maxS = vals.length ? Math.max(...vals) : 0;
  const range = (maxS - minS) || 1;

  doc.setFont('times', 'italic'); doc.setTextColor(...INK);
  const discNameSize = fitNameFontSize(doc, pdfSafe(row.name), W - M * 2, 22, 13);
  doc.setFontSize(discNameSize);
  doc.text(pdfSafe(row.name), M, y);
  y += discNameSize * 0.75;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...SOFT);
  doc.text(pdfSafe(`${row.email || ''} · ${row.phone || ''} · ${new Date(row.created_at).toLocaleDateString('pt-BR')}`), M, y);
  y += 28;

  if (primary && DIM[primary]) {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(...INK);
    doc.text(`Perfil predominante: ${DIM[primary].name} (${primary})`, M, y);
    y += 16;
    if (secondary && DIM[secondary]) {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(...SOFT);
      doc.text(`Perfil secundário: ${DIM[secondary].name} (${secondary})`, M, y);
      y += 20;
    }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...INK);
    const sumLines = doc.splitTextToSize(pdfSafe(DIM[primary].summary), W - M * 2);
    doc.text(sumLines, M, y);
    y += sumLines.length * 13 + 20;
  }

  const barX = M + 120, barW = W - M - barX - 40;
  ['D','I','S','C'].forEach(d => {
    const score = scores[d];
    if (score === undefined) return;
    const pct = (score - minS) / range;
    const rgb = DIM[d].color.match(/\w\w/g).map(h => parseInt(h,16));
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...INK);
    doc.text(DIM[d].name, M, y + 8);
    doc.setFillColor(238,235,226); doc.roundedRect(barX, y, barW, 9, 2, 2, 'F');
    doc.setFillColor(...rgb); doc.roundedRect(barX, y, Math.max(barW * pct, 4), 9, 2, 2, 'F');
    doc.setFontSize(9); doc.setTextColor(...SOFT);
    doc.text((score > 0 ? '+' : '') + score, barX + barW + 8, y + 8);
    y += 24;
  });
  y += 12;

  if (primary && DIM[primary]) {
    const prof = DIM[primary];
    const bW = (W - M * 2 - 14) / 2;
    const boxH = 92;
    doc.setFillColor(245, 241, 234);
    doc.roundedRect(M, y, bW, boxH, 3, 3, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...INK);
    doc.text('PONTOS FORTES', M + 12, y + 16);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...SOFT);
    prof.strengths.forEach((s, i) => {
      const sLines = doc.splitTextToSize('- ' + pdfSafe(s), bW - 24);
      doc.text(sLines, M + 12, y + 30 + i * 15);
    });

    const b2X = M + bW + 14;
    doc.setFillColor(245, 241, 234);
    doc.roundedRect(b2X, y, bW, boxH, 3, 3, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(...INK);
    doc.text('PONTOS DE ATENÇÃO', b2X + 12, y + 16);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...SOFT);
    prof.challenges.forEach((s, i) => {
      const sLines = doc.splitTextToSize('- ' + pdfSafe(s), bW - 24);
      doc.text(sLines, b2X + 12, y + 30 + i * 15);
    });
    y += boxH + 18;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...INK);
    doc.text('O que motiva:', M, y);
    y += 13;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...SOFT);
    let motLines = doc.splitTextToSize(pdfSafe(prof.motivation), W - M * 2);
    doc.text(motLines, M, y);
    y += motLines.length * 12 + 12;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...INK);
    doc.text('Funções ideais:', M, y);
    y += 13;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...SOFT);
    let roleLines = doc.splitTextToSize(pdfSafe(prof.ideal_roles), W - M * 2);
    doc.text(roleLines, M, y);
  }

  doc.setFontSize(8); doc.setTextColor(180,175,168);
  doc.text('La Vie Consultoria · lavieconsultoria.com · Documento de uso interno do processo seletivo.', M, 822);
}

function buildDiscPDFFromRow(row) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  _drawDiscBody(doc, row);
  doc.save('disc-' + (row.name || 'candidato').toLowerCase().replace(/\s+/g,'-') + '.pdf');
}

// -- PDF: resposta do formulario da vaga --
function _drawFormsBody(doc, s) {
  const W = doc.internal.pageSize.getWidth();
  const M = 52;
  const INK = [58,58,58], SOFT = [122,119,110], OK = [74,122,66], ERR = [192,57,43];
  let y = drawPdfHeader(doc, 'FORMULÁRIO DA VAGA · RESUMO PARA O RECRUTADOR');

  function pageBreak(next) { if (y + next > 800) { doc.addPage(); y = 60; } }

  doc.setFont('times', 'italic'); doc.setTextColor(...INK);
  const formsNameSize = fitNameFontSize(doc, pdfSafe(s.nome), W - M * 2, 22, 13);
  doc.setFontSize(formsNameSize);
  doc.text(pdfSafe(s.nome), M, y);
  y += formsNameSize * 0.75;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...SOFT);
  doc.text(pdfSafe(`${s.email || ''} · ${s.whatsapp || ''} · ${new Date(s.created_at).toLocaleDateString('pt-BR')}`), M, y);
  y += 12;
  doc.text(pdfSafe(`Vaga: ${s.vaga_titulo || ''}`), M, y);
  y += 26;

  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(...INK);
  doc.text('Condições da vaga', M, y); y += 16;
  [['Contratação PJ', s.ciente_pj], ['Remuneração R$5.000 + comissão', s.ciente_remuneracao], ['Presencial em Goiânia/GO', s.ciente_presencial], ['Horário de funcionamento', s.ciente_horario]].forEach(([label, val]) => {
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
    doc.setTextColor(...(val ? OK : ERR));
    doc.text(val ? 'SIM' : 'NAO', M, y);
    doc.setFont('helvetica','normal'); doc.setTextColor(...INK);
    doc.text(label, M + 32, y);
    y += 15;
  });
  if (s.pretensao_salarial && s.pretensao_salarial.trim().length > 1) {
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...SOFT);
    doc.text(pdfSafe(`Pretensão salarial informada: ${s.pretensao_salarial}`), M, y); y += 15;
  }
  if (s.observacoes) {
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(...SOFT);
    const obsLines = doc.splitTextToSize(pdfSafe(`Observações: ${s.observacoes}`), W - M * 2);
    doc.text(obsLines, M, y); y += obsLines.length * 12 + 4;
  }
  y += 12;

  doc.setFont('helvetica','bold'); doc.setFontSize(10.5); doc.setTextColor(...INK);
  doc.text(`Questionário técnico: nota ${s.technical_score ?? '-'} / 5`, M, y);
  y += 18;

  (Array.isArray(s.technical_answers) ? s.technical_answers : []).forEach((a, i) => {
    pageBreak(50);
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(...INK);
    const qLines = doc.splitTextToSize(pdfSafe(`${i + 1}. ${a.pergunta}`), W - M * 2);
    doc.text(qLines, M, y); y += qLines.length * 11 + 3;
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.setTextColor(...(a.correta ? OK : ERR));
    const respLines = doc.splitTextToSize(pdfSafe(`Resposta: ${a.escolhida || '(não respondida)'} ${a.correta ? '(correta)' : '(incorreta)'}`), W - M * 2 - 10);
    doc.text(respLines, M + 10, y); y += respLines.length * 11 + 10;
  });

  doc.setFontSize(8); doc.setTextColor(180,175,168);
  doc.text('La Vie Consultoria · lavieconsultoria.com · Documento de uso interno do processo seletivo.', M, 822);
}

// ── Enviar DISC e Formulário para o sistema de R&S ───────────────────────────
// Gera os PDFs em memória, sobe para o storage e anexa ao registro do candidato.
function _slug(t) {
  return (t || 'candidato').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
}

async function enviarDocsParaRS(c, btn) {
  if (!rsDb || !db) { alert('Conexão com o sistema de R&S indisponível.'); return; }
  if (!c.disc && !c.forms) { alert('Este candidato ainda não tem DISC nem formulário.'); return; }

  const txtOriginal = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Enviando...'; }

  try {
    const emailNorm = (c.email || '').trim().toLowerCase();

    // Localiza o candidato no R&S primeiro — precisamos do ID dele pra saber
    // em qual pasta salvar os PDFs (o R&S guarda documentos em
    // "documentos/<id-do-candidato>/arquivo.pdf", e é lá que o próprio
    // sistema de R&S vai procurar quando alguém clicar pra abrir).
    const { data: achado, error: erroBusca } = await rsDb.rpc('buscar_candidato_por_email', { p_email: emailNorm });
    if (erroBusca) throw new Error(erroBusca.message);
    if (!achado?.encontrado) {
      alert('Candidato não encontrado no sistema de R&S pelo e-mail ' + emailNorm +
            '. Verifique se ele foi criado por lá antes de enviar os documentos.');
      return;
    }

    const { jsPDF } = window.jspdf;
    const carimbo = Date.now();
    const novos = [];

    if (c.disc) {
      const doc = new jsPDF({ unit: 'pt', format: 'a4' });
      _drawDiscBody(doc, c.disc);
      const path = `${achado.id}/${carimbo}-disc.pdf`;
      const { error: upErr } = await rsDb.storage.from('documentos').upload(path, doc.output('blob'), { contentType: 'application/pdf', upsert: true });
      if (upErr) throw new Error('Falha ao enviar o PDF do DISC: ' + upErr.message);
      novos.push({ nome: 'Relatório DISC', path, tipo: 'application/pdf',
        enviadoEm: new Date().toISOString(), enviadoPor: 'Painel do recrutador' });
    }

    if (c.forms) {
      const doc = new jsPDF({ unit: 'pt', format: 'a4' });
      _drawFormsBody(doc, c.forms);
      const path = `${achado.id}/${carimbo}-formulario.pdf`;
      const { error: upErr } = await rsDb.storage.from('documentos').upload(path, doc.output('blob'), { contentType: 'application/pdf', upsert: true });
      if (upErr) throw new Error('Falha ao enviar o PDF do formulário: ' + upErr.message);
      novos.push({ nome: 'Formulário da vaga', path, tipo: 'application/pdf',
        enviadoEm: new Date().toISOString(), enviadoPor: 'Painel do recrutador' });
    }

    // Anexa os documentos ao registro do candidato no R&S.
    const { data: resultado, error: erroRpc } = await rsDb.rpc('anexar_documentos_por_email', {
      p_email: emailNorm,
      p_novos_documentos: novos
    });
    if (erroRpc) throw new Error(erroRpc.message);

    if (!resultado?.encontrado) {
      alert('Candidato não encontrado no sistema de R&S pelo e-mail ' + emailNorm +
            '. Verifique se ele foi criado por lá antes de enviar os documentos.');
      return;
    }

    alert('Documentos enviados para o R&S: ' + novos.map(d => d.nome).join(' e ') +
          '.\nCandidato: ' + resultado.nome);
  } catch (e) {
    alert('Não foi possível enviar: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = txtOriginal; }
  }
}

function buildFormsPDFFromRow(s) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  _drawFormsBody(doc, s);
  doc.save('formulario-' + (s.nome || 'candidato').toLowerCase().replace(/\s+/g,'-') + '.pdf');
}

async function renderAdmin() {
  app.innerHTML = `<div class="admin-wrap"><p class="empty-note">Carregando painel...</p></div>`;
  ADMIN_VAGAS = await loadVagasAdmin();
  const candidaturas = await loadCandidaturas();
  const discRows = await loadCandidatosDisc();
  const formsRows = await loadFormsRespostas();
  if (state.view !== 'admin') return;

  const naoLidas = candidaturas.filter(c => !c.lida && !c.arquivada).length;
  const arquivadas = candidaturas.filter(c => c.arquivada).length;
  let mostrarArquivados = false;
  let filtroCand = 'todas';

  // ── cruzamento por e-mail para a aba "Candidatos" ──
  function normEmail(e) { return (e || '').trim().toLowerCase(); }
  const candidatosMap = new Map();
  candidaturas.forEach(c => {
    const key = normEmail(c.email);
    if (!key) return;
    if (!candidatosMap.has(key)) candidatosMap.set(key, { nome:c.nome, email:c.email, whatsapp:c.whatsapp, vaga_titulo:c.vaga_titulo, created_at:c.created_at, candidatura:c });
    else candidatosMap.get(key).candidatura = candidatosMap.get(key).candidatura || c;
  });
  discRows.forEach(d => {
    const key = normEmail(d.email);
    if (!key) return;
    if (!candidatosMap.has(key)) candidatosMap.set(key, { nome:d.name, email:d.email, whatsapp:d.phone, vaga_titulo:null, created_at:d.created_at, disc:d });
    else { const c = candidatosMap.get(key); c.disc = d; c.whatsapp = c.whatsapp || d.phone; }
  });
  formsRows.forEach(f => {
    const key = normEmail(f.email);
    if (!key) return;
    if (!candidatosMap.has(key)) candidatosMap.set(key, { nome:f.nome, email:f.email, whatsapp:f.whatsapp, vaga_titulo:f.vaga_titulo, created_at:f.created_at, forms:f });
    else { const c = candidatosMap.get(key); c.forms = f; c.whatsapp = c.whatsapp || f.whatsapp; c.vaga_titulo = c.vaga_titulo || f.vaga_titulo; }
  });
  const candidatosUnificados = [...candidatosMap.values()].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  // Um candidato é considerado arquivado quando a candidatura dele está arquivada.
  // Quando não há candidatura (só DISC e/ou formulário), usa o status de
  // arquivamento do DISC/formulário — o que existir.
  candidatosUnificados.forEach(c => {
    if (c.candidatura) c.arquivado = !!c.candidatura.arquivada;
    else c.arquivado = !!(c.disc?.arquivada || c.forms?.arquivada);
  });

  function vagasTabHTML() {
    return `
      <div class="admin-top"><h2 class="section-title" style="font-size:1.8rem;margin-bottom:0;">Vagas cadastradas</h2><button class="btn-primary" id="newVagaBtn">+ Nova vaga</button></div>
      ${ADMIN_VAGAS.length === 0 ? `<div class="empty-admin">Nenhuma vaga cadastrada ainda.<div><button class="btn-primary" id="newVagaBtnEmpty">+ Cadastrar primeira vaga</button></div></div>` :
        ADMIN_VAGAS.map(v => `
          <div class="entry-row">
            <div class="entry-info">
              <h4>${esc(v.title)} <span class="status-dot2 ${v.ativa ? 'on' : 'off'}"></span> <span style="font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;color:${v.ativa ? 'var(--ok)' : 'var(--muted)'};">${v.ativa ? 'Ativa' : 'Pausada'}</span></h4>
              <p>${esc(v.area)} · ${esc(v.local)} · ${esc(v.tipo)}</p>
            </div>
            <div class="entry-actions">
              <button class="edit-vaga" data-id="${v.id}">Editar</button>
              <button class="toggle-vaga" data-id="${v.id}" data-ativa="${v.ativa}">${v.ativa ? 'Pausar' : 'Ativar'}</button>
              <button class="danger del-vaga" data-id="${v.id}">Remover</button>
            </div>
          </div>
        `).join('')}
    `;
  }

  function candListHTML(filter) {
    // Arquivadas ficam fora de todos os filtros, exceto o filtro "Arquivadas".
    const ativas = candidaturas.filter(c => !c.arquivada);
    const lista = filter === 'arquivadas' ? candidaturas.filter(c => c.arquivada)
      : filter === 'todas' ? ativas
      : filter === 'novas' ? ativas.filter(c => !c.lida)
      : ativas.filter(c => c.vaga_id === filter);
    return lista.length === 0 ? '<p class="empty-note">Nenhuma candidatura encontrada.</p>' :
      lista.map(c => `
        <div class="entry-row">
          <div class="entry-info">
            <h4>${esc(c.nome)} ${!c.lida ? '<span class="new-dot"></span>' : ''}</h4>
            <p>${esc(c.email)} · ${esc(c.whatsapp) || '-'} · ${esc(c.vaga_titulo)} · ${new Date(c.created_at).toLocaleDateString('pt-BR')}</p>
          </div>
          <div class="entry-actions">
            ${c.cv_url ? cvLinksHTML(c.cv_url) : '<span style="font-size:0.7rem;color:var(--muted);padding:0.4rem 0.7rem;">Sem currículo</span>'}
            ${!c.lida && !c.arquivada ? `<button class="mark-read" data-id="${c.id}">Marcar lida</button>` : ''}
            <button class="arq-cand" data-id="${c.id}" data-arq="${c.arquivada ? '1' : '0'}">${c.arquivada ? 'Desarquivar' : 'Arquivar'}</button>
            <button class="danger del-cand" data-id="${c.id}">Remover</button>
          </div>
        </div>
      `).join('');
  }

  function candTabHTML() {
    return `
      <div class="admin-top"><h2 class="section-title" style="font-size:1.8rem;margin-bottom:0;">Candidaturas recebidas</h2></div>
      <div class="stat-row">
        <div><div class="stat-num">${candidaturas.filter(c => !c.arquivada).length}</div><div class="stat-label">Ativas</div></div>
        <div><div class="stat-num ok">${naoLidas}</div><div class="stat-label">Não lidas</div></div>
        <div><div class="stat-num">${arquivadas}</div><div class="stat-label">Arquivadas</div></div>
      </div>
      <div class="filter-row2">
        <button class="filter-chip2 ${filtroCand==='todas'?'active':''}" data-filter="todas">Todas</button>
        <button class="filter-chip2 ${filtroCand==='novas'?'active':''}" data-filter="novas">Não lidas (${naoLidas})</button>
        ${ADMIN_VAGAS.map(v => `<button class="filter-chip2 ${filtroCand===v.id?'active':''}" data-filter="${v.id}">${esc(v.title)}</button>`).join('')}
        <button class="filter-chip2 ${filtroCand==='arquivadas'?'active':''}" data-filter="arquivadas">Arquivadas (${arquivadas})</button>
      </div>
      <div id="candList">${candListHTML(filtroCand)}</div>
    `;
  }

  function unifTabHTML() {
    if (candidatosUnificados.length === 0) {
      return `
        <div class="admin-top"><h2 class="section-title" style="font-size:1.8rem;margin-bottom:0;">Candidatos</h2></div>
        <p class="empty-note">Nenhum candidato encontrado ainda em nenhuma das etapas.</p>
      `;
    }
    const listaUnif = mostrarArquivados ? candidatosUnificados.filter(c => c.arquivado) : candidatosUnificados.filter(c => !c.arquivado);
    const qtdArquivados = candidatosUnificados.filter(c => c.arquivado).length;
    return `
      <div class="admin-top"><h2 class="section-title" style="font-size:1.8rem;margin-bottom:0;">Candidatos</h2></div>
      <p style="color:var(--muted);font-size:0.82rem;margin-bottom:1rem;">Cruza automaticamente currículo, resultado do DISC e formulário da vaga pelo e-mail informado em cada etapa.</p>
      <div class="filter-row2" style="margin-bottom:1.4rem;">
        <button class="filter-chip2 ${!mostrarArquivados?'active':''}" id="unifAtivos">Em análise (${candidatosUnificados.length - qtdArquivados})</button>
        <button class="filter-chip2 ${mostrarArquivados?'active':''}" id="unifArquivados">Arquivados (${qtdArquivados})</button>
      </div>
      ${listaUnif.length === 0 ? `<p class="empty-note">${mostrarArquivados ? 'Nenhum candidato arquivado.' : 'Nenhum candidato em análise.'}</p>` : ''}
      ${listaUnif.map((c, idx) => `
        <div class="cand-row" data-idx="${candidatosUnificados.indexOf(c)}">
          <div class="cand-top">
            <div>
              <h4>${esc(c.nome)}</h4>
              <p>${esc(c.email)} · ${esc(c.whatsapp) || '-'} ${c.vaga_titulo ? '· ' + esc(c.vaga_titulo) : ''}</p>
            </div>
            <button class="dossie-btn" data-idx="${candidatosUnificados.indexOf(c)}">Ver Dossiê →</button>
            ${c.candidatura ? `<button class="action-btn arq-unif" data-id="${c.candidatura.id}" data-arq="${c.arquivado ? '1' : '0'}" style="margin-left:0.5rem;">${c.arquivado ? 'Desarquivar' : 'Arquivar'}</button>` : `
              <button class="action-btn arq-sem-cand" data-idx="${candidatosUnificados.indexOf(c)}" data-arq="${c.arquivado ? '1' : '0'}" style="margin-left:0.5rem;">${c.arquivado ? 'Desarquivar' : 'Arquivar'}</button>
              <button class="action-btn danger-outline del-sem-cand" data-idx="${candidatosUnificados.indexOf(c)}" style="margin-left:0.5rem;">Remover</button>
            `}
          </div>
          <div class="cand-stages">
            <div class="stage-chip ${c.candidatura ? 'done' : 'pending'}">${c.candidatura ? '📄 Currículo recebido' : '📄 Ainda não se candidatou'}</div>
            <div class="stage-chip ${c.disc ? 'done' : 'pending'}">${c.disc ? `🧭 DISC: ${DIM[c.disc.primary_profile]?.name || c.disc.primary_profile || '-'}` : '🧭 Ainda não fez o DISC'}</div>
            <div class="stage-chip ${c.forms ? 'done' : 'pending'}">${c.forms ? `📝 Formulário: ${c.forms.technical_score ?? '-'}/5` : '📝 Ainda não respondeu o formulário'}</div>
          </div>
        </div>
      `).join('')}
    `;
  }

  function bindVagasTabEvents() {
    const openNew = () => openVagaForm(null, () => draw());
    document.getElementById('newVagaBtn')?.addEventListener('click', openNew);
    document.getElementById('newVagaBtnEmpty')?.addEventListener('click', openNew);
    document.querySelectorAll('.edit-vaga').forEach(btn => btn.addEventListener('click', () => openVagaForm(ADMIN_VAGAS.find(v => v.id === btn.dataset.id), () => draw())));
    document.querySelectorAll('.toggle-vaga').forEach(btn => btn.addEventListener('click', async () => {
      btn.disabled = true;
      const r = await setVagaAtiva(btn.dataset.id, btn.dataset.ativa !== 'true');
      if (!r.ok) { alert('Não foi possível alterar o status da vaga: ' + (r.err || 'erro desconhecido') + '\n\nIsso geralmente indica uma política de RLS na tabela "vagas" bloqueando UPDATE para o usuário logado.'); btn.disabled = false; return; }
      await draw();
    }));
    document.querySelectorAll('.del-vaga').forEach(btn => btn.addEventListener('click', async () => { if (!confirm('Remover esta vaga permanentemente? As candidaturas já recebidas continuam no histórico.')) return; await deleteVaga(btn.dataset.id); await draw(); }));
  }
  function bindCandTabEvents() {
    document.querySelectorAll('.filter-chip2').forEach(btn => btn.addEventListener('click', () => { filtroCand = btn.dataset.filter; draw(); }));
    document.querySelectorAll('.mark-read').forEach(btn => btn.addEventListener('click', async () => { await marcarLida(btn.dataset.id); const c = candidaturas.find(x => x.id === btn.dataset.id); if (c) c.lida = true; draw(); }));
    document.querySelectorAll('.del-cand').forEach(btn => btn.addEventListener('click', async () => { if (!confirm('Remover esta candidatura?')) return; await deleteCandidatura(btn.dataset.id); candidaturas.splice(candidaturas.findIndex(x => x.id === btn.dataset.id), 1); draw(); }));
    document.querySelectorAll('.arq-cand').forEach(btn => btn.addEventListener('click', async () => {
      const novoValor = btn.dataset.arq !== '1';
      await arquivarCandidatura(btn.dataset.id, novoValor);
      const c = candidaturas.find(x => x.id === btn.dataset.id);
      if (c) { c.arquivada = novoValor; if (novoValor) c.lida = true; }
      draw();
    }));
  }
  function bindUnifTabEvents() {
    document.querySelectorAll('.dossie-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); openDossieModal(candidatosUnificados[btn.dataset.idx]); }));
    document.querySelectorAll('.arq-unif').forEach(btn => btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const novoValor = btn.dataset.arq !== '1';
      await arquivarCandidatura(btn.dataset.id, novoValor);
      const cand = candidaturas.find(x => x.id === btn.dataset.id);
      if (cand) { cand.arquivada = novoValor; if (novoValor) cand.lida = true; }
      const unif = candidatosUnificados.find(c => c.candidatura && c.candidatura.id === btn.dataset.id);
      if (unif) { unif.arquivado = novoValor; if (unif.candidatura) unif.candidatura.arquivada = novoValor; }
      draw();
    }));
    // Arquivar/desarquivar candidato sem candidatura (só tem DISC e/ou
    // formulário) — mexe direto nas tabelas candidatos_disc / forms_*.
    document.querySelectorAll('.arq-sem-cand').forEach(btn => btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const novoValor = btn.dataset.arq !== '1';
      const c = candidatosUnificados[btn.dataset.idx];
      if (!c) return;
      if (c.disc) await arquivarDisc(c.disc.id, novoValor);
      if (c.forms) await arquivarForms(c.forms._tabela, c.forms.id, novoValor);
      if (c.disc) c.disc.arquivada = novoValor;
      if (c.forms) c.forms.arquivada = novoValor;
      c.arquivado = novoValor;
      draw();
    }));
    // Remover candidato sem candidatura — exclui o DISC e/ou formulário dele.
    document.querySelectorAll('.del-sem-cand').forEach(btn => btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Remover este candidato? O DISC e/ou formulário respondidos serão apagados permanentemente.')) return;
      const c = candidatosUnificados[btn.dataset.idx];
      if (!c) return;
      if (c.disc) await deleteDisc(c.disc.id);
      if (c.forms) await deleteForms(c.forms._tabela, c.forms.id);
      candidatosUnificados.splice(candidatosUnificados.indexOf(c), 1);
      draw();
    }));
    document.getElementById('unifAtivos')?.addEventListener('click', () => { mostrarArquivados = false; draw(); });
    document.getElementById('unifArquivados')?.addEventListener('click', () => { mostrarArquivados = true; draw(); });
    document.querySelectorAll('.cand-row').forEach(row => row.addEventListener('click', () => openDossieModal(candidatosUnificados[row.dataset.idx])));
  }

  async function draw() {
    ADMIN_VAGAS = await loadVagasAdmin();
    if (state.view !== 'admin') return;
    app.innerHTML = `
      <div class="admin-wrap">
        <button class="back-link" id="backBtn">← Voltar às vagas</button>
        <span class="eyebrow">Painel do recrutador</span>
        <button class="back-link" id="logoutBtn" style="float:right">Sair</button>
        <div class="admin-tabs">
          <button class="tab-btn2 ${state.adminTab==='vagas'?'active':''}" data-tab="vagas">Vagas (${ADMIN_VAGAS.length})</button>
          <button class="tab-btn2 ${state.adminTab==='candidaturas'?'active':''}" data-tab="candidaturas">Candidaturas ${naoLidas>0?`(${naoLidas} novas)`:''}</button>
          <button class="tab-btn2 ${state.adminTab==='candidatos'?'active':''}" data-tab="candidatos">Candidatos (${candidatosUnificados.length})</button>
        </div>
        <div id="tabContent">${state.adminTab === 'vagas' ? vagasTabHTML() : state.adminTab === 'candidaturas' ? candTabHTML() : unifTabHTML()}</div>
      </div>
    `;
    document.getElementById('backBtn').addEventListener('click', () => { state.view = 'vagas'; render(); });
    document.getElementById('logoutBtn').addEventListener('click', fazerLogoutPainel);
    document.querySelectorAll('.tab-btn2').forEach(btn => btn.addEventListener('click', () => { state.adminTab = btn.dataset.tab; draw(); }));
    if (state.adminTab === 'vagas') bindVagasTabEvents();
    else if (state.adminTab === 'candidaturas') bindCandTabEvents();
    else bindUnifTabEvents();
  }
  draw();
}

// projeto deste site (db) e no projeto do R&S (rsDb) — sem isso, o painel
// não consegue ler currículos nem enviar documentos pro R&S, porque os dois
// bancos agora exigem login de verdade pra qualquer leitura de dado pessoal.
function openLoginModal() {
  modalRoot.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal-box">
        <button class="modal-close" id="closeModal">×</button>
        <h3>Entrar no painel</h3>
        <p class="modal-sub">Use o mesmo e-mail e senha da sua conta.</p>
        <input type="email" id="loginEmail" placeholder="seu-email@exemplo.com" autocomplete="username"
          style="width:100%;padding:0.7rem 0.9rem;margin-bottom:0.6rem;border:1px solid var(--border,#d8cfc4);border-radius:8px;font-size:0.85rem;box-sizing:border-box;">
        <input type="password" id="loginSenha" placeholder="Senha" autocomplete="current-password"
          style="width:100%;padding:0.7rem 0.9rem;margin-bottom:0.6rem;border:1px solid var(--border,#d8cfc4);border-radius:8px;font-size:0.85rem;box-sizing:border-box;">
        <p id="loginErro" style="color:#a33;font-size:0.75rem;display:none;margin-bottom:0.6rem;"></p>
        <button class="btn-primary" id="loginSubmit" style="width:100%;">Entrar</button>
      </div>
    </div>
  `;
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
  document.getElementById('loginSubmit').addEventListener('click', fazerLoginPainel);
  document.getElementById('loginSenha').addEventListener('keydown', e => { if (e.key === 'Enter') fazerLoginPainel(); });
}

async function fazerLoginPainel() {
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const erroEl = document.getElementById('loginErro');
  erroEl.style.display = 'none';
  if (!email || !senha) { erroEl.textContent = 'Preencha e-mail e senha.'; erroEl.style.display = 'block'; return; }
  const btn = document.getElementById('loginSubmit');
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    if (!db || !rsDb) throw new Error('Conexão com os bancos indisponível.');
    // Precisa entrar nos DOIS projetos — cada um com sua própria sessão,
    // porque são bancos Supabase diferentes (não compartilham login entre si).
    const [r1, r2] = await Promise.all([
      db.auth.signInWithPassword({ email, password: senha }),
      rsDb.auth.signInWithPassword({ email, password: senha })
    ]);
    if (r1.error || r2.error) {
      throw new Error('E-mail ou senha incorretos, ou a conta ainda não existe em um dos dois sistemas.');
    }
    closeModal();
    state.view = 'admin'; state.adminTab = 'vagas'; render();
  } catch (e) {
    erroEl.textContent = e.message; erroEl.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

async function fazerLogoutPainel() {
  try { await Promise.all([db?.auth.signOut(), rsDb?.auth.signOut()]); } catch(e) {}
  state.view = 'vagas'; render();
}

// Se já existir uma sessão válida nos dois bancos (usuário já logado antes,
// aba recarregada), pula direto pro painel sem pedir login de novo.
async function sessaoValidaNosDois() {
  if (!db || !rsDb) return false;
  try {
    const [s1, s2] = await Promise.all([db.auth.getSession(), rsDb.auth.getSession()]);
    return !!(s1?.data?.session && s2?.data?.session);
  } catch(e) { return false; }
}

// ── ROUTER ──
function render() {
  adminBtn.textContent = state.view === 'admin' ? 'Voltar às vagas' : 'Painel do recrutador';
  if (state.view === 'vagas') renderVagas();
  else if (state.view === 'admin') renderAdmin();
}

adminBtn.addEventListener('click', async () => {
  if (state.view === 'admin') { state.view = 'vagas'; render(); return; }
  if (await sessaoValidaNosDois()) { state.view = 'admin'; state.adminTab = 'vagas'; render(); return; }
  openLoginModal();
});

(async () => {
  if (await sessaoValidaNosDois()) { state.view = 'admin'; state.adminTab = 'vagas'; }
  render();
})();
})();
</script>
</body>
</html>
