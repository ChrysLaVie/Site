<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#3A3A3A;font-family:'DM Sans',system-ui,sans-serif;color:#F2F1ED}
.tela{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.caixa{width:100%;max-width:380px;text-align:center}
.caixa img{width:96px;height:96px;object-fit:contain;margin-bottom:10px}
.eye{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#B8AFA4}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:38px;line-height:1.05;margin:10px 0 6px}
h1 em{font-style:italic;color:#D8CFC4}
p.sub{font-size:13px;color:#B8AFA4;margin:0 0 26px;line-height:1.5}
input{width:100%;font:inherit;font-size:14px;padding:12px 14px;margin-bottom:10px;border-radius:4px;border:1px solid #57524b;background:#2f2f2f;color:#F2F1ED}
input:focus{outline:1px solid #D8CFC4;border-color:#D8CFC4}
button{width:100%;font:inherit;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;padding:13px;border:0;border-radius:2px;background:#F2F1ED;color:#3A3A3A;cursor:pointer;margin-top:4px}
button:disabled{opacity:.6;cursor:wait}
.erro{min-height:18px;font-size:12px;color:#E3A99D;margin:6px 0}
.rod{margin-top:22px;font-size:12px;color:#8f877c}.rod a{color:#D8CFC4}
</style>
