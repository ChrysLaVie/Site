<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>Mapa Astral</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Área reservada de mapas astrais.">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Hanken+Grotesk:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Noto+Sans+Symbols:wght@400;500&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
<style>
[hidden]{display:none !important}
/* Layout: carta marítima noturna. Coluna de leitura de 700px, com faixas largas (roda, aspectário, anos) que abrem para 1080px. */
:root{
  --abyss:#06161D;      /* fundo, mar à noite */
  --deep:#0B2430;       /* superfícies */
  --deep-2:#103140;
  --line:rgba(176,214,208,.16);
  --line-2:rgba(176,214,208,.32);
  --pearl:#ECE7DA;      /* texto principal */
  --mist:#A9BDBA;       /* texto secundário */
  --faint:#6E8A89;      /* legendas */
  --tide:#86CFC2;       /* harmonia, acento */
  --coral:#E8896C;      /* tensão */
  --moon:#CFC6EE;       /* conjunção, Lua */
  --sand:#D9C08F;       /* glifos, destaque raro */
  --el-fire:rgba(232,137,108,.10);
  --el-earth:rgba(217,192,143,.09);
  --el-air:rgba(207,198,238,.08);
  --el-water:rgba(134,207,194,.11);
  --display:'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --body:'Hanken Grotesk', 'Segoe UI', system-ui, sans-serif;
  --mono:'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --sym:'Noto Sans Symbols', 'Noto Sans Symbols 2', 'Segoe UI Symbol', 'Apple Symbols', sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--abyss); color:var(--pearl);
  font-family:var(--body); font-size:16px; line-height:1.65; font-weight:400;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse 90% 60% at 80% -10%, rgba(134,207,194,.10), transparent 60%),
    radial-gradient(ellipse 70% 50% at 0% 30%, rgba(207,198,238,.06), transparent 60%);
  background-attachment:fixed;
}
#sky{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0}
main{position:relative; z-index:1}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.col{max-width:700px; margin:0 auto}
.wide{max-width:1080px; margin:0 auto}
section{padding-block:88px}
h1,h2,h3{font-family:var(--display); font-weight:400; margin:0; text-wrap:balance; letter-spacing:-.005em}
h2{font-size:clamp(2rem, 4.6vw, 2.9rem); line-height:1.08}
h3{font-size:1.55rem; line-height:1.2}
p{margin:0; color:var(--mist)}
p + p{margin-top:.9em}
em{font-style:italic}
.eyebrow{font-family:var(--mono); font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--tide)}
.sym{font-family:var(--sym); font-variant-emoji:text}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.rule{height:1px; background:linear-gradient(90deg, transparent, var(--line-2), transparent); max-width:1080px; margin:0 auto}
.s-head{display:grid; gap:14px; margin-bottom:44px}
.s-head p{max-width:58ch}
:focus-visible{outline:2px solid var(--tide); outline-offset:3px; border-radius:2px}

/* ---------- hero ---------- */
.hero{padding-block:72px 64px}
.hero-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:56px; align-items:center}
.hero h1{font-size:clamp(2.6rem, 6.4vw, 4.6rem); line-height:1; margin-top:18px}
.hero h1 i{font-style:italic; color:var(--tide)}
.hero .lede{margin-top:22px; font-size:1.06rem; max-width:44ch}
.birth{margin-top:30px; display:grid; grid-template-columns:auto 1fr; gap:6px 18px; font-size:.9rem; max-width:420px}
.birth dt{font-family:var(--mono); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); padding-top:3px}
.birth dd{margin:0; color:var(--pearl)}
.trio{margin-top:36px; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); border-top:1px solid var(--line-2); border-bottom:1px solid var(--line-2)}
.trio > div{padding:18px 14px 16px; display:grid; gap:2px}
.trio > div + div{border-left:1px solid var(--line)}
.trio .g{font-family:var(--sym); font-size:1.5rem; color:var(--sand); line-height:1.2}
.trio .r{font-family:var(--mono); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
.trio .s{font-family:var(--display); font-size:1.45rem; line-height:1.2}
.trio .d{font-family:var(--mono); font-size:.76rem; color:var(--mist)}
.lunation{margin-top:18px; display:flex; gap:12px; align-items:center; font-size:.86rem; color:var(--mist)}
.lunation svg{flex:none}

/* ---------- roda ---------- */
.wheel-box{position:relative}
.wheel{width:100%; max-width:100%; height:auto; display:block; aspect-ratio:1/1}
.wheel text{user-select:none}
.wheel .pl{cursor:pointer}
.wheel .pl:focus{outline:none}
.wheel .pl:focus-visible .halo, .wheel .pl.on .halo{opacity:1}
.wheel .halo{opacity:0; transition:opacity .2s}
.wheel .asp{transition:opacity .25s}
.wheel.sel .asp{opacity:.07}
.wheel.sel .asp.on{opacity:1}
.wheel.sel .pl{opacity:.45}
.wheel.sel .pl.on, .wheel.sel .pl.rel{opacity:1}
.wheel-note{margin-top:10px; font-size:.8rem; color:var(--faint); text-align:center}
.legend{display:flex; flex-wrap:wrap; gap:8px 18px; justify-content:center; margin-top:8px; font-size:.78rem; color:var(--mist)}
.legend span{display:inline-flex; align-items:center; gap:7px}
.legend i{display:inline-block; width:18px; height:2px}

/* ---------- ficha do planeta ---------- */
.explorer{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:48px; align-items:start}
.card{border:1px solid var(--line-2); background:linear-gradient(170deg, rgba(16,49,64,.75), rgba(11,36,48,.55)); padding:28px 26px; position:sticky; top:calc(env(safe-area-inset-top, 0px) + 20px)}
.card .top{display:flex; gap:16px; align-items:center}
.card .big{font-family:var(--sym); font-size:2.6rem; color:var(--sand); line-height:1; width:52px; text-align:center}
.card h3{font-size:1.7rem}
.card .pos{font-family:var(--mono); font-size:.8rem; color:var(--tide); margin-top:2px}
.card p.txt{margin-top:18px; font-size:.97rem}
.card ul{list-style:none; margin:20px 0 0; padding:16px 0 0; border-top:1px solid var(--line); display:grid; gap:8px}
.card li{display:grid; grid-template-columns:22px 1fr auto; gap:10px; align-items:baseline; font-size:.88rem; color:var(--pearl)}
.card li .ag{font-family:var(--sym)}
.card li .o{font-family:var(--mono); font-size:.74rem; color:var(--faint)}
.card .empty{font-size:.88rem; color:var(--faint)}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:18px}
.chip{appearance:none; border:1px solid var(--line-2); background:transparent; color:var(--mist); font:inherit; font-size:.8rem; padding:5px 10px 5px 8px; border-radius:999px; cursor:pointer; display:inline-flex; gap:6px; align-items:center}
.chip .sym{color:var(--sand); font-size:.95rem}
.chip[aria-pressed="true"]{border-color:var(--tide); color:var(--pearl); background:rgba(134,207,194,.10)}

/* ---------- portas ---------- */
.portal{display:grid; grid-template-columns:96px minmax(0,1fr); gap:26px; padding:30px 0; border-top:1px solid var(--line)}
.portal:last-child{border-bottom:1px solid var(--line)}
.portal .gc{display:grid; justify-items:center; align-content:start; gap:8px; padding-top:4px}
.portal .gc .g{font-family:var(--sym); font-size:2.3rem; color:var(--sand); line-height:1}
.portal .gc .l{font-family:var(--mono); font-size:.62rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); text-align:center}
.portal h3 span{font-style:italic; color:var(--tide)}
.portal .meta{font-family:var(--mono); font-size:.76rem; color:var(--faint); margin-top:4px}
.portal p{margin-top:12px}

/* ---------- tabela ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:.92rem}
th{font-family:var(--mono); font-weight:400; font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); text-align:left; padding:0 10px 12px; border-bottom:1px solid var(--line-2)}
td{padding:12px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
td.g{font-family:var(--sym); color:var(--sand); font-size:1.15rem; width:34px; text-align:center}
td.n{color:var(--pearl)}
td.sg{color:var(--mist); white-space:nowrap}
td.sg .sym{color:var(--faint); margin-right:6px}
td.dg, td.hs{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--mist); white-space:nowrap}
td.ob{font-size:.8rem; color:var(--faint)}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(134,207,194,.04)}
.tag{display:inline-block; font-family:var(--mono); font-size:.64rem; letter-spacing:.06em; padding:2px 7px; border:1px solid var(--line-2); border-radius:999px; color:var(--mist); margin-left:6px; vertical-align:1px}
.tag.r{color:var(--coral); border-color:rgba(232,137,108,.4)}

/* ---------- equilíbrio ---------- */
.balance{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:40px; margin-top:56px}
.balance h4{margin:0 0 14px; font-family:var(--mono); font-weight:400; font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint)}
.bar{display:grid; grid-template-columns:72px 1fr 22px; gap:10px; align-items:center; font-size:.85rem; color:var(--mist); padding:5px 0}
.bar .t{height:6px; background:rgba(176,214,208,.08); position:relative}
.bar .t b{position:absolute; inset:0 auto 0 0; background:var(--tide)}
.bar .t b.hi{background:var(--sand)}
.bar .c{font-family:var(--mono); text-align:right; color:var(--pearl)}
.balance p{font-size:.86rem; margin-top:12px}

/* ---------- aspectário ---------- */
.aspgrid-wrap{overflow-x:auto; padding-bottom:6px}
.aspgrid{border-collapse:separate; border-spacing:2px; margin:0 auto; font-size:.9rem}
.aspgrid td, .aspgrid th{width:44px; height:44px; min-width:44px; padding:0; text-align:center; border:none}
.aspgrid th{font-family:var(--sym); font-size:1.1rem; color:var(--sand); letter-spacing:0; text-transform:none}
.aspgrid th.lbl{font-family:var(--mono); font-size:.7rem; color:var(--sand)}
.aspgrid td.cell{background:rgba(176,214,208,.035)}
.aspgrid td.cell.has{cursor:pointer}
.aspgrid td.cell.has:hover, .aspgrid td.cell.on{background:rgba(134,207,194,.14)}
.aspgrid td.diag{font-family:var(--sym); color:var(--sand); font-size:1.15rem; background:transparent}
.aspgrid .ag{font-family:var(--sym); font-size:1.15rem; display:block; line-height:1}
.aspgrid .ao{font-family:var(--mono); font-size:.6rem; color:var(--faint); display:block; margin-top:2px}
.h{color:var(--tide)} .t{color:var(--coral)} .c{color:var(--moon)}
.asp-read{max-width:700px; margin:26px auto 0; min-height:5.2em; border-left:2px solid var(--line-2); padding:4px 0 4px 18px}
.asp-read b{font-weight:500; color:var(--pearl)}

/* ---------- talentos / desafios ---------- */
.two{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:56px}
.pill{display:inline-block; font-family:var(--mono); font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; padding:6px 14px; border-radius:999px; border:1px solid}
.pill.h{border-color:rgba(134,207,194,.45)}
.pill.t{border-color:rgba(232,137,108,.45)}
.list h3{margin-top:16px}
.list > p{margin-top:12px; font-size:.95rem}
.item{display:grid; grid-template-columns:24px minmax(0,1fr); gap:14px; padding:22px 0; border-top:1px solid var(--line)}
.item:last-child{border-bottom:1px solid var(--line)}
.item .mk{font-family:var(--sym); font-size:1.1rem; padding-top:2px}
.item h4{margin:0; font-weight:600; font-size:1rem; color:var(--pearl); line-height:1.4}
.item .at{display:block; font-family:var(--mono); font-weight:400; font-size:.72rem; color:var(--faint); margin-top:3px}
.item p{margin-top:8px; font-size:.94rem}

/* ---------- tema central ---------- */
.callout{border:1px solid var(--line-2); padding:44px 40px; position:relative; overflow:hidden;
  background:radial-gradient(ellipse 80% 90% at 100% 0%, rgba(134,207,194,.10), transparent 70%), linear-gradient(160deg, rgba(16,49,64,.8), rgba(6,22,29,.6))}
.callout h3{font-size:clamp(1.8rem, 4vw, 2.4rem); margin:14px 0 18px}
.callout .glyphs{display:flex; gap:18px; margin-top:26px; font-family:var(--sym); font-size:1.5rem; color:var(--sand)}
.callout .wm{position:absolute; right:-20px; bottom:-60px; font-family:var(--sym); font-size:15rem; line-height:1; color:rgba(134,207,194,.05); pointer-events:none}

/* ---------- revoluções ---------- */
.year{padding-block:72px}
.year-head{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-bottom:18px}
.ytag{font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; padding:5px 12px; border:1px solid var(--line-2); border-radius:999px; color:var(--pearl)}
.now{font-family:var(--mono); font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; padding:5px 11px; border-radius:999px; background:var(--tide); color:var(--abyss); font-weight:500}
.year h2{font-size:clamp(1.9rem, 4.2vw, 2.6rem)}
.year .intro{margin-top:18px; max-width:62ch; font-size:1rem}
.year-grid{display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:48px; margin-top:40px; align-items:start}
.year-grid .wheel{max-width:440px; margin:0 auto}
.mini td{padding:9px 8px; font-size:.86rem}
.sub{font-family:var(--mono); font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; margin:40px 0 4px}
.mini-item{display:grid; grid-template-columns:20px minmax(0,1fr); gap:12px; padding:16px 0; border-top:1px solid var(--line)}
.mini-item:last-child{border-bottom:1px solid var(--line)}
.mini-item .mk{font-family:var(--sym); padding-top:1px}
.mini-item h5{margin:0; font-weight:600; font-size:.92rem; color:var(--pearl)}
.mini-item p{font-size:.9rem; margin-top:3px}
.cols2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0 48px}

/* ---------- nota ---------- */
.notes{font-size:.86rem}
.notes dl{display:grid; grid-template-columns:170px minmax(0,1fr); gap:12px 24px; margin:0}
.notes dt{font-family:var(--mono); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); padding-top:3px}
.notes dd{margin:0; color:var(--mist)}
footer{text-align:center; padding-block:40px 64px; font-family:var(--mono); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); line-height:2.2}

@media (max-width:900px){
  .hero-grid, .explorer, .year-grid, .two{grid-template-columns:minmax(0,1fr)}
  .hero-grid{gap:40px}
  .card{position:static}
  .balance{grid-template-columns:minmax(0,1fr); gap:32px}
}
@media (max-width:600px){
  section{padding-block:64px}
  .portal{grid-template-columns:52px minmax(0,1fr); gap:14px}
  .portal .gc .g{font-size:1.8rem}
  .trio .s{font-size:1.2rem}
  .trio > div{padding:14px 8px}
  .callout{padding:32px 22px}
  .cols2{grid-template-columns:minmax(0,1fr)}
  .notes dl{grid-template-columns:minmax(0,1fr); gap:4px}
  .notes dd{margin-bottom:12px}
  .aspgrid td, .aspgrid th{width:34px; height:36px; min-width:34px}
  .aspgrid .ao{display:none}
  td.ob{display:none}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
  html{scroll-behavior:auto}
}
</style>


</head>
<body>

<style>
.gate{min-height:100vh; display:grid; place-items:center; padding-block:48px}
.gate-box{width:100%; max-width:410px; border:1px solid var(--line-2); padding:42px 32px 34px;
  background:linear-gradient(170deg, rgba(16,49,64,.82), rgba(6,22,29,.68)); display:grid; gap:12px}
.gate-box .sym{font-size:2.4rem; color:var(--sand); line-height:1}
.gate-box h1{font-size:2.3rem; line-height:1.05}
.gate-box p{font-size:.94rem; margin-bottom:6px}
.gate-box label{font-family:var(--mono); font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin-top:8px}
.gate-box input{width:100%; font:inherit; font-size:1rem; color:var(--pearl); background:rgba(6,22,29,.7); border:1px solid var(--line-2); padding:12px 14px; border-radius:2px}
.gate-box input:focus{outline:none; border-color:var(--tide)}
.gate-box button{appearance:none; margin-top:10px; font:inherit; font-weight:500; font-size:.95rem; color:var(--abyss); background:var(--tide); border:0; padding:13px 16px; border-radius:2px; cursor:pointer}
.gate-box button:disabled{opacity:.6; cursor:wait}
.gate-err{font-size:.86rem; color:var(--coral); min-height:1.4em}
.gate-foot{font-family:var(--mono); font-size:.64rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); text-align:center; margin-top:6px}
</style>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="gate gut" id="gate">
  <form class="gate-box" id="gateForm" autocomplete="off" novalidate>
    <span class="sym" aria-hidden="true">✦</span>
    <span class="eyebrow">Área reservada</span>
    <h1>Mapa astral</h1>
    <p>Digite o nome de quem é o mapa e a senha que você recebeu.</p>
    <label for="nome">Nome</label>
    <input id="nome" name="mapa-titular" type="text" autocapitalize="words" autocomplete="off" data-lpignore="true" data-1p-ignore placeholder="Ex.: Maria" required>
    <label for="pw">Senha</label>
    <input id="pw" name="mapa-chave" type="password" autocomplete="new-password" data-lpignore="true" data-1p-ignore required>
    <button type="submit" id="go">Abrir mapa</button>
    <div class="gate-err" id="err" role="alert"></div>
    <div class="gate-foot">La Vie</div>
  </form>
</div>
<main id="app" hidden></main>
<script>

(function(){
  const ITER = 310000;
  const norm = s => { const w = s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/\s+/); return w[0]||''; };
  const hex = buf => Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,'0')).join('');
  async function abrir(nome, pw){
    const n = norm(nome);
    const id = hex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('lavie-mapa|'+n))).slice(0,24);
    const r = await fetch('m/' + id + '.bin', {cache:'no-store'});
    if(!r.ok) throw new Error('nao encontrado');
    const raw = new Uint8Array(await r.arrayBuffer());
    const salt = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(n+'|'+pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
    return JSON.parse(new TextDecoder().decode(plain));
  }
  document.getElementById('nome').value=''; document.getElementById('pw').value='';
  setTimeout(()=>{ const n=document.getElementById('nome'), p=document.getElementById('pw'); if(document.activeElement!==n && document.activeElement!==p){ n.value=''; p.value=''; } }, 600);
  const form = document.getElementById('gateForm'), err = document.getElementById('err'), go = document.getElementById('go');
  form.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const nome = document.getElementById('nome').value, pw = document.getElementById('pw').value;
    if(!nome.trim() || !pw){ err.textContent = 'Preencha o nome e a senha.'; return; }
    err.textContent=''; go.disabled=true; go.textContent='Abrindo…';
    let P = null;
    try{ P = await abrir(nome, pw); }catch(_){}
    if(!P){
      err.textContent = 'Nome ou senha não conferem. Confira e tente de novo.';
      go.disabled=false; go.textContent='Abrir mapa'; document.getElementById('pw').select(); return;
    }
    const app = document.getElementById('app');
    app.innerHTML = P.markup;
    document.getElementById('gate').hidden = true;
    app.hidden = false;
    document.title = P.title;
    const s = document.createElement('script'); s.textContent = P.script; document.body.appendChild(s);
    window.scrollTo(0,0);
  });
})();

/* ---------- céu de fundo ---------- */
(function(){
  const cv = document.getElementById('sky'), cx = cv.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,st=[];
  function size(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    st = Array.from({length: Math.floor(W*H/7000)}, ()=>({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.1+.25, a:Math.random()*.5+.15, p:Math.random()*6.28, s:Math.random()*.0012+.0003, w:Math.random()<.1}));
  }
  function draw(t){
    cx.clearRect(0,0,W,H);
    for(const s of st){
      const a = still ? s.a : Math.max(.05, s.a + Math.sin(t*s.s + s.p)*.22);
      cx.fillStyle = s.w ? `rgba(134,207,194,${a})` : `rgba(236,231,218,${a})`;
      cx.beginPath(); cx.arc(s.x,s.y,s.r,0,6.283); cx.fill();
    }
    if(!still) requestAnimationFrame(draw);
  }
  addEventListener('resize', size); size(); requestAnimationFrame(draw);
})();

</script>
