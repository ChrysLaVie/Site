.card input { width:100%; box-sizing:border-box; padding:13px 14px; border:1.5px solid #ccc; border-radius:10px; font:inherit; font-size:15px; text-align:center; }
.card input:focus { outline:none; border-color:#f58220; }
.card button { width:100%; margin-top:12px; padding:13px; border:none; border-radius:10px; background:#f58220; color:#ffffff; font:inherit; font-weight:600; font-size:15px; cursor:pointer; }
.err { color:#b3261e; font-size:13px; min-height:18px; margin-top:10px; }
.lv { margin-top:18px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#9a9a9a; }

async function tentar(silent){
  const code = silent ? (localStorage.getItem(LS)||'') : document.getElementById('code').value.trim();
  if(!code){ if(!silent) document.getElementById('err').textContent='Digite o código.'; return; }
  const enc=new TextEncoder();
  for(const w of WRAPS){
    try{
      const km=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(w.s),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      const mkRaw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(w.i)},key,b64d(w.k));
      const mk=await crypto.subtle.importKey('raw',mkRaw,{name:'AES-GCM'},false,['decrypt']);
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(IVC)},mk,b64d(CTC));
      try{ localStorage.setItem(LS, code); }catch(e){}
      const html=new TextDecoder().decode(pt);
      document.open(); document.write(html); document.close();
      return;
    }catch(e){}
  }
  if(!silent) document.getElementById('err').textContent='Código incorreto. Confira e tente de novo.';
}
