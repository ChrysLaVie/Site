<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Comercial · La Vie Consultoria</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Área Comercial (CRM) da La Vie. Identidade: creme, areia, taupe; grafite só em botão e selo. */
:root{
  --bg:#F2F1ED; --bg-alt:#E8E4DE; --surface:#FFFFFF; --surface-2:#FAFAF8;
  --ink:#1a1917; --charcoal:#3A3A3A; --muted:#6F6B64; --hint:#9A948C;
  --sand:#D8CFC4; --sand-lt:#EAE7E1; --accent:#8C8377;
  --border:rgba(58,58,58,0.12); --border-2:rgba(58,58,58,0.20);
  --green:#5E7A5A; --green-bg:#E6ECE2; --green-t:#46603F;
  --red:#A8553F; --red-bg:#F3E3DC; --red-t:#7E3A28;
  --amber:#A8844F; --amber-bg:#F2E9DA; --amber-t:#7A5E33;
  --blue-bg:#E3E8EC; --blue-t:#3E4F5E;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --r:6px; --shadow:0 2px 16px rgba(58,58,58,0.07); --shadow-md:0 8px 40px rgba(26,25,23,0.16);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--charcoal);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit}
.hidden{display:none !important}

/* Cabeçalho */
.top{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.top-in{max-width:1280px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;min-width:0}
.brand img{height:54px;width:auto;display:block}
.brand-t{font-family:var(--serif);font-size:25px;font-weight:500;color:var(--ink);line-height:1}
.brand-s{font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--accent);margin-top:5px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.who{font-size:12px;color:var(--muted)}
.tabs{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:11px 14px 10px;cursor:pointer;color:var(--muted);font-size:13.5px;white-space:nowrap;letter-spacing:.2px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--red-bg);color:var(--red-t);font-size:11px;font-weight:600;text-align:center}

.wrap{max-width:1280px;margin:0 auto;padding:26px 24px 80px}
.h1{font-family:var(--serif);font-size:34px;font-weight:500;color:var(--ink);line-height:1.1}
.h1 em{font-style:italic}
.sub{color:var(--muted);font-size:13.5px;margin-top:6px}
.filete{display:block;width:56px;height:1px;background:var(--accent);margin:14px 0 22px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.h2{font-family:var(--serif);font-size:23px;font-weight:500;color:var(--ink);margin:28px 0 12px}
.eyebrow{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:500}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--charcoal);background:var(--charcoal);color:#fff;padding:9px 16px;border-radius:var(--r);cursor:pointer;font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--ink)}
.btn.ghost{background:transparent;color:var(--charcoal);border-color:var(--border-2)}
.btn.ghost:hover{background:var(--sand-lt)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.danger{background:transparent;color:var(--red-t);border-color:rgba(168,85,63,.4)}
.btn.danger:hover{background:var(--red-bg)}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:none;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:12.5px;padding:0}
.link:hover{color:var(--ink)}

/* Campos */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.inp,.sel,.txa{border:1px solid var(--border-2);background:var(--surface);border-radius:var(--r);padding:9px 11px;width:100%;outline:none}
.inp:focus,.sel:focus,.txa:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(140,131,119,.18)}
.tools .inp{max-width:300px}.tools .sel{width:auto}
.txa{min-height:74px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
.fld label{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:14px}
.chk input{width:16px;height:16px;accent-color:var(--charcoal)}
.help{font-size:12px;color:var(--hint);margin-top:-6px;margin-bottom:14px}

/* Cartões e listas */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{padding:18px 20px}
.kpi .v{font-family:var(--serif);font-size:32px;color:var(--ink);line-height:1.05;margin-top:8px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:4px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.box{padding:6px 0}
.box-h{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 8px}
.box-h h3{font-family:var(--serif);font-size:20px;font-weight:500;color:var(--ink)}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 20px;border-top:1px solid var(--border);cursor:pointer}
.item:hover{background:var(--surface-2)}
.item .t{font-weight:500;color:var(--ink)}
.item .m{font-size:12.5px;color:var(--muted)}
.item .r{margin-left:auto;text-align:right;flex-shrink:0;font-size:12.5px;color:var(--muted)}
.empty{padding:18px 20px 22px;color:var(--hint);font-size:13px;border-top:1px solid var(--border)}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;background:var(--sand-lt);color:var(--charcoal);white-space:nowrap;letter-spacing:.2px}
.chip.g{background:var(--green-bg);color:var(--green-t)}
.chip.r{background:var(--red-bg);color:var(--red-t)}
.chip.a{background:var(--amber-bg);color:var(--amber-t)}
.chip.b{background:var(--blue-bg);color:var(--blue-t)}
.chip.d{background:var(--charcoal);color:#fff}
.chip.o{background:transparent;border:1px solid var(--border-2);color:var(--muted)}

/* Tabelas */
.tbl-w{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:12px 16px;border-bottom:1px solid var(--border-2);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:top}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--surface-2)}
tr:last-child td{border-bottom:none}
td .t{font-weight:500;color:var(--ink)}
td .m{font-size:12.5px;color:var(--muted)}
.num{text-align:right;white-space:nowrap}

/* Funil */
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.kcol{flex:1 0 216px;max-width:300px;background:var(--bg-alt);border-radius:8px;padding:10px;min-height:150px}
.kcol.over{outline:2px dashed var(--accent);outline-offset:-2px}
.kcol-h{display:flex;justify-content:space-between;align-items:baseline;padding:4px 6px 10px}
.kcol-h b{font-family:var(--serif);font-size:18px;font-weight:500;color:var(--ink)}
.kcol-h span{font-size:12px;color:var(--muted)}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px 12px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 4px rgba(58,58,58,.05)}
.kcard:hover{border-color:var(--border-2)}
.kcard.drag{opacity:.45}
.kcard .t{font-weight:500;color:var(--ink);line-height:1.3}
.kcard .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.kcard .f{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.kcard .v{font-size:12.5px;color:var(--ink);font-weight:500}

/* Catálogo */
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.prod{padding:18px 20px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.prod:hover{border-color:var(--border-2)}
.prod .n{font-family:var(--serif);font-size:20px;font-weight:500;color:var(--ink);line-height:1.2}
.prod .p{font-weight:600;color:var(--ink)}
.prod .dsc{font-size:12.5px;color:var(--muted);white-space:pre-line}
.calc{margin-top:8px;padding:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r)}
.calc .out{margin-top:8px;font-size:13px;color:var(--ink)}
.fx{display:grid;grid-template-columns:1fr 90px 30px;gap:8px;margin-bottom:8px;align-items:center}

/* Materiais */
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.mat{display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
.mat:hover{border-color:var(--border-2)}
.mat-img{aspect-ratio:4/5;background:var(--sand-lt);display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:12.5px;overflow:hidden}
.mat-img img,.mat-img video{width:100%;height:100%;object-fit:cover;display:block}
.mat-b{padding:14px 16px 6px;display:flex;flex-direction:column;gap:6px;flex:1}
.mat-b .n{font-family:var(--serif);font-size:20px;font-weight:500;color:var(--ink);line-height:1.2}
.mat-leg{font-size:12.5px;color:var(--muted);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.mat-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px 16px}
.uso{display:grid;grid-template-columns:150px 1fr 30px;gap:8px;margin-bottom:8px;align-items:center}

/* Janela e gaveta */
.ov{position:fixed;inset:0;background:rgba(26,25,23,.42);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:10px;box-shadow:var(--shadow-md);width:100%;max-width:640px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0}
.modal-h h3{font-family:var(--serif);font-size:26px;font-weight:500;color:var(--ink)}
.x{background:none;border:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.modal-b{padding:16px 24px 6px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 24px 22px;flex-wrap:wrap}
.modal-f .sp{margin-right:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:90;box-shadow:var(--shadow-md);overflow-y:auto;padding:22px 26px 60px}
.dr-ov{position:fixed;inset:0;background:rgba(26,25,23,.3);z-index:89}
.dl{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:13.5px}
.dl dt{color:var(--muted);font-size:12px;padding-top:1px}
.dl dd{color:var(--ink);overflow-wrap:anywhere}
.tl{border-left:1px solid var(--sand);margin-left:6px;padding-left:16px}
.tl-i{position:relative;padding:0 0 14px}
.tl-i::before{content:'';position:absolute;left:-20px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tl-i .w{font-size:11.5px;color:var(--hint)}
.msg{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--charcoal);color:#fff;padding:11px 20px;border-radius:var(--r);z-index:200;font-size:13px;box-shadow:var(--shadow-md);max-width:90vw}
.msg.err{background:var(--red-t)}
.gate{max-width:440px;margin:14vh auto;padding:40px 34px;text-align:center}
.gate img{height:84px;margin-bottom:18px}

@media (max-width:900px){
  .kpis{grid-template-columns:1fr 1fr}.cols2{grid-template-columns:1fr}
  .top-in,.tabs,.wrap{padding-left:16px;padding-right:16px}
  .row2,.row3{grid-template-columns:1fr}
  .h1{font-size:28px}.who,.brand-s{display:none}
  .drawer{padding:18px 16px 60px}
}
</style>
</head>
<body>

<div id="gate" class="gate card hidden">
  <img src="/logo.png" alt="La Vie Consultoria">
  <div class="h1" id="gate-t">Comercial</div>
  <p class="sub" id="gate-m" style="margin:10px 0 22px"></p>
  <a class="btn" href="/clientes/">Entrar pelo sistema La Vie</a>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="top-in">
      <a class="brand" href="/clientes/comercial/">
        <img src="/logo.png" alt="La Vie Consultoria">
        <div><div class="brand-t">Comercial</div><div class="brand-s">Clientes · Vendas · Produtos · Marketing</div></div>
      </a>
      <div class="top-r">
        <span class="who" id="who"></span>
        <button class="btn" data-act="novo-lead">Novo lead</button>
        <a class="btn ghost" href="/clientes/">Voltar ao R&amp;S</a>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main class="wrap" id="view"></main>
</div>

<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="msg-root"></div>

<script>
// ══ CRM La Vie · Fase 1 (18/11/2026) ════════════════════════════════════════
// Mesmo login do painel de R&S (mesmo banco, sessão compartilhada). Só o perfil
// lavie_master ativo enxerga; a regra de verdade está no banco (RLS das tabelas crm_*).
const SUPABASE_URL = 'https://pdtwypuqfnglfaadubvz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZSbHiK2ZkFT3q0OJt--4qw_Q2Oc3MMK';
const sb = window.__CRM_SB__ || supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
});

const ETAPAS = [
  ['lead','Lead novo'],['contato','Contato feito'],['diagnostico','Diagnóstico'],
  ['proposta','Proposta enviada'],['negociacao','Negociação'],['ganho','Ganho'],['perdido','Perdido']
];
const ETAPAS_ABERTAS = ['lead','contato','diagnostico','proposta','negociacao'];
const SITUACOES = [['lead','Lead'],['cliente_ativo','Cliente ativo'],['cliente_inativo','Cliente inativo'],['parceiro','Parceiro']];
const SIT_CHIP = {lead:'a',cliente_ativo:'g',cliente_inativo:'o',parceiro:'b'};
const STATUS_PROP = [['rascunho','Em elaboração'],['enviada','Enviada'],['em_analise','Em análise'],['aceita','Aceita'],['recusada','Recusada'],['vencida','Vencida'],['a_confirmar','A confirmar']];
const PROP_CHIP = {rascunho:'o',enviada:'a',em_analise:'a',aceita:'g',recusada:'r',vencida:'r',a_confirmar:'b'};
const PROP_ABERTA = ['enviada','em_analise'];
const LINHAS = ['Pessoas','Processos','Qualidade','Estratégia','Financeiro','Carreira','Contábil'];
const TIPOS_PRECO = [['fixo','Valor fixo'],['a_partir','A partir de'],['percentual_salario','Percentual do salário'],['mensal','Mensalidade'],['hora','Por hora'],['gratuito','Gratuito'],['sob_consulta','Sob consulta']];
const PUBLICOS = [['pj','Empresas'],['pf','Pessoas'],['ambos','Empresas e pessoas']];
const STATUS_PROD = [['ativo','Ativo'],['em_formatacao','Em formatação'],['inativo','Inativo']];
const TIPOS_ATIV = [['nota','Anotação'],['contato','Contato'],['reuniao','Reunião']];
const ORIGENS = ['Indicação','WhatsApp','Site (formulário de empresas)','Teste Vocacional','Instagram','LinkedIn','Grupo de vagas','Cliente atual','Parceiro','Evento','Outro'];
const ABAS = [['hoje','Hoje'],['funil','Funil'],['contas','Contas'],['propostas','Propostas'],['catalogo','Catálogo'],['materiais','Materiais']];
const CANAIS = ['WhatsApp','Instagram','LinkedIn','Facebook','Telegram','E-mail','Site','Outro'];
const TIPOS_MAT = [['arte','Arte'],['video','Vídeo'],['texto','Texto'],['documento','Documento']];
const BUCKET_MAT = 'crm-materiais';

const S = { aba:'hoje', perfil:null, contas:[], contatos:[], produtos:[], opps:[], itens:[], propostas:[], atividades:[], pagamentos:[], materiais:[], urls:{},
            f:{ contas:{q:'',sit:'',tipo:'',ocultas:false}, propostas:{q:'',status:'abertas'}, funil:{q:'',fechadas:false}, cat:{linha:'',status:''}, mat:{q:'',canal:'',arquivados:false} } };

// ── utilidades ──────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nome(lista, k){ const x = lista.find(i => i[0]===k); return x ? x[1] : (k||''); }
function hojeISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtData(iso){ if(!iso) return ''; const p=String(iso).slice(0,10).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : iso; }
function fmtDataHora(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function dias(deISO, ateISO){ const a=new Date(String(deISO).slice(0,10)+'T12:00:00'), b=new Date(String(ateISO).slice(0,10)+'T12:00:00'); return Math.round((b-a)/86400000); }
function somaDias(iso, n){ const d=new Date(String(iso).slice(0,10)+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function brl(v){ if(v==null||v==='') return ''; return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits: Number(v)%1?2:0, maximumFractionDigits:2}); }
function num(txt){ if(txt==null) return null; let s=String(txt).trim().replace(/[R$\s]/g,''); if(!s) return null; if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.'); else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,''); const n=Number(s); return isFinite(n) ? n : null; }
function pl(n, um, varios){ return n+' '+(n===1?um:varios); }
function vazio(v){ const s=(v==null?'':String(v)).trim(); return s===''?null:s; }
function opts(lista, sel, vazioTxt){ return (vazioTxt!=null?'<option value="">'+esc(vazioTxt)+'</option>':'') + lista.map(o => { const k=Array.isArray(o)?o[0]:o, t=Array.isArray(o)?o[1]:o; return '<option value="'+esc(k)+'"'+(String(sel==null?'':sel)===String(k)?' selected':'')+'>'+esc(t)+'</option>'; }).join(''); }
function conta(id){ return S.contas.find(c => c.id===id); }
function contaNome(id){ const c=conta(id); return c ? c.nome : '(conta removida)'; }
function link(url){ if(!url) return ''; const u=String(url).trim(); return /^https?:\/\//i.test(u) ? u : ''; }
function aviso(txt, erro){ const r=$('msg-root'); r.innerHTML='<div class="msg'+(erro?' err':'')+'" role="status">'+esc(txt)+'</div>'; clearTimeout(aviso._t); aviso._t=setTimeout(()=>{ r.innerHTML=''; }, erro?6000:2600); }
function falhou(r, oque){ if(r && r.error){ console.error('[CRM]', oque, r.error); aviso('Não foi possível '+oque+'. '+(r.error.message||''), true); return true; } return false; }

// ── regras de leitura ───────────────────────────────────────────────────────
function oppAberta(o){ return ETAPAS_ABERTAS.includes(o.etapa); }
function propValidaAte(p){ return (p.enviada_em && p.validade_dias) ? somaDias(p.enviada_em, p.validade_dias) : null; }
function propVencida(p){ const v=propValidaAte(p); return PROP_ABERTA.includes(p.status) && v && v < hojeISO(); }
function precoTxt(p){
  const v=brl(p.valor), a=brl(p.valor_ate);
  switch(p.tipo_preco){
    case 'fixo': return v || 'Valor a definir';
    case 'a_partir': return v ? 'A partir de '+v : 'Valor a definir';
    case 'mensal': return v ? (a ? v+' a '+a+' por mês' : v+' por mês') : 'Mensalidade a definir';
    case 'hora': return v ? (a ? v+' a '+a+' por hora' : v+' por hora') : 'Valor da hora a definir';
    case 'percentual_salario': return 'Percentual do salário da vaga';
    case 'gratuito': return 'Gratuito';
    default: return 'Sob consulta';
  }
}
function faixasDe(p){ return Array.isArray(p.faixas) ? p.faixas.filter(f => f && f.pct!=null) : []; }
function faixaTxt(fs, i){ const f=fs[i], ant = i>0 ? fs[i-1].ate : null; if(f.ate==null) return 'Acima de '+brl(ant); return (ant==null ? 'Até '+brl(f.ate) : 'De '+brl(ant+0.01)+' a '+brl(f.ate)); }
function calcHonorario(p, salario){ const fs=faixasDe(p); for(const f of fs){ if(f.ate==null || salario<=Number(f.ate)) return {pct:Number(f.pct), valor: Math.round(salario*Number(f.pct))/100}; } return null; }

// ── carga ───────────────────────────────────────────────────────────────────
async function carregar(){
  const q = (t, ord, asc) => sb.from(t).select('*').order(ord, {ascending: asc!==false});
  const rs = await Promise.all([
    q('crm_contas','nome'), q('crm_contatos','nome'), q('crm_produtos','ordem'), q('crm_oportunidades','criado_em',false),
    q('crm_oportunidade_itens','criado_em'), q('crm_propostas','enviada_em',false), sb.from('crm_atividades').select('*').order('em',{ascending:false}).limit(1000)
  ]);
  const erro = rs.find(r => r.error);
  if(erro){ console.error('[CRM] carga', erro.error); aviso('Não foi possível carregar os dados. '+(erro.error.message||''), true); }
  [S.contas,S.contatos,S.produtos,S.opps,S.itens,S.propostas,S.atividades] = rs.map(r => r.data || []);
  try{ const p = await sb.from('pagamentos').select('empresa_id,status,valor,vencimento'); S.pagamentos = p.data || []; }catch(e){ S.pagamentos=[]; }
  const m = await sb.from('crm_materiais').select('*').order('criado_em',{ascending:false});
  if(m.error){ console.error('[CRM] materiais', m.error); S.materiais = []; } else S.materiais = m.data || [];
  await assinarArquivos(S.materiais.map(x => x.arquivo_path).filter(Boolean));
}
// Os arquivos ficam em bucket privado: a página pede um link temporário (1 hora) para mostrar e baixar.
async function assinarArquivos(paths){
  const faltam = paths.filter(p => !S.urls[p]); if(!faltam.length) return;
  try{ const r = await sb.storage.from(BUCKET_MAT).createSignedUrls(faltam, 3600);
    (r.data||[]).forEach(x => { if(x && x.signedUrl && x.path) S.urls[x.path] = x.signedUrl; }); }catch(e){ console.error('[CRM] links dos arquivos', e); }
}
function trocar(lista, linha){ const i=lista.findIndex(x => x.id===linha.id); if(i>=0) lista[i]=linha; else lista.unshift(linha); }
async function recarregarAtividades(){ const r = await sb.from('crm_atividades').select('*').order('em',{ascending:false}).limit(1000); if(!r.error) S.atividades = r.data||[]; }

function matUrl(m){ return (m.arquivo_path && S.urls[m.arquivo_path]) || link(m.link_url) || ''; }
function matEh(m, re){ return re.test(String(m.arquivo_mime||'')) || re.test(String(m.arquivo_nome||m.link_url||'').split('?')[0].toLowerCase()); }
function matPrevia(m){
  const u = matUrl(m);
  if(u && matEh(m, /^image\/|\.(png|jpe?g|webp|gif)$/)) return '<img src="'+esc(u)+'" alt="" loading="lazy">';
  if(u && matEh(m, /^video\/|\.(mp4|mov|webm)$/)) return '<video src="'+esc(u)+'" muted preload="metadata"></video>';
  return '<span>'+esc(m.tipo==='texto' ? 'Só texto' : (m.arquivo_nome || 'Sem arquivo'))+'</span>';
}

async function copiarTexto(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){ const t=document.createElement('textarea'); t.value=txt; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e2){} t.remove(); return ok; }
}

async function excluir(tabela, id, lista, oque){
  const r = await sb.from(tabela).delete().eq('id', id);
  if(falhou(r,'excluir '+oque)) return false;
  S[lista] = S[lista].filter(x => x.id!==id);
  if(lista==='opps') S.itens = S.itens.filter(i => i.oportunidade_id!==id);
  if(lista!=='materiais') await recarregarAtividades();
  aviso('Excluído.');
}

async function iniciar(){
  let user = null;
  try{ const { data } = await sb.auth.getSession(); user = data && data.session ? data.session.user : null; }catch(e){}
  if(!user){ portao('Comercial', 'Esta área usa o mesmo acesso do sistema La Vie. Entre por lá e volte para cá.'); return; }
  let perfil = null;
  try{ const r = await sb.from('profiles').select('nome,nome_completo,role,ativo').eq('id', user.id).maybeSingle(); perfil = r.data; }catch(e){}
  if(!perfil || !perfil.ativo || perfil.role!=='lavie_master'){ portao('Área restrita', 'A área Comercial é de uso interno da La Vie Consultoria.'); return; }
  S.perfil = { nome: perfil.nome || perfil.nome_completo || user.email };
  $('who').textContent = perfil.nome_completo || perfil.nome || user.email;
  await carregar();
  $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
  render();
}
iniciar();
</script>
</body>
</html>
