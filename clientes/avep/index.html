const WRAPS=[{s:'4W2JcYGdkOQxYqSEf06BeA==',i:'zCrl1FGWz70jaV7k',k:'2xG1gCeF1yYlmtASpb+gd2PVGRk6lNujBJ+KivrGViL2pXofoDe1CDfOuoOn3mgm'}];
// Documentos cifrados: abre o PDF só depois do código, com a mesma chave da página
function lvDocs(mk){
  document.addEventListener('click',async e=>{
    const a=e.target.closest&&e.target.closest('a[href]'); if(!a) return;
    const m=a.href.match(/\/clientes\/[a-z-]+\/docs\/([^\/?#]+\.pdf)$/i); if(!m) return;
    e.preventDefault();
    const nome=decodeURIComponent(m[1]);
    const w=window.open('','_blank');
    if(w){ try{ w.document.title='Abrindo documento'; w.document.body.style.cssText='font:16px sans-serif;padding:24px;color:#3A3A3A;background:#F2F1ED'; w.document.body.textContent='Abrindo documento...'; }catch(x){} }
    try{
      const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('lv-doc:'+nome));
      const id=[...new Uint8Array(h)].slice(0,12).map(b=>b.toString(16).padStart(2,'0')).join('');
      const r=await fetch(a.href.slice(0,a.href.lastIndexOf('/')+1)+id+'.bin'); if(!r.ok) throw new Error(r.status);
      const buf=new Uint8Array(await r.arrayBuffer());
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},mk,buf.slice(12));
      const url=URL.createObjectURL(new Blob([pt],{type:'application/pdf'}));
      if(w&&!w.closed){ w.location.href=url; }
      else { const l=document.createElement('a'); l.href=url; l.download=nome; document.body.appendChild(l); l.click(); l.remove(); }
    }catch(err){ if(w) w.close(); alert('Não foi possível abrir o documento. Tente de novo.'); }
  },true);
}
async function tentar(silent){
  const code = silent ? (localStorage.getItem(LS)||'') : document.getElementById('code').value.trim();
  if(!code){ if(!silent) document.getElementById('err').textContent='Digite o código.'; return; }
  const enc=new TextEncoder();
  for(const w of WRAPS){
    try{
      const km=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(w.s),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      const mkRaw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(w.i)},key,b64d(w.k));
      const mk=await crypto.subtle.importKey('raw',mkRaw,{name:'AES-GCM'},false,['decrypt']);
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(IVC)},mk,b64d(CTC));
      try{ localStorage.setItem(LS, code); }catch(e){}
      const html=new TextDecoder().decode(pt);
      document.open(); document.write(html); document.close(); lvDocs(mk);
      return;
    }catch(e){}
  }
  if(!silent) document.getElementById('err').textContent='Código incorreto. Confira e tente de novo.';
}
document.getElementById('code').addEventListener('keydown',e=>{ if(e.key==='Enter') tentar(false); });
tentar(true);
