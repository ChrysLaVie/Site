.err { color:#b3261e; font-size:13px; min-height:18px; margin-top:10px; }

function b64d(s){ const b=atob(s), a=new Uint8Array(b.length); for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a.buffer; }
async function tentar(silent){
  const code = silent ? (localStorage.getItem(LS)||'') : document.getElementById('code').value.trim();
  if(!code){ if(!silent) document.getElementById('err').textContent='Digite o código.'; return; }
  try{
    const enc=new TextEncoder();
    const km=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(SALT),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);

    try{ localStorage.setItem(LS, code); }catch(e){}
    const html=new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  }catch(e){
    if(!silent) document.getElementById('err').textContent='Código incorreto. Confira e tente de novo.';
  }
}
document.getElementById('code').addEventListener('keydown',e=>{ if(e.key==='Enter') tentar(false); });
