<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --bg: #f2f5fb;
  --surface: #ffffff;
  --surface-2: #e8eef8;
  --ink: #0d1b3d;
  --muted: #52607a;
  --line: #d3dcec;
  --brand: #0b4294;
  --brand-2: #1d6fe0;
  --accent: #f8d912;
  --accent-ink: #0d1b3d;
  --btn: #0b4294;
  --btn-ink: #ffffff;
  --title: #0b4294;
  --ok: #1b7a5f;
  --ok-soft: #dcefe8;
  --warn: #9a5b00;
  --warn-soft: #f8ebcf;
  --bad: #b3261e;
  --bad-soft: #f7dcda;
  --road: #0b4294;
  --road-2: #082f6b;
  --road-ink: #ffffff;
  --road-muted: #c4d5f3;
  --focus: #1d6fe0;
  --f-display: "Rubik", "Arial Black", Arial, sans-serif;
  --f-body: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  --track: .22em;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08122b;
    --surface: #0f1c3d;
    --surface-2: #16264f;
    --ink: #e9eef9;
    --muted: #9fb0d0;
    --line: #22356a;
    --btn: #2f74e3;
    --title: #f8d912;
    --ok: #52c7a3;
    --ok-soft: #14332a;
    --warn: #f0b400;
    --warn-soft: #3a2f10;
    --bad: #ff8a80;
    --bad-soft: #3b1a18;
    --road: #0a3580;
    --road-2: #061d48;
    --focus: #6fa3ff;
  }
}
:root[data-theme="dark"] {
  --bg: #08122b;
  --surface: #0f1c3d;
  --surface-2: #16264f;
  --ink: #e9eef9;
  --muted: #9fb0d0;
  --line: #22356a;
  --btn: #2f74e3;
  --title: #f8d912;
  --ok: #52c7a3;
  --ok-soft: #14332a;
  --warn: #f0b400;
  --warn-soft: #3a2f10;
  --bad: #ff8a80;
  --bad-soft: #3b1a18;
  --road: #0a3580;
  --road-2: #061d48;
  --focus: #6fa3ff;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 var(--f-body);
  padding-inline: 16px;
}
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }

.wrap { max-width: 1120px; margin-inline: auto; }

/* ---------- topo: pista ---------- */
.road {
  background: var(--road);
  color: var(--road-ink);
  margin-inline: -16px;
  padding: 22px 16px 26px;
}
.road .wrap { display: grid; gap: 16px; }
.suite { font-family: var(--f-mono); font-size: 11px; letter-spacing: var(--track); text-transform: uppercase; color: var(--road-muted); font-weight: 600; }
.brand h1 {
  font-family: var(--f-display);
    font-weight: 800;
  font-size: clamp(26px, 5vw, 40px);
  line-height: 1.05;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.brand .sub { color: var(--road-muted); font-size: 14px; }
.tabrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.tabrow .rowlabel { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--road-muted); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  background: transparent;
  border: 1px solid #ffffff33;
  color: var(--road-ink);
  padding: 7px 14px;
  border-radius: 4px;
  font-weight: 500;
  font-size: 14px;
}
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.meter { display: grid; gap: 8px; }
.meter-top { display: flex; justify-content: space-between; gap: 12px; font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--road-muted); }
.meter-top b { color: var(--road-ink); font-weight: 500; }
.lane {
  position: relative;
  height: 14px;
  background: var(--road-2);
  border-radius: 2px;
  overflow: hidden;
}
.lane::before {
  content: "";
  position: absolute; inset: 6px 0 auto 0; height: 2px;
  background: repeating-linear-gradient(90deg, #ffffff40 0 14px, transparent 14px 26px);
}
.lane-fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); transition: width .5s ease; }
.lane-fill::after {
  content: ""; position: absolute; inset: 6px 0 auto 0; height: 2px;
  background: repeating-linear-gradient(90deg, var(--accent-ink) 0 14px, transparent 14px 26px);
}
@media (prefers-reduced-motion: reduce) { .lane-fill { transition: none; } }

/* ---------- jornada ---------- */
.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; padding-block: 28px 56px; align-items: start; }
.rail { list-style: none; margin: 0; padding: 0; position: sticky; top: env(safe-area-inset-top, 0px); display: grid; gap: 4px; }
.stop {
  display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center;
  width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: 8px 8px;
  position: relative;
}
.stop:hover { background: var(--surface-2); }
.stop[aria-current="true"] { background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.node {
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 12px; font-weight: 500;
  background: var(--surface); border: 2px solid var(--line); color: var(--muted);
  position: relative; z-index: 1;
}
.stop[aria-current="true"] .node { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.stop.done .node { background: var(--ok); border-color: var(--ok); color: #fff; }
.stop-name { font-weight: 600; line-height: 1.2; }
.stop-meta { font-size: 12.5px; color: var(--muted); }
.rail li { position: relative; }
.rail li:not(:last-child)::after {
  content: ""; position: absolute; left: 24px; top: 44px; bottom: -8px; width: 0;
  border-left: 2px dashed var(--line);
}

.day-head { display: grid; gap: 6px; margin-bottom: 18px; }
.day-head h2::after { content: ""; display: block; width: 56px; height: 5px; border-radius: 3px; background: var(--accent); margin-top: 10px; }
.brandbar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 26px; }
.brand { display: grid; gap: 4px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; font-weight: 600; letter-spacing: var(--track); text-transform: uppercase; color: var(--muted); }
.day-head h2 { color: var(--title); font-family: var(--f-display); font-weight: 800; font-size: clamp(24px, 3.6vw, 32px); line-height: 1.1; text-wrap: balance; }

.mods { display: grid; gap: 10px; }
.mod { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.mod.open { border-color: var(--ink); }
.mod-head {
  display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center;
  width: 100%; text-align: left; background: none; border: 0; padding: 14px 16px;
}
.check {
  width: 24px; height: 24px; border-radius: 4px; border: 2px solid var(--line);
  display: grid; place-items: center; font-size: 14px; line-height: 1; color: transparent;
}
.mod.done .check { background: var(--ok); border-color: var(--ok); color: #fff; }
.mod-title { font-weight: 600; font-size: 16px; line-height: 1.3; }
.mod-sub { color: var(--muted); font-size: 13.5px; }
.chev { color: var(--muted); font-family: var(--f-mono); transition: transform .2s; }
.mod.open .chev { transform: rotate(90deg); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.tag {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 3px; background: var(--surface-2); color: var(--muted);
}
.tag.live { background: var(--warn-soft); color: var(--warn); }

.mod-body { padding: 4px 16px 18px 54px; display: grid; gap: 16px; }
.slot {
  border: 1.5px dashed var(--line); border-radius: 6px; padding: 16px; color: var(--muted);
  display: grid; gap: 4px;
}
.slot b { color: var(--ink); font-weight: 600; }
.video { aspect-ratio: 16 / 9; max-width: 100%; place-content: center; text-align: center; background: var(--surface-2); border-style: solid; border-color: transparent; }
.video .play { width: 46px; height: 46px; border-radius: 50%; background: var(--road); margin: 0 auto 6px; display: grid; place-items: center; }
.video .play::after { content: ""; border-left: 14px solid var(--accent); border-block: 8px solid transparent; margin-left: 4px; }
a.slot { text-decoration: none; cursor: pointer; }
.video.linked { border: 1.5px solid var(--brand-2); background: var(--surface); }
.video.linked span { color: var(--ok); font-weight: 600; }
.video.linked:hover { border-color: var(--brand); }
.imgslot { aspect-ratio: 21 / 8; place-content: center; text-align: center; }
.content { border-style: solid; color: var(--ink); text-align: left; gap: 10px; }
.content b { font-size: 13px; font-family: var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--title); font-weight: 700; }
.content p { color: var(--ink); }
.content ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.content li::marker { color: var(--brand); }
.content .src { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
.lead-box { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 10px 12px; background: var(--surface-2); border-radius: 6px; }
.lead-box .k { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn {
  border: 1px solid var(--btn); background: var(--btn); color: var(--btn-ink);
  padding: 9px 16px; border-radius: 5px; font-weight: 600;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* quiz */
.quiz { border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 14px; }
.quiz h3 { font-size: 14px; font-family: var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.q { display: grid; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.q legend { font-weight: 600; padding: 0; margin-bottom: 6px; }
.opt { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--ink); background: var(--surface-2); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.result { padding: 10px 12px; border-radius: 5px; font-weight: 600; }
.result.pass { background: var(--ok-soft); color: var(--ok); }
.result.fail { background: var(--bad-soft); color: var(--bad); }

/* ---------- produção ---------- */
.stats { display: flex; gap: 10px 28px; flex-wrap: wrap; margin-bottom: 18px; }
.stat { display: grid; }
.stat b { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.intro { color: var(--muted); max-width: 66ch; margin-bottom: 18px; }
.tasks { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
.task { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; padding: 14px 16px; align-items: center; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.task-title { font-weight: 600; line-height: 1.35; }
.task-meta { font-size: 13px; color: var(--muted); display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 3px; }
.task-meta .mono { font-family: var(--f-mono); font-size: 12px; }
.sel { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 7px 10px; min-width: 150px; }
.sel.s-doing { border-color: var(--warn); background: var(--warn-soft); }
.sel.s-done { border-color: var(--ok); background: var(--ok-soft); }
.legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
.note { margin-top: 22px; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 6px 6px 0; color: var(--muted); font-size: 14px; max-width: 72ch; }

/* ---------- identidade AVEP ---------- */
.road { background: linear-gradient(120deg, var(--road) 0%, var(--brand-2) 100%); position: relative; padding-bottom: 32px; }
.stripe { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, #ffffff 0 33.33%, var(--accent) 33.33% 66.66%, var(--road-2) 66.66% 100%); }
.logo { height: 58px; width: auto; display: block; }
.brand h1, .day-head h2 { text-transform: uppercase; letter-spacing: .01em; }

.facts { display: grid; gap: 0; margin: 0; }
.facts div { display: grid; grid-template-columns: minmax(120px, 34%) 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.facts div:first-child { border-top: 0; }
.facts dt { color: var(--muted); font-size: 13.5px; }
.facts dd { margin: 0; font-weight: 500; }
.tbd { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 8px; border-radius: 3px; background: var(--warn-soft); color: var(--warn); }
.phase-label { font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: var(--track); text-transform: uppercase; color: var(--muted); padding: 14px 8px 4px; }
.rail li.phase-label:first-child { padding-top: 0; }
.rail li.phase-label::after { display: none; }

@media (max-width: 800px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-block: 20px 48px; }
  .rail { position: static; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); overflow-x: auto; padding-bottom: 6px; gap: 6px; }
  .rail li::after { display: none; }
  .rail li.phase-label { display: none; }
  .facts div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .mod-body { padding-left: 16px; }
  .task { grid-template-columns: minmax(0, 1fr); }
  .sel { width: 100%; }
}
</style>

      { id: 'd0', phase: 'Integração', node: 'C', name: 'Chegada', when: 'Ao chegar', modules: [
        { id: 'avep-historia', title: 'A história da AVEP', period: 'Na chegada', lead: 'Vídeo e leitura no portal',
          kinds: ['Vídeo', 'Leitura', 'Imagens', 'Prova'],
          summary: 'Antes de qualquer treinamento, o(a) novo(a) consultor(a) precisa saber onde está entrando: de onde a AVEP veio e como ela funciona hoje.',
          blocks: [
            { type: 'content', title: 'Quem é a AVEP', body: [
              'A AVEP Brasil começou em março de 2004 com caminhoneiros e transportadores. Hoje protege também carros, motos, vans e veículos de aplicativo, com sedes administrativas em Minas Gerais, Rio de Janeiro, Espírito Santo e Goiás.',
              '• Não existe mensalidade fixa. Todo mês, o custo dos consertos e reembolsos é dividido entre os associados, proporcional ao valor de cada veículo. Esse é o rateio colaborativo.',
              '• Não tem análise de perfil do motorista, como nas seguradoras. Basta estar habilitado.',
              '• Tetos de aceitação: carro de passeio até R$ 150 mil, caminhão e cavalo mecânico até R$ 500 mil, caminhão 3/4 até R$ 300 mil, semirreboque até R$ 150 mil e implemento ou carroceria até R$ 75 mil.',
              'Pela apresentação institucional, a AVEP já pagou mais de R$ 15 milhões em indenizações e recupera 87% dos veículos roubados.'
            ], source: 'Apresentação Institucional AVEP (Veículos Pesados)' },
            { type: 'content', title: 'Como falamos com o associado', body: [
              'A AVEP é uma associação, então o consultor não fala como corretor de seguro.',
              '• Use: associado, proteção veicular, rateio, evento, participação obrigatória, inspeção prévia, termo de filiação.',
              '• Evite: seguro, seguradora, apólice, sinistro, prêmio, segurado. E não chame a participação de "franquia" na frente do cliente, mesmo que a palavra circule aqui dentro.'
            ], source: 'Regulamento AVEP Brasil e relatório do Encontro 3 (La Vie)' },
            { type: 'video', label: 'Vídeo da história da AVEP' },
            { type: 'image', label: 'Fotos e marcos da empresa' },
            { type: 'content', title: 'Módulo 1.1 da apostila: a empresa e o papel do comercial', body: [
              'A integração começa pela cultura: a história da empresa, a postura esperada e o compromisso com cada pessoa do time.',
              '• Os 3 pilares, na ordem de prioridade das decisões: primeiro o que é melhor para a empresa, depois como a decisão afeta o time, por último como o indivíduo se encaixa no papel.',
              '• A missão da equipe comercial: aumentar o número de associados e gerar receita para a associação.',
              '• A negociação recomendada é a integrativa, o ganha-ganha: soluções que atendem a necessidade do cliente a um preço justo.',
              '• A venda se baseia em relacionamento: o consultor dá suporte contínuo ao associado, o que gera indicações espontâneas.'
            ], source: 'Treinamento Inicial do Consultor (Bee Educação), módulo 1.1, adaptado pela La Vie' },
            { type: 'doc', url: 'https://drive.google.com/file/d/1G1c_NxK0OfrkAchMeI03_gybQjFzH0jD/view', label: 'Apostila: Treinamento Inicial do Consultor (PDF)', note: 'Módulo 1.1 · Apresentação da empresa e onboarding comercial' },
            { type: 'quiz', qid: 'q-11', title: 'Teste de fixação · Apresentação e onboarding comercial (1.1)', qs: [
              { q: 'Qual é a ordem de prioridade dos 3 pilares na tomada de decisão?', o: ['Indivíduo, time, empresa', 'Empresa, time, indivíduo', 'Time, indivíduo, empresa'], a: 1 },
              { q: 'Qual é a missão principal da equipe comercial?', o: ['Aumentar o número de associados e gerar receita para a associação', 'Cuidar do pós-venda e dos eventos', 'Administrar o rateio do mês'], a: 0 },
              { q: 'Que tipo de negociação o treinamento recomenda?', o: ['Distributiva: convencer o cliente de que a nossa posição é a única certa', 'Nenhuma: a venda é só tirar pedido', 'Integrativa: o ganha-ganha, com soluções que atendem o cliente a preço justo'], a: 2 }

        { id: 'avep-regulamento', title: 'Treinamento do regulamento', period: 'Dia 1', lead: 'Portal, com avaliação',
          kinds: ['Leitura', 'Vídeo', 'Prova'],
          summary: 'O(a) consultor(a) estuda o regulamento e faz a prova antes de seguir. É aqui que ele aprende o que pode e o que não pode prometer ao cliente.',
          blocks: [
            { type: 'content', title: 'O que diz o Regulamento AVEP Brasil', body: [
              'A AVEP é uma associação civil de proteção veicular, regida pelo Código Civil. Não é seguradora e não vende seguro.',
              '• Filiação: a diretoria analisa o pedido em até 15 dias. O candidato só vira associado depois de pagar a taxa de matrícula.',
              '• Veículos aceitos: leves (moto, carro e caminhonete) e pesados (caminhão, cavalo mecânico e semirreboque). A AVEP pode recusar veículo de leilão, ex-sinistrado de seguradora, ex-táxi, com restrição de roubo ou furto e com chassi remarcado.',
              '• Toda inclusão passa por inspeção prévia, com fotos e decalque do chassi. A inspeção também é obrigatória na troca de veículo, na exclusão de avaria e depois de boleto em atraso.',
              '• A mensalidade tem duas partes: a taxa administrativa, que é fixa, e o rateio dos prejuízos do mês, que varia.',
              '• Quem atrasa perde o direito ao amparo na hora. Depois de 60 dias, pode ser excluído. Para voltar, paga o atrasado e faz nova inspeção.',
              '• Se o conserto passar de 75% do valor do veículo na FIPE, a indenização é integral. Abaixo disso, é reparo parcial. A AVEP tem até 30 dias, contados da entrega de todos os documentos, para pagar ou autorizar o conserto.',
              '• Quem usa um benefício se compromete a ficar 12 meses em dia. Se sair antes, a diferença sai da indenização.',
              '• Cobre colisão, capotamento, queda de objeto, granizo, enchente, incêndio acidental, roubo e furto qualificado, além da assistência 24h.',
              '• Não cobre danos morais e corporais, lucros cessantes, multas, desgaste natural, motorista embriagado ou sem CNH válida, competição, avaria já registrada na inspeção e conserto feito sem autorização. Danos a terceiros só têm amparo se o associado contratar esse benefício à parte.',
              '• Rastreador é obrigatório para pesados. Sem ele, ou desligado sem aviso, a indenização de roubo ou furto cai 30%.',
              '• Quem se desliga não recebe de volta o que pagou. Se pedir o desligamento depois do fechamento do mês, ainda paga o boleto daquele mês.'
            ], source: 'Regulamento AVEP Brasil (66 artigos). Resumo para consulta rápida, não substitui o texto integral.' },
            { type: 'content', title: 'A lei nova da proteção veicular', body: [
              'Em janeiro de 2025 saiu a Lei Complementar 213, que colocou as associações de proteção veicular sob supervisão da Susep. Em maio de 2026, a Resolução CNSP 491 definiu as regras.',
              '• As associações que já funcionavam se cadastraram na Susep até julho de 2025 e estão em processo de regularização.',
              '• Até maio de 2028, cada associação precisa contratar uma administradora autorizada pela Susep, que passa a cuidar da gestão técnica, financeira e contábil dos grupos.',
              '• Continua não sendo seguro. O custo dos eventos segue dividido entre os participantes.',
              'Por isso o consultor não deve mais dizer que proteção veicular "não é regulamentada". O certo é explicar que a associação está em regularização junto à Susep, dentro da lei nova. Antes de usar isso numa venda, confirme com a diretoria a situação do cadastro da AVEP.'
            ], source: 'Lei Complementar 213/2025, Resolução CNSP 491/2026 e comunicados da Susep' },

          blocks: [
            { type: 'content', title: 'Como uma venda anda no Power CRM', body: [
              'O Power CRM separa cada negociação em seis estágios: lead recebido, cotação recebida, em negociação, em vistoria, liberado para cadastro e finalizado.',
              '• Os leads chegam pelo Rio de Janeiro, direto para cada consultor, em volume igual por praça.',
              '• Para cotar, bastam nome, telefone e placa ou CRLV. CNH e os outros documentos ficam para depois do fechamento.',

              '• No fechamento, complete RG, CPF e e-mail e anexe CNH e comprovante de endereço (pessoa física) ou contrato social e cartão CNPJ (pessoa jurídica), junto com o CRLV e a proposta.',
              '• Depois do aceite, o cadastro segue para Belo Horizonte. Pós-venda e eventos são atendidos pela central 0800 em Minas.',
              '• Toda ligação e mensagem precisa ser registrada no Power CRM, mesmo quando sai do celular. É de lá que vêm os números de cada consultor.'
            ], source: 'Mapeamento do funil com a Darci, relatório do Encontro 3 (La Vie, 15/09/2026)' },
            { type: 'video', label: 'Gravação do alinhamento com Helen e Leonardo' },
            { type: 'image', label: 'Fluxograma do processo de venda' },
            { type: 'content', title: 'Módulo 1.3 da apostila: processos operacionais', body: [
              '• Remuneração e limites da taxa de adesão reforçados, com a regra de repasse da empresa.',

              '• Adesivo: onde instalar, o desconto que garante e os direitos do associado.',

            { type: 'quiz', qid: 'q-13', title: 'Teste de fixação · Processos operacionais (1.3)', qs: [

            { type: 'content', title: 'Método 7+1', body: [

            { type: 'content', title: 'Gatilhos de venda, usados com honestidade', body: [
              '• Reciprocidade: entregue algo útil antes de pedir a venda, como uma boa orientação sobre o veículo.',
              '• Compromisso: quando o cliente diz que proteger o caminhão é prioridade, lembre isso na hora de fechar.',
              '• Prova social: depoimentos e números reais de associados.',

              '• Escassez: só quando o prazo é real e vem de uma campanha oficial.',
              'Inventar prazo ou dizer que "restam poucas vagas" quando não é verdade é publicidade enganosa pelo Código de Defesa do Consumidor (art. 37). Num mercado que vive de confiança, isso custa caro.'

        { id: 'avep-dinamica', title: 'Dinâmica dos 30 contatos e vistoria na prática', period: 'Dia 4, tarde', lead: 'Dinâmica presencial',

          summary: 'Fechamento da semana. O(a) consultor(a) liga para gente de verdade, com o líder ao lado, e acompanha uma vistoria do começo ao fim.',
          blocks: [
            { type: 'content', title: 'Lista dos 30 contatos', body: [
              'O consultor escreve 30 nomes e telefones de pessoas que têm carro, moto ou caminhão. Começa por quem ele mais conhece e termina em quem conhece pouco.',
              '• As ligações seguem a ordem da lista. Começar por gente de confiança tira a vergonha de errar ou de pedir um tempo para responder.',
              '• O líder e um colega acompanham as ligações e dão retorno no fim do dia.',
              '• Só entram contatos da rede do próprio consultor. Quem disser que não quer receber mensagem sai da lista.'
            ], source: 'Treinamento Inicial do Consultor (Bee Educação), adaptado pela La Vie' },
            { type: 'content', title: 'Vistoria na prática', body: [
              '• O consultor acompanha uma inspeção prévia completa: fotos do veículo e das placas, decalque do chassi e registro das avarias que já existem.',
              '• Avaria registrada na inspeção não é coberta depois. Mostre ao cliente o que ficou anotado.',
              '• Veículo de leilão sofre depreciação, que às vezes só aparece no laudo. Avise o cliente de que a cotação pode mudar por isso.'
            ], source: 'Regulamento AVEP Brasil e relatório do Encontro 3' },

    if (b.type === 'content') return '<div class="slot content"><b>' + esc(b.title) + '</b>' + renderLines(b.body) + (b.source ? '<div class="src">Fonte: ' + esc(b.source) + '</div>' : '') + '</div>';
    if (b.type === 'facts') return '<div class="slot content"><b>' + esc(b.title) + '</b><dl class="facts">' + b.rows.map(function (r) {
      return '<div><dt>' + esc(r[0]) + '</dt><dd>' + (r[1] ? esc(r[1]) : '<span class="tbd">A confirmar</span>') + '</dd></div>';
    }).join('') + '</dl>' + (b.source ? '<div class="src">Fonte: ' + esc(b.source) + '</div>' : '') + '</div>';
    if (b.type === 'video') return b.url
      ? '<a class="slot video linked" href="' + esc(b.url) + '" target="_blank" rel="noopener"><div class="play"></div><b>' + esc(b.label) + '</b><span>' + esc(b.note || 'Assistir agora') + '</span></a>'
      : '<div class="slot video"><div class="play"></div><b>' + esc(b.label) + '</b><span>Vídeo a gravar</span></div>';
    if (b.type === 'doc') return '<a class="slot video linked" style="aspect-ratio:auto;padding:16px" href="' + esc(b.url) + '" target="_blank" rel="noopener"><b>' + esc(b.label) + '</b><span>' + esc(b.note || 'Abrir PDF') + '</span></a>';
    if (b.type === 'image') return '<div class="slot imgslot"><b>' + esc(b.label) + '</b><span>Imagem a inserir</span></div>';
    return '<div class="slot"><b>' + esc(b.label) + '</b><span>Texto a escrever</span></div>';
  }

  function moduleHtml(m) {
    var open = state.open === m.id, done = !!state.done[m.id];
    var tags = m.kinds.map(function (k) { return '<span class="tag">' + esc(k) + '</span>'; }).join('') +
      (m.live ? '<span class="tag live">Presencial</span>' : '');
    var head = '<button class="mod-head" data-act="toggle" data-id="' + m.id + '" aria-expanded="' + open + '">' +
      '<span class="check" aria-hidden="true">✓</span>' +
      '<span><span class="mod-title">' + esc(m.title) + '</span><br><span class="mod-sub">' + esc(m.period) + ' · ' + esc(m.lead) + '</span>' +
      '<span class="tags">' + tags + '</span></span><span class="chev" aria-hidden="true">›</span></button>';
    var body = '';
    if (open) {
      body = '<div class="mod-body"><p>' + esc(m.summary) + '</p>' +
        m.blocks.map(function (b) { return block(b, m); }).join('') +
        '<div class="actions"><button class="btn ' + (done ? 'ghost' : 'ok') + '" data-act="done" data-id="' + m.id + '">' +
        (done ? 'Desmarcar como concluído' : 'Marcar como concluído') + '</button></div></div>';
    }
    return '<article class="mod' + (open ? ' open' : '') + (done ? ' done' : '') + '">' + head + body + '</article>';
  }

  function jornada() {
    var d = CO.days.filter(function (x) { return x.id === state.day; })[0];
    var lastPhase = null;
    var rail = CO.days.map(function (x) {
      var n = dayDone(x), full = n === x.modules.length;
      var label = x.phase && x.phase !== lastPhase ? '<li class="phase-label">' + esc(x.phase) + '</li>' : '';
      lastPhase = x.phase || lastPhase;
      return label + '<li><button class="stop' + (full ? ' done' : '') + '" data-act="day" data-id="' + x.id + '"' + (x.id === state.day ? ' aria-current="true"' : '') + '>' +
        '<span class="node">' + (full ? '✓' : x.node) + '</span><span><span class="stop-name">' + esc(x.name) + '</span><br><span class="stop-meta">' + esc(x.when) + ' · ' + n + '/' + x.modules.length + '</span></span></button></li>';
    }).join('');
    return '<div class="shell"><ol class="rail" aria-label="Etapas da jornada">' + rail + '</ol><section>' +
      '<div class="day-head"><span class="eyebrow">' + (d.phase ? esc(d.phase) + ' · ' : '') + esc(d.name) + ' · ' + esc(d.when) + '</span><h2>' + esc(d.modules.length > 1 ? d.modules.length + ' etapas nesta parada' : d.modules[0].title) + '</h2></div>' +
      '<div class="mods">' + d.modules.map(moduleHtml).join('') + '</div></section></div>';
  }

  function producao() {
    var tasks = allMods.map(function (m) { return m.task; });
    var count = { todo: 0, doing: 0, done: 0 };
    tasks.forEach(function (t) { count[state.tasks[t.id] || 'todo']++; });
    var rows = allMods.map(function (m) {
      var t = m.task, s = state.tasks[t.id] || 'todo';
      var dayName = CO.days.filter(function (d) { return d.id === m.day; })[0].name;
      return '<div class="task"><div><div class="task-title">' + esc(t.text) + '</div><div class="task-meta">' +
        '<span class="mono">' + esc(dayName) + '</span><span>Responsável: ' + esc(t.owner) + '</span>' +
        '<span class="tag' + (t.origin === 'lista' ? ' live' : '') + '">' + (t.origin === 'lista' ? 'Tarefa da lista' : 'Sugerida') + '</span></div></div>' +
        '<select class="sel s-' + s + '" id="sel-' + t.id + '" data-task="' + t.id + '" aria-label="Status: ' + esc(t.text) + '">' +
        Object.keys(STATUS).map(function (k) { return '<option value="' + k + '"' + (k === s ? ' selected' : '') + '>' + STATUS[k] + '</option>'; }).join('') + '</select></div>';
    }).join('');
    return '<div class="shell" style="grid-template-columns:minmax(0,1fr)"><section>' +
      '<div class="day-head"><span class="eyebrow">Para RH e gestores</span><h2>Conteúdo a produzir</h2></div>' +
      '<p class="intro">Cada etapa da jornada da AVEP, da candidatura à integração, precisa de um treinamento pronto. Aqui fica o acompanhamento do que já foi criado e do que falta, com um responsável por tarefa.</p>' +
      '<div class="stats"><div class="stat"><b>' + count.todo + '</b><span>A fazer</span></div><div class="stat"><b>' + count.doing + '</b><span>Em andamento</span></div><div class="stat"><b>' + count.done + '</b><span>Prontos</span></div></div>' +
      '<div class="tasks">' + rows + '</div>' +
      '<div class="legend"><span class="tag">Vídeo</span><span class="tag">Leitura</span><span class="tag">Imagens</span><span class="tag">Prova</span><span class="tag">Dinâmica</span><span class="tag">Checklist</span><span class="tbd">A confirmar</span><span class="tag live">Presencial</span></div>' +
      '<p class="note">Neste protótipo, o progresso é salvo só neste navegador. Para o time inteiro enxergar o mesmo andamento, a plataforma precisa de login e banco de dados.</p>' +
      '</section></div>';
  }

  function render() {
    var total = allMods.length, n = allMods.filter(function (m) { return state.done[m.id]; }).length;
    var pct = total ? Math.round(n / total * 100) : 0;
    var top = '<header class="road"><div class="wrap">' +
      '<div class="brandbar"><img class="logo" src="' + LOGO + '" alt="AVEP Brasil">' +
      '<div class="brand"><span class="suite">Pré-boarding · Admissão · Integração</span><h1>Jornada do(a) consultor(a)</h1><span class="sub">' + esc(CO.tagline) + '</span></div></div>' +
      '<div class="tabrow"><span class="rowlabel">Ver</span><div class="tabs">' +
      '<button class="tab" data-act="view" data-id="jornada" aria-pressed="' + (state.view === 'jornada') + '">Minha jornada</button>' +
      '<button class="tab" data-act="view" data-id="producao" aria-pressed="' + (state.view === 'producao') + '">Conteúdo a produzir</button></div></div>' +
      '<div class="meter"><div class="meter-top"><span>Percurso concluído</span><b>' + n + ' de ' + total + ' etapas · ' + pct + '%</b></div>' +
      '<div class="lane" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><div class="lane-fill" style="width:' + pct + '%"></div></div></div>' +
      '</div><div class="stripe" aria-hidden="true"></div></header>';
    document.getElementById('app').innerHTML = top + '<main class="wrap">' + (state.view === 'jornada' ? jornada() : producao()) + '</main>';
  }

  var app = document.getElementById('app');
  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    if (act === 'view') { state.view = id; }
    else if (act === 'day') { state.day = id; var d = CO.days.filter(function (x) { return x.id === id; })[0]; state.open = d.modules[0].id; }
    else if (act === 'toggle') { state.open = state.open === id ? null : id; }
    else if (act === 'done') { state.done[id] = !state.done[id]; save(); }
    else if (act === 'quiz-send') { var mid = el.getAttribute('data-mod'); (state.quizzes[mid] || (state.quizzes[mid] = { answers: {}, sent: false })).sent = true; save(); }
    else if (act === 'quiz-reset') { state.quizzes[el.getAttribute('data-mod')] = { answers: {}, sent: false }; save(); }
    render();
  });
  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('input[data-q]')) {
      var mid = t.getAttribute('data-mod'), qi = +t.getAttribute('data-q');
      var qState = state.quizzes[mid] || (state.quizzes[mid] = { answers: {}, sent: false });
      qState.answers[qi] = +t.value; save(); render();
    } else if (t.matches('select[data-task]')) { state.tasks[t.getAttribute('data-task')] = t.value; save(); render(); }
  });

  render();
})();
</script>

</body></html>
